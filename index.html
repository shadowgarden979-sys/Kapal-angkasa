<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Laboratorium Uji Meriam</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #1a1a2e; }
        canvas { display: block; touch-action: none; }
        #instruksi {
            position: absolute; top: 10px; width: 100%; text-align: center;
            color: #0f0; font-family: monospace; font-size: 14px; pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="instruksi">Geser Jari = Putar Laras | Tap Layar = Tembak</div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // ==========================================
        // MEMANGGIL FILE GAMBAR DARI GITHUB
        // ==========================================
        const imgAlas = new Image(); imgAlas.src = "alas.png";
const imgRumah = new Image(); imgRumah.src = "rumah-laras.png";
const imgLaras = new Image(); imgLaras.src = "laras.png";
const imgPeluru = new Image(); imgPeluru.src = "peluru.png";

        let currentAngle = -Math.PI / 2; // mulai menghadap atas
        let targetAngle = -Math.PI / 2;
        let recoil = 0;
        let bullets = [];

        // ==========================================
        // UKURAN & POSISI ASET (hasil kalibrasi PNG)
        // ==========================================
        const RUMAH_W = 98, RUMAH_H = 109;   // rumah kubah: bagian bawah gambar, pusat rotasi di tengahnya
        const PIVOT_Y = 130.5 - RUMAH_H / 2; // pivot rumah relatif pusat canvas (+13px) agar laras tertutup atap
        const LARAS_TIP = 130.5;             // panjang laras dari sumbu rotasi ke ujung (atas)
        const PELURU_W = 7;                  // lebar peluru dirender (harus < lebar ujung laras ~10px)
        const PELURU_H = 24;                 // tinggi/panjang peluru dirender

        function handleMove(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            const mouseX = clientX - rect.left;
            const mouseY = clientY - rect.top;

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            targetAngle = Math.atan2(mouseY - centerY, mouseX - centerX);
        }

        function handleShoot(e) {
            handleMove(e);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2 + PIVOT_Y; // sumbu rotasi meriam

            // peluru muncul sedikit di dalam ujung laras agar tidak terlihat "melompat"
            const spawnDist = LARAS_TIP - 10;
            const tipX = centerX + Math.cos(currentAngle) * spawnDist;
            const tipY = centerY + Math.sin(currentAngle) * spawnDist;

            bullets.push({
                x: tipX, y: tipY,
                vx: Math.cos(currentAngle) * 10,
                vy: Math.sin(currentAngle) * 10,
                angle: currentAngle
            });

            recoil = 15;
        }

        canvas.addEventListener('pointermove', handleMove);
        canvas.addEventListener('pointerdown', handleShoot);

        function loop() {
            let diff = targetAngle - currentAngle;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            currentAngle += diff * 0.1;

            if (recoil > 0) recoil -= 1;

            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].x += bullets[i].vx;
                bullets[i].y += bullets[i].vy;
                if (bullets[i].x < 0 || bullets[i].x > canvas.width || bullets[i].y < 0 || bullets[i].y > canvas.height) {
                    bullets.splice(i, 1);
                }
            }

            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            // sumbu rotasi meriam (pusat rumah kubah)
            const px = cx;
            const py = cy + PIVOT_Y;

            if (imgAlas.complete && imgAlas.naturalWidth > 0) {
                ctx.drawImage(imgAlas, cx - imgAlas.width/2, cy - imgAlas.height/2);
            }

            if (imgLaras.complete && imgLaras.naturalWidth > 0) {
                ctx.save();
                ctx.translate(px, py);
                ctx.rotate(currentAngle + Math.PI / 2); // gambar laras aslinya menghadap atas

                // RECOIL: nilai positif = geser ke bawah pada sumbu lokal = mundur ke dalam rumah
                const recoilOffset = recoil;

                ctx.drawImage(imgLaras, -imgLaras.width/2 - 15, -130.5 + recoilOffset);
                ctx.drawImage(imgLaras, -imgLaras.width/2,      -130.5 + recoilOffset);
                ctx.drawImage(imgLaras, -imgLaras.width/2 + 15, -130.5 + recoilOffset);

                ctx.restore();
            }

            if (imgRumah.complete && imgRumah.naturalWidth > 0) {
                // RUMAH LARAS IKUT BERPUTAR mengikuti arah tembak
                ctx.save();
                ctx.translate(px, py);
                ctx.rotate(currentAngle + Math.PI / 2);
                // crop 98x109 px dari bagian bawah gambar asli (baris 76..184)
                ctx.drawImage(imgRumah, 0, 76, RUMAH_W, RUMAH_H,
                              -RUMAH_W/2, -RUMAH_H/2, RUMAH_W, RUMAH_H);
                ctx.restore();
            }

            if (imgPeluru.complete && imgPeluru.naturalWidth > 0) {
                for (let b of bullets) {
                    ctx.save();
                    ctx.translate(b.x, b.y);
                    ctx.rotate(b.angle + Math.PI / 2); // gambar peluru aslinya menghadap atas
                    ctx.drawImage(imgPeluru, -PELURU_W/2, -PELURU_H/2, PELURU_W, PELURU_H);
                    ctx.restore();
                }
            }

            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
