<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Laboratorium Uji Meriam</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #1a1a2e; }
        canvas { display: block; touch-action: none; }
        #instruksi {
            position: absolute; top: 10px; width: 100%; text-align: center;
            color: #0f0; font-family: monospace; font-size: 14px; pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="instruksi">Geser Jari = Putar | Tap Layar = Tembak Beruntun</div>
    <canvas id="gameCanvas"></canvas>

    <audio id="sfxTembak" src="tembakan.mp3" preload="auto"></audio>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const sfxTembak = document.getElementById('sfxTembak');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // ==========================================
        // MEMANGGAL FILE GAMBAR DARI GITHUB
        // ==========================================
        const imgAlas = new Image(); imgAlas.src = "alas.png";
        const imgRumah = new Image(); imgRumah.src = "rumah-laras.png";
        const imgLaras = new Image(); imgLaras.src = "laras.png";
        const imgPeluru = new Image(); imgPeluru.src = "peluru.png";

        // ==========================================
        // PENGATURAN KALIBRASI (SILAKAN OTAK-ATIK)
        // ==========================================
        // Jarak antar laras (DIPERKECIL menjadi 18 agar lebih rapat)
        const JARAK_LARAS = 18; 
        
        // Geser Laras ke atas/bawah relatif terhadap rumah.
        const LARAS_OFFSET_Y = -115; 
        
        // Posisi Pivot (Sudah Gacor, jangan diubah)
        const PIVOT_Y_OFFSET = 22; 

        // Crop ukuran rumah
        const RUMAH_W = 98, RUMAH_H = 109;   

        // ==========================================
        let currentAngle = -Math.PI / 2; 
        let targetAngle = -Math.PI / 2;
        
        let recoilKiri = 0;
        let recoilTengah = 0;
        let recoilKanan = 0;
        let giliranTembak = 0; 

        let bullets = [];
        const PELURU_W = 7;                  
        const PELURU_H = 24;                 

        function handleMove(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const mouseX = clientX - rect.left;
            const mouseY = clientY - rect.top;
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            targetAngle = Math.atan2(mouseY - centerY, mouseX - centerX);
        }

        function handleShoot(e) {
            handleMove(e);
            sfxTembak.currentTime = 0;
            sfxTembak.play().catch(err => {});

            const cx = canvas.width / 2;
            const cy = canvas.height / 2 + PIVOT_Y_OFFSET; 
            
            let offsetX = 0;
            if (giliranTembak === 0) { offsetX = -JARAK_LARAS; recoilKiri = 15; }
            if (giliranTembak === 1) { offsetX = 0; recoilTengah = 15; }
            if (giliranTembak === 2) { offsetX = JARAK_LARAS; recoilKanan = 15; }

            // Hitung posisi ujung laras
            const localTipX = offsetX;
            const localTipY = LARAS_OFFSET_Y - 100; 
            
            const cos = Math.cos(currentAngle + Math.PI / 2);
            const sin = Math.sin(currentAngle + Math.PI / 2);
            
            const tipX = cx + (localTipX * cos - localTipY * sin);
            const tipY = cy + (localTipX * sin + localTipY * cos);

            bullets.push({
                x: tipX, y: tipY,
                vx: Math.cos(currentAngle) * 15,
                vy: Math.sin(currentAngle) * 15,
                angle: currentAngle
            });

            giliranTembak = (giliranTembak + 1) % 3;
        }

        canvas.addEventListener('pointermove', handleMove);
        canvas.addEventListener('pointerdown', handleShoot);

        function loop() {
            let diff = targetAngle - currentAngle;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            currentAngle += diff * 0.1;

            if (recoilKiri > 0) recoilKiri -= 1;
            if (recoilTengah > 0) recoilTengah -= 1;
            if (recoilKanan > 0) recoilKanan -= 1;

            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].x += bullets[i].vx;
                bullets[i].y += bullets[i].vy;
                if (bullets[i].x < 0 || bullets[i].x > canvas.width || bullets[i].y < 0 || bullets[i].y > canvas.height) {
                    bullets.splice(i, 1);
                }
            }

            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            // 1. GAMBAR ALAS
            if (imgAlas.complete && imgAlas.naturalWidth > 0) {
                ctx.drawImage(imgAlas, cx - imgAlas.width/2, cy - imgAlas.height/2);
            }

            // 2. GAMBAR LARAS & RUMAH
            ctx.save();
            ctx.translate(cx, cy + PIVOT_Y_OFFSET); 
            ctx.rotate(currentAngle + Math.PI / 2); 

            if (imgLaras.complete && imgLaras.naturalWidth > 0) {
                ctx.drawImage(imgLaras, -imgLaras.width/2 - JARAK_LARAS, LARAS_OFFSET_Y + recoilKiri);
                ctx.drawImage(imgLaras, -imgLaras.width/2, LARAS_OFFSET_Y + recoilTengah);
                ctx.drawImage(imgLaras, -imgLaras.width/2 + JARAK_LARAS, LARAS_OFFSET_Y + recoilKanan);
            }

            if (imgRumah.complete && imgRumah.naturalWidth > 0) {
                ctx.drawImage(imgRumah, 0, 76, RUMAH_W, RUMAH_H,
                              -RUMAH_W/2, -RUMAH_H/2, RUMAH_W, RUMAH_H);
            }
            ctx.restore();

            // 3. GAMBAR PELURU
            if (imgPeluru.complete && imgPeluru.naturalWidth > 0) {
                for (let b of bullets) {
                    ctx.save();
                    ctx.translate(b.x, b.y);
                    ctx.rotate(b.angle + Math.PI / 2); 
                    ctx.drawImage(imgPeluru, -PELURU_W/2, -PELURU_H/2, PELURU_W, PELURU_H);
                    
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(0, 30);
                    ctx.strokeStyle = 'rgba(253, 224, 71, 0.5)';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    
                    ctx.restore();
                }
            }

            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
