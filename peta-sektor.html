<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Peta Antar Sektor</title>
<style>
body,html{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#07080d;font-family:monospace}
canvas{display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<script>
// ==========================================
// 1. KONFIGURASI
// ==========================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const SEED = 979;
const JUMLAH_SEKTOR = 50;
const DUNIA_HALF = 200;               // peta = kotak ±200 km (400×400 km)
const DUNIA_W = DUNIA_HALF * 2;
const JARAK_MIN_SEKTOR = 30;
const SEBARAN_TITIK = 170;
const NETRAL_JARAK = 115;
const JUMLAH_FAKSI = 3;
const JITTER_KM = 4;                  // simpangan maksimum simpul batas (km)
const JITTER_SKALA = 14;              // skala derau bentuk batas (km)
const SKALA_MIN = 0.2, SKALA_MAX = 12, SKALA_LANGKAH = 1.25;
const SKALA_FADE_MULAI = 0.6, SKALA_FADE_SELESAI = 1.0;
const REDUP_LAIN = 0.2;

const FAKSI = [
    { nama: 'Netral',           rgb: [120, 130, 150], markas: -1 },
    { nama: 'Aliansi Biru',     rgb: [60, 140, 255],  markas: -1 },
    { nama: 'Kekaisaran Merah', rgb: [230, 70, 70],   markas: -1 },
    { nama: 'Serikat Hijau',    rgb: [70, 200, 120],  markas: -1 }
];

// Status render (on-demand)
let rafAktif = false;
let simSX = null, simSY = null;

// Status pilihan dan kamera
const kamera = { x: 0, y: 0, skala: 1 };
let dipilih = -1;          // indeks sektor terpilih (zoom sektor)
let dipilihFaksi = -1;     // indeks faksi terpilih (zoom faksi)
let ptr = null;

// ==========================================
// 2. UTILITAS
// ==========================================
function mulberry32(a) {
    return function () {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
}

function hashKisi(x, y) {
    let h = (x * 374761393 + y * 668265263) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}

function vnoise(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = hashKisi(xi, yi), b = hashKisi(xi + 1, yi);
    const c = hashKisi(xi, yi + 1), d = hashKisi(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}

// [DATA] Goyangan simpul dipanggil sekali per simpul saat peta dibuat, bukan per piksel
function goyang(x, y) {
    const dx = (vnoise(x / JITTER_SKALA, y / JITTER_SKALA) - 0.5) * 2 * JITTER_KM;
    const dy = (vnoise((x + 311) / JITTER_SKALA, (y + 977) / JITTER_SKALA) - 0.5) * 2 * JITTER_KM;
    return [dx, dy];
}

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function rgbaStr(rgb, a) { return `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`; }
function dalamKotak(p, k) { return p.x >= k.x && p.x <= k.x + k.w && p.y >= k.y && p.y <= k.y + k.h; }
function posisi(e) { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }

// [LOGIKA] Render dijadwalkan hanya saat ada perubahan, bukan tiap frame
function minta() {
    if (rafAktif) return;
    rafAktif = true;
    requestAnimationFrame(frame);
}

// ==========================================
// 3. SEKTOR DAN MARKAS (sama dengan prototipe)
// ==========================================
const rnd = mulberry32(SEED);
const sektor = [];
let percobaan = 0;
while (sektor.length < JUMLAH_SEKTOR && percobaan < 200000) {
    percobaan++;
    const x = (rnd() * 2 - 1) * SEBARAN_TITIK;
    const y = (rnd() * 2 - 1) * SEBARAN_TITIK;
    if (sektor.every(s => Math.hypot(s.x - x, s.y - y) >= JARAK_MIN_SEKTOR)) sektor.push({ x, y });
}

const markasIdx = [0];
while (markasIdx.length < JUMLAH_FAKSI) {
    let best = -1, bestJarak = -1;
    sektor.forEach((s, i) => {
        if (markasIdx.includes(i)) return;
        let minJ = Infinity;
        for (const m of markasIdx) minJ = Math.min(minJ, Math.hypot(s.x - sektor[m].x, s.y - sektor[m].y));
        if (minJ > bestJarak) { bestJarak = minJ; best = i; }
    });
    markasIdx.push(best);
}
markasIdx.forEach((idx, f) => { FAKSI[f + 1].markas = idx; });

sektor.forEach((s, i) => {
    s.id = 'S-' + String(i + 1).padStart(2, '0');
    let bestF = -1, bestD = Infinity;
    markasIdx.forEach((m, f) => {
        const d = Math.hypot(s.x - sektor[m].x, s.y - sektor[m].y);
        if (d < bestD) { bestD = d; bestF = f; }
    });
    s.faksi = bestD > NETRAL_JARAK ? 0 : bestF + 1;
    s.markas = markasIdx.includes(i);
    s.dijelajahi = s.markas || i % 7 === 0;   // placeholder, bukan aturan permainan
    s.stasiun = s.markas || i % 9 === 4;      // placeholder
});

// ==========================================
// 4. WILAYAH: SIMPUL DAN SISI (dihitung sekali)
// ==========================================
let simpul = [];     // { x, y, tepi }
let tepiList = [];   // { a, b, s: [indeks sektor], jenis: 'peta' | 'faksi' | 'dalam' }

// [LOGIKA] Pemotongan setengah-bidang: titik yang lebih dekat ke a daripada b
function potongSetengah(poli, nx, ny, c) {
    const out = [];
    for (let k = 0; k < poli.length; k++) {
        const p = poli[k], q = poli[(k + 1) % poli.length];
        const dp = nx * p.x + ny * p.y - c, dq = nx * q.x + ny * q.y - c;
        const pin = dp <= 0, qin = dq <= 0;
        if (pin) out.push(p);
        if (pin !== qin) {
            const t = dp / (dp - dq);
            out.push({ x: p.x + (q.x - p.x) * t, y: p.y + (q.y - p.y) * t });
        }
    }
    return out;
}

function hitungJenis(e) {
    if (e.s.length < 2) e.jenis = 'peta';
    else e.jenis = sektor[e.s[0]].faksi !== sektor[e.s[1]].faksi ? 'faksi' : 'dalam';
}

function bangunWilayah() {
    const simpulMap = new Map();
    simpul = [];
    const idSimpul = (x, y) => {
        const k = Math.round(x * 1000) + ',' + Math.round(y * 1000);
        let id = simpulMap.get(k);
        if (id === undefined) {
            id = simpul.length;
            const tepi = Math.abs(Math.abs(x) - DUNIA_HALF) < 1e-6 || Math.abs(Math.abs(y) - DUNIA_HALF) < 1e-6;
            simpul.push({ x, y, tepi });
            simpulMap.set(k, id);
        }
        return id;
    };

    // Poligon tiap sektor = kotak peta dipotong ke arah setiap sektor lain
    for (let i = 0; i < sektor.length; i++) {
        let poli = [
            { x: -DUNIA_HALF, y: -DUNIA_HALF }, { x: DUNIA_HALF, y: -DUNIA_HALF },
            { x: DUNIA_HALF, y: DUNIA_HALF },   { x: -DUNIA_HALF, y: DUNIA_HALF }
        ];
        const a = sektor[i];
        for (let j = 0; j < sektor.length; j++) {
            if (i === j) continue;
            const b = sektor[j];
            poli = potongSetengah(poli, b.x - a.x, b.y - a.y,
                (b.x * b.x + b.y * b.y - a.x * a.x - a.y * a.y) / 2);
            if (poli.length < 3) break;
        }
        a.poli = poli.map(p => idSimpul(p.x, p.y));
    }

    // Sisi: pasangan simpul yang dipakai satu atau dua sektor
    const sisiMap = new Map();
    tepiList = [];
    sektor.forEach((s, i) => {
        s.tepi = [];
        const n = s.poli.length;
        for (let k = 0; k < n; k++) {
            const p = s.poli[k], q = s.poli[(k + 1) % n];
            if (p === q) continue;
            const lo = Math.min(p, q), hi = Math.max(p, q);
            const key = lo + '-' + hi;
            let e = sisiMap.get(key);
            if (!e) { e = { a: lo, b: hi, s: [] }; sisiMap.set(key, e); tepiList.push(e); }
            e.s.push(i);
        }
    });

    // Goyangan hanya pada simpul di dalam peta, supaya tepi peta tetap kotak
    for (const v of simpul) {
        if (v.tepi) continue;
        const [dx, dy] = goyang(v.x, v.y);
        v.x = clamp(v.x + dx, -DUNIA_HALF, DUNIA_HALF);
        v.y = clamp(v.y + dy, -DUNIA_HALF, DUNIA_HALF);
    }

    // Luas tiap sektor (rumus sepatu) untuk panel
    sektor.forEach(s => {
        const n = s.poli.length;
        let sum = 0;
        for (let k = 0; k < n; k++) {
            const p = simpul[s.poli[k]], q = simpul[s.poli[(k + 1) % n]];
            sum += p.x * q.y - q.x * p.y;
        }
        s.luas = Math.abs(sum) / 2;
    });

    for (const e of tepiList) {
        for (const i of e.s) sektor[i].tepi.push(e);
        hitungJenis(e);
    }
}

// [LOGIKA] Perubahan faksi: hanya sisi milik sektor ini yang dinilai ulang
function setFaksiSektor(i, f) {
    if (i < 0 || i >= sektor.length || f < 0 || f >= FAKSI.length) return false;
    sektor[i].faksi = f;
    for (const e of sektor[i].tepi) hitungJenis(e);
    minta();
    return true;
}
window.setFaksiSektor = setFaksiSektor;   // uji dari console: setFaksiSektor(12, 2)

// ==========================================
// 5. KAMERA, ZOOM, DAN PICKING
// ==========================================
function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    minta();
}
window.addEventListener('resize', resize);

function skalaAwal() { return Math.min(canvas.width, canvas.height) / (DUNIA_W + 40); }
function fadeSektor() {
    return clamp((kamera.skala - SKALA_FADE_MULAI) / (SKALA_FADE_SELESAI - SKALA_FADE_MULAI), 0, 1);
}

function toSX(xKm) { return (xKm - kamera.x) * kamera.skala + canvas.width / 2; }
function toSY(yKm) { return (yKm - kamera.y) * kamera.skala + canvas.height / 2; }
function dariSX(sx) { return (sx - canvas.width / 2) / kamera.skala + kamera.x; }
function dariSY(sy) { return (sy - canvas.height / 2) / kamera.skala + kamera.y; }

// [LOGIKA] Pilihan lama dibersihkan saat layernya tidak lagi tampil
function bersihkanPilihan() {
    const sA = fadeSektor(), fA = 1 - sA;
    if (sA < 0.3) dipilih = -1;
    if (fA < 0.3) dipilihFaksi = -1;
}

function ubahZoom(arah) {
    kamera.skala = clamp(kamera.skala * (arah > 0 ? SKALA_LANGKAH : 1 / SKALA_LANGKAH), SKALA_MIN, SKALA_MAX);
    bersihkanPilihan();
    minta();
}

function tombolKanan() {
    return [
        { id: 'pusat', x: canvas.width - 86, y: 10, w: 76, h: 32, t: 'PUSAT' },
        { id: '+', x: canvas.width - 54, y: canvas.height / 2 - 60, w: 44, h: 44, t: '+' },
        { id: '-', x: canvas.width - 54, y: canvas.height / 2 + 10, w: 44, h: 44, t: '−' }
    ];
}

// [LOGIKA] Uji titik di dalam poligon (ray casting), akurat untuk bentuk baru
function didalamPoli(poli, x, y) {
    let dalam = false;
    for (let k = 0, m = poli.length - 1; k < poli.length; m = k++) {
        const a = simpul[poli[k]], b = simpul[poli[m]];
        if ((a.y > y) !== (b.y > y) && x < (b.x - a.x) * (y - a.y) / (b.y - a.y) + a.x) dalam = !dalam;
    }
    return dalam;
}

function sektorDiTitik(x, y) {
    for (let i = 0; i < sektor.length; i++) if (didalamPoli(sektor[i].poli, x, y)) return i;
    return -1;
}

function faksiDiTitik(x, y) {
    const i = sektorDiTitik(x, y);
    return i < 0 ? -1 : sektor[i].faksi;
}

function tap(p) {
    const sA = fadeSektor(), fA = 1 - sA;
    let kena = null;
    for (const b of tombolKanan()) if (dalamKotak(p, b)) kena = b.id;

    if (kena === '+') return ubahZoom(1);
    if (kena === '-') return ubahZoom(-1);
    if (kena === 'pusat') {
        kamera.x = 0; kamera.y = 0; kamera.skala = skalaAwal();
        dipilih = -1; dipilihFaksi = -1;
        return minta();
    }

    const xKm = dariSX(p.x), yKm = dariSY(p.y);
    if (fA > 0.3) {
        const f = faksiDiTitik(xKm, yKm);
        dipilih = -1;
        dipilihFaksi = (f > 0 && f !== dipilihFaksi) ? f : -1;
    } else if (sA > 0.3) {
        const i = sektorDiTitik(xKm, yKm);
        dipilihFaksi = -1;
        dipilih = (i === dipilih) ? -1 : i;
    }
}

canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    const p = posisi(e);
    ptr = { sx: p.x, sy: p.y, lx: p.x, ly: p.y, moved: false };
});

canvas.addEventListener('pointermove', e => {
    if (!ptr) return;
    e.preventDefault();
    const p = posisi(e);
    if (Math.hypot(p.x - ptr.sx, p.y - ptr.sy) > 6) ptr.moved = true;
    if (ptr.moved) {
        kamera.x -= (p.x - ptr.lx) / kamera.skala;
        kamera.y -= (p.y - ptr.ly) / kamera.skala;
        minta();
    }
    ptr.lx = p.x; ptr.ly = p.y;
});

canvas.addEventListener('pointerup', e => {
    if (!ptr) return;
    const p = posisi(e);
    if (!ptr.moved) tap(p);
    ptr = null;
    minta();
});

canvas.addEventListener('pointercancel', () => { ptr = null; });

// ==========================================
// 6. GAMBAR
// ==========================================
function gambarLatar() {
    ctx.fillStyle = '#07080d';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    const langkah = 40;
    ctx.strokeStyle = 'rgba(120,130,160,0.06)';
    ctx.beginPath();
    const ox = ((toSX(0) % langkah) + langkah) % langkah;
    const oy = ((toSY(0) % langkah) + langkah) % langkah;
    for (let x = ox; x < canvas.width; x += langkah) { ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, canvas.height); }
    for (let y = oy; y < canvas.height; y += langkah) { ctx.moveTo(0, y + 0.5); ctx.lineTo(canvas.width, y + 0.5); }
    ctx.stroke();
}

// [RENDER] Simpul dikonversi ke layar sekali per frame, bukan per sisi
function hitungLayar() {
    if (!simSX || simSX.length !== simpul.length) {
        simSX = new Float32Array(simpul.length);
        simSY = new Float32Array(simpul.length);
    }
    for (let v = 0; v < simpul.length; v++) {
        simSX[v] = toSX(simpul[v].x);
        simSY[v] = toSY(simpul[v].y);
    }
}

function jalurPoli(poli) {
    ctx.beginPath();
    ctx.moveTo(simSX[poli[0]], simSY[poli[0]]);
    for (let k = 1; k < poli.length; k++) ctx.lineTo(simSX[poli[k]], simSY[poli[k]]);
    ctx.closePath();
}

// Sisi disorot saat sektor atau faksi terpilih: batas dilebarkan
function sisiSorot(e) {
    if (e.jenis === 'peta') return false;
    if (dipilih >= 0 && e.s.includes(dipilih)) return true;
    if (dipilihFaksi > 0 && e.jenis === 'faksi' && e.s.some(i => sektor[i].faksi === dipilihFaksi)) return true;
    return false;
}

// [RENDER] Isi wilayah per sektor (poligon), batas sebagai garis vektor dengan tebal tetap dalam piksel
function gambarWilayah(sA, fA) {
    hitungLayar();

    for (let i = 0; i < sektor.length; i++) {
        const s = sektor[i];
        const rgb = FAKSI[s.faksi].rgb;
        const kualitas = s.faksi === 0 ? 0.5 : 1;
        const redup = dipilihFaksi > 0 && s.faksi !== dipilihFaksi ? REDUP_LAIN : 1;
        jalurPoli(s.poli);
        if (fA > 0.01) {
            ctx.fillStyle = rgbaStr(rgb, 0.28 * fA * kualitas * redup);
            ctx.fill();
        }
        if (sA > 0.01) {
            ctx.fillStyle = rgbaStr(rgb, (i === dipilih ? 0.55 : 0.3) * sA * kualitas);
            ctx.fill();
        }
    }

    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (const e of tepiList) {
        if (e.jenis === 'dalam' && sA < 0.01) continue;
        if (e.jenis !== 'dalam' && Math.max(fA, sA) < 0.01) continue;

        let lw, rgb, a;
        if (sisiSorot(e)) { lw = 4; rgb = [253, 224, 71]; a = 1; }
        else if (e.jenis === 'peta') { lw = 2; rgb = [255, 255, 255]; a = 0.9; }
        else if (e.jenis === 'faksi') { lw = 1.5; rgb = [255, 255, 255]; a = 0.85 * Math.max(fA, sA); }
        else { lw = 0.6; rgb = [255, 255, 255]; a = 0.25 * sA; }

        ctx.strokeStyle = rgbaStr(rgb, a);
        ctx.lineWidth = lw;
        ctx.beginPath();
        ctx.moveTo(simSX[e.a], simSY[e.a]);
        ctx.lineTo(simSX[e.b], simSY[e.b]);
        ctx.stroke();
    }
}

function gambarTitikSektor(sA) {
    if (sA < 0.01) return;
    ctx.globalAlpha = sA;
    for (const s of sektor) {
        const sx = toSX(s.x), sy = toSY(s.y);
        if (sx < -30 || sy < -30 || sx > canvas.width + 30 || sy > canvas.height + 30) continue;
        const warna = FAKSI[s.faksi].rgb;
        const idx = sektor.indexOf(s);
        if (idx === dipilih) {
            ctx.strokeStyle = '#fde68a';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(sx, sy, 10, 0, Math.PI * 2);
            ctx.stroke();
        }
        ctx.beginPath();
        ctx.arc(sx, sy, s.markas ? 5 : 3, 0, Math.PI * 2);
        ctx.fillStyle = s.dijelajahi ? rgbaStr(warna, 1) : 'rgba(90,100,120,0.8)';
        ctx.fill();
        if (s.stasiun && s.dijelajahi) {
            ctx.fillStyle = '#fde68a';
            ctx.fillRect(sx + 6, sy - 10, 6, 6);
        }
        if (kamera.skala > 0.5) {
            ctx.font = '10px monospace';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';
            ctx.fillStyle = s.dijelajahi ? '#fde68a' : 'rgba(180,190,210,0.6)';
            ctx.fillText(s.dijelajahi ? s.id : '?', sx + 8, sy + 3);
        }
    }
    ctx.globalAlpha = 1;
}

function gambarMarkas(fA) {
    if (fA < 0.01) return;
    for (let f = 1; f <= JUMLAH_FAKSI; f++) {
        const m = sektor[FAKSI[f].markas];
        const sx = toSX(m.x), sy = toSY(m.y);
        const warna = FAKSI[f].rgb;
        const r = f === dipilihFaksi ? 13 : 10;
        const redup = dipilihFaksi > 0 && f !== dipilihFaksi ? REDUP_LAIN : 1;

        ctx.globalAlpha = fA * redup;
        ctx.beginPath();
        ctx.arc(sx, sy, r + 6, 0, Math.PI * 2);
        ctx.fillStyle = rgbaStr(warna, 0.25);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(sx, sy, r, 0, Math.PI * 2);
        ctx.fillStyle = rgbaStr(warna, 1);
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.font = '12px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillStyle = '#fde68a';
        ctx.fillText(FAKSI[f].nama, sx, sy + r + 8);
    }
    ctx.globalAlpha = 1;
}

function gambarPanel(sA) {
    const jumlah = FAKSI.map((_, i) => sektor.filter(s => s.faksi === i).length);
    const dijelajahi = sektor.filter(s => s.dijelajahi).length;
    const stasiun = sektor.filter(s => s.stasiun && s.dijelajahi).length;

    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(8, 8, 300, 74);
    ctx.fillStyle = '#fde68a';
    ctx.font = '13px monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText('PETA ANTAR SEKTOR', 16, 14);
    ctx.fillText(`Sektor: ${sektor.length}   Dijelajahi: ${dijelajahi}`, 16, 34);
    ctx.fillText(`Stasiun aktif: ${stasiun}`, 16, 52);
    ctx.fillText(`Zoom: ${kamera.skala.toFixed(2)}`, 16, 68);

    let ly = 90;
    ctx.font = '11px monospace';
    FAKSI.forEach((f, i) => {
        ctx.fillStyle = rgbaStr(f.rgb, 1);
        ctx.fillRect(16, ly + 2, 10, 10);
        ctx.fillStyle = '#fde68a';
        ctx.fillText(`${f.nama} (${jumlah[i]})`, 32, ly);
        ly += 16;
    });

    if (dipilihFaksi > 0) {
        const f = FAKSI[dipilihFaksi];
        const pw = 260, ph = 80;
        const px = 8, py = canvas.height - ph - 110;
        ctx.fillStyle = 'rgba(0,0,0,0.8)';
        ctx.fillRect(px, py, pw, ph);
        ctx.strokeStyle = '#fde68a';
        ctx.strokeRect(px + 0.5, py + 0.5, pw - 1, ph - 1);
        ctx.fillStyle = '#fde68a';
        ctx.font = '13px monospace';
        ctx.fillText(f.nama, px + 10, py + 10);
        ctx.font = '11px monospace';
        ctx.fillStyle = '#e5e7eb';
        ctx.fillText(`Markas: ${sektor[f.markas].id}`, px + 10, py + 30);
        ctx.fillText(`Wilayah: ${jumlah[dipilihFaksi]} sektor`, px + 10, py + 46);
    }

    if (sA > 0.3 && dipilih >= 0) {
        const s = sektor[dipilih];
        const pw = 260, ph = 120;
        const px = 8, py = canvas.height - ph - 110;
        ctx.fillStyle = 'rgba(0,0,0,0.8)';
        ctx.fillRect(px, py, pw, ph);
        ctx.strokeStyle = '#fde68a';
        ctx.strokeRect(px + 0.5, py + 0.5, pw - 1, ph - 1);
        ctx.fillStyle = '#fde68a';
        ctx.font = '13px monospace';
        ctx.fillText(`${s.id}  (${FAKSI[s.faksi].nama})`, px + 10, py + 10);
        ctx.font = '11px monospace';
        ctx.fillStyle = '#e5e7eb';
        ctx.fillText(`Luas: ${s.luas.toFixed(0)} km²`, px + 10, py + 30);
        ctx.fillText(`Status: ${s.dijelajahi ? 'sudah dijelajahi' : 'belum dijelajahi'}`, px + 10, py + 46);
        ctx.fillText(`Stasiun: ${s.stasiun ? (s.dijelajahi ? 'aktif' : 'ada, belum terbaca') : 'tidak ada'}`, px + 10, py + 62);
    }

    for (const b of tombolKanan()) {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.strokeStyle = '#fde68a';
        ctx.lineWidth = 2;
        ctx.strokeRect(b.x, b.y, b.w, b.h);
        ctx.fillStyle = '#fde68a';
        ctx.font = '13px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(b.t, b.x + b.w / 2, b.y + b.h / 2);
    }
}

function gambar() {
    const sA = fadeSektor(), fA = 1 - sA;
    gambarLatar();
    gambarWilayah(sA, fA);
    gambarTitikSektor(sA);
    gambarMarkas(fA);
    gambarPanel(sA);
}

// ==========================================
// 7. LOOP (on-demand)
// ==========================================
function frame() {
    rafAktif = false;
    try { gambar(); } catch (err) { console.error(err); }
}

// ==========================================
// 8. MULAI
// ==========================================
resize();
bangunWilayah();
kamera.skala = skalaAwal();
minta();
</script>
