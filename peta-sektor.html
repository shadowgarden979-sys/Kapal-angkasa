<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Peta Antar Sektor</title>
<style>
body,html{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#07080d;font-family:monospace}
#bintang{position:fixed;left:0;top:0;z-index:0;pointer-events:none}
#gameCanvas{position:fixed;left:0;top:0;z-index:1;touch-action:none}
</style>
</head>
<body>
<canvas id="bintang"></canvas>
<canvas id="gameCanvas"></canvas>

<script>
// ==========================================
// 1. KONFIGURASI
// ==========================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const bgCanvas = document.getElementById('bintang');
const bgCtx = bgCanvas.getContext('2d');

const SEED = 979;
const DUNIA_HALF = 2500;              // peta 5.000 × 5.000 km
const DUNIA_W = DUNIA_HALF * 2;
const GRID_N = 78;                    // 78 × 78 sel awal → ±6.084 sektor
const CELL_KM = DUNIA_W / GRID_N;     // ±64 km per sisi (rata-rata)
const JITTER_SEL = 0.4;               // titik sektor digeser maks 40% dari sel
const JITTER_KM = 6;                  // simpangan simpul batas (km)
const JITTER_SKALA = 14;              // skala derau bentuk batas (km)
const WINDOW_SEL = 3;                 // tetangga yang dipotong saat membentuk Voronoi
const JUMLAH_FAKSI = 4;               // faksi aktif, Netral tidak dihitung
const NETRAL_JARAK = 1200;            // km dari markas, di luar ini Netral
const SKALA_MIN = 0.2, SKALA_MAX = 12, SKALA_LANGKAH = 1.25;
const SKALA_FADE_MULAI = 0.6, SKALA_FADE_SELESAI = 1.0;
const REDUP_LAIN = 0.2;

const BINTANG_N = 180;
const BINTANG_HZ = 10;
const GRID_ALPHA = 0.05;

// Faksi 4 sementara: nama dan warna bisa diganti
const FAKSI = [
    { nama: 'Netral',           rgb: [120, 130, 150], markas: -1 },
    { nama: 'Aliansi Biru',     rgb: [60, 140, 255],  markas: -1 },
    { nama: 'Kekaisaran Merah', rgb: [230, 70, 70],   markas: -1 },
    { nama: 'Serikat Hijau',    rgb: [70, 200, 120],  markas: -1 },
    { nama: 'Faksi Ungu',       rgb: [168, 85, 247],  markas: -1 }
];

let rafAktif = false;
const kamera = { x: 0, y: 0, skala: SKALA_MIN };
let dipilih = -1;
let dipilihFaksi = -1;
let ptr = null;
let bOffX = 0, bOffY = 0;             // geseran latar untuk efek parallax
let bintang = [];
let sektor = [];
let simpul = [];
let tepiList = [];
let seedAt = [];                      // indeks sektor per sel grid

// ==========================================
// 2. UTILITAS
// ==========================================
function mulberry32(a) {
    return function () {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
}

function hashKisi(x, y) {
    let h = (x * 374761393 + y * 668265263) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}

function vnoise(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = hashKisi(xi, yi), b = hashKisi(xi + 1, yi);
    const c = hashKisi(xi, yi + 1), d = hashKisi(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}

// [DATA] Dipanggil sekali per simpul saat peta dibuat
function goyang(x, y) {
    const dx = (vnoise(x / JITTER_SKALA, y / JITTER_SKALA) - 0.5) * 2 * JITTER_KM;
    const dy = (vnoise((x + 311) / JITTER_SKALA, (y + 977) / JITTER_SKALA) - 0.5) * 2 * JITTER_KM;
    return [dx, dy];
}

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function wrap(v, m) { return ((v % m) + m) % m; }
function rgbaStr(rgb, a) { return `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a})`; }
function dalamKotak(p, k) { return p.x >= k.x && p.x <= k.x + k.w && p.y >= k.y && p.y <= k.y + k.h; }
function posisi(e) { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }

// [LOGIKA] Render hanya saat ada perubahan
function minta() {
    if (rafAktif) return;
    rafAktif = true;
    requestAnimationFrame(frame);
}

// ==========================================
// 3. LATAR BINTANG (parallax)
// ==========================================
function buatBintang() {
    const r = mulberry32(4242);
    bintang = [];
    for (let i = 0; i < BINTANG_N; i++) {
        const d = 0.15 + r() * 0.85;      // kedalaman: besar = dekat = ikut geseran lebih kuat
        bintang.push({
            x: r(), y: r(),
            d,
            r: 0.4 + d * 1.1,
            vx: (r() - 0.5) * 4,          // drift pelan, px/s
            vy: (r() - 0.5) * 4,
            ph: r() * Math.PI * 2,
            sp: 0.6 + r() * 1.4,
            base: 0.35 + r() * 0.5
        });
    }
}

// [RENDER] Lapisan bintang: posisi dihitung dari waktu dan geseran, tidak ada akumulasi dt
function gambarBintang() {
    const w = bgCanvas.width, h = bgCanvas.height;
    if (!w || !h) return;
    const t = performance.now() / 1000;
    bgCtx.clearRect(0, 0, w, h);
    for (const s of bintang) {
        const x = wrap(s.x * w + s.vx * t + bOffX * s.d, w);
        const y = wrap(s.y * h + s.vy * t + bOffY * s.d, h);
        const a = s.base * (0.55 + 0.45 * Math.sin(t * s.sp + s.ph));
        bgCtx.fillStyle = `rgba(220,230,255,${a.toFixed(3)})`;
        bgCtx.beginPath();
        bgCtx.arc(x, y, s.r, 0, Math.PI * 2);
        bgCtx.fill();
    }
}

setInterval(() => {
    if (!document.hidden) gambarBintang();
}, 1000 / BINTANG_HZ);

// ==========================================
// 4. SEKTOR, MARKAS, DAN FAKSI
// ==========================================
// [DATA] Titik sektor dari grid berjitter: tidak perlu cek jarak minimum
function bangunSektor() {
    const rnd = mulberry32(SEED);
    sektor = [];
    seedAt = new Array(GRID_N * GRID_N).fill(-1);
    for (let gj = 0; gj < GRID_N; gj++) {
        for (let gi = 0; gi < GRID_N; gi++) {
            const x = -DUNIA_HALF + (gi + 0.5 + (rnd() - 0.5) * 2 * JITTER_SEL) * CELL_KM;
            const y = -DUNIA_HALF + (gj + 0.5 + (rnd() - 0.5) * 2 * JITTER_SEL) * CELL_KM;
            seedAt[gi + gj * GRID_N] = sektor.length;
            sektor.push({ x, y, gi, gj, faksi: 0, markas: false, poli: [], tepi: [], bb: null, luas: 0 });
        }
    }
    sektor.forEach((s, i) => {
        s.id = 'S-' + String(i + 1).padStart(4, '0');
        s.dijelajahi = false;   // placeholder, diisi nanti
        s.stasiun = false;
    });
}

// [DATA] Markas: titik terjauh berurutan (farthest point) dari satu titik awal acak
function pilihMarkas() {
    const rnd = mulberry32(SEED + 1);
    const markas = [Math.floor(rnd() * sektor.length)];
    while (markas.length < JUMLAH_FAKSI) {
        let best = -1, bestJ = -1;
        for (let i = 0; i < sektor.length; i++) {
            if (markas.includes(i)) continue;
            let mj = Infinity;
            for (const m of markas) mj = Math.min(mj, Math.hypot(sektor[i].x - sektor[m].x, sektor[i].y - sektor[m].y));
            if (mj > bestJ) { bestJ = mj; best = i; }
        }
        markas.push(best);
    }
    markas.forEach((si, k) => { FAKSI[k + 1].markas = si; sektor[si].markas = true; });

    sektor.forEach(s => {
        let bestF = -1, bestD = Infinity;
        markas.forEach((m, k) => {
            const d = Math.hypot(s.x - sektor[m].x, s.y - sektor[m].y);
            if (d < bestD) { bestD = d; bestF = k; }
        });
        s.faksi = bestD > NETRAL_JARAK ? 0 : bestF + 1;
        s.dijelajahi = s.markas || s.id.endsWith('7');  // placeholder
        s.stasiun = s.markas || s.id.endsWith('3');     // placeholder
    });
}

// ==========================================
// 5. WILAYAH: VORONOI, SIMPUL, DAN SISI (dihitung sekali)
// ==========================================
function potongSetengah(poli, nx, ny, c) {
    const out = [];
    for (let k = 0; k < poli.length; k++) {
        const p = poli[k], q = poli[(k + 1) % poli.length];
        const dp = nx * p.x + ny * p.y - c, dq = nx * q.x + ny * q.y - c;
        const pin = dp <= 0, qin = dq <= 0;
        if (pin) out.push(p);
        if (pin !== qin) {
            const t = dp / (dp - dq);
            out.push({ x: p.x + (q.x - p.x) * t, y: p.y + (q.y - p.y) * t });
        }
    }
    return out;
}

function hitungJenis(e) {
    if (e.s.length < 2) e.jenis = 'peta';
    else e.jenis = sektor[e.s[0]].faksi !== sektor[e.s[1]].faksi ? 'faksi' : 'dalam';
}

// [DATA] Tiap sektor dipotong hanya oleh tetangga dalam jendela grid (bukan semua sektor)
function bangunWilayah() {
    const simpulMap = new Map();
    simpul = [];
    const idSimpul = (x, y) => {
        const k = Math.round(x * 1000) + ',' + Math.round(y * 1000);
        let id = simpulMap.get(k);
        if (id === undefined) {
            id = simpul.length;
            const tepi = Math.abs(Math.abs(x) - DUNIA_HALF) < 1e-6 || Math.abs(Math.abs(y) - DUNIA_HALF) < 1e-6;
            simpul.push({ x, y, tepi });
            simpulMap.set(k, id);
        }
        return id;
    };

    for (const a of sektor) {
        let poli = [
            { x: -DUNIA_HALF, y: -DUNIA_HALF }, { x: DUNIA_HALF, y: -DUNIA_HALF },
            { x: DUNIA_HALF, y: DUNIA_HALF },   { x: -DUNIA_HALF, y: DUNIA_HALF }
        ];
        for (let dj = -WINDOW_SEL; dj <= WINDOW_SEL; dj++) {
            for (let di = -WINDOW_SEL; di <= WINDOW_SEL; di++) {
                if (di === 0 && dj === 0) continue;
                const gi = a.gi + di, gj = a.gj + dj;
                if (gi < 0 || gj < 0 || gi >= GRID_N || gj >= GRID_N) continue;
                const b = sektor[seedAt[gi + gj * GRID_N]];
                poli = potongSetengah(poli, b.x - a.x, b.y - a.y,
                    (b.x * b.x + b.y * b.y - a.x * a.x - a.y * a.y) / 2);
            }
        }
        a.poli = poli.map(p => idSimpul(p.x, p.y));
    }

    const sisiMap = new Map();
    tepiList = [];
    for (let i = 0; i < sektor.length; i++) {
        const s = sektor[i];
        s.tepi = [];
        const n = s.poli.length;
        for (let k = 0; k < n; k++) {
            const p = s.poli[k], q = s.poli[(k + 1) % n];
            if (p === q) continue;
            const lo = Math.min(p, q), hi = Math.max(p, q);
            const key = lo + '-' + hi;
            let e = sisiMap.get(key);
            if (!e) { e = { a: lo, b: hi, s: [] }; sisiMap.set(key, e); tepiList.push(e); }
            e.s.push(i);
        }
    }

    for (const v of simpul) {
        if (v.tepi) continue;
        const [dx, dy] = goyang(v.x, v.y);
        v.x = clamp(v.x + dx, -DUNIA_HALF, DUNIA_HALF);
        v.y = clamp(v.y + dy, -DUNIA_HALF, DUNIA_HALF);
    }

    for (const s of sektor) {
        const n = s.poli.length;
        let sum = 0, minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        for (let k = 0; k < n; k++) {
            const p = simpul[s.poli[k]], q = simpul[s.poli[(k + 1) % n]];
            sum += p.x * q.y - q.x * p.y;
            minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
            minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
        }
        s.luas = Math.abs(sum) / 2;
        s.bb = [minX, minY, maxX, maxY];
    }

    for (const e of tepiList) {
        for (const i of e.s) sektor[i].tepi.push(e);
        hitungJenis(e);
    }
}

// [LOGIKA] Perubahan faksi hanya menilai ulang sisi sektor ini
function setFaksiSektor(i, f) {
    if (i < 0 || i >= sektor.length || f < 0 || f >= FAKSI.length) return false;
    sektor[i].faksi = f;
    for (const e of sektor[i].tepi) hitungJenis(e);
    minta();
    return true;
}
window.setFaksiSektor = setFaksiSektor;

// ==========================================
// 6. KAMERA, ZOOM, DAN PICKING
// ==========================================
function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    bgCanvas.width = window.innerWidth;
    bgCanvas.height = window.innerHeight;
    jepitKamera();
    minta();
}
window.addEventListener('resize', resize);

// [LOGIKA] Kamera terkunci di dalam peta. Jika layar lebih lebar dari peta, kamera di tengah.
function jepitKamera() {
    const hw = canvas.width / 2 / kamera.skala;
    const hh = canvas.height / 2 / kamera.skala;
    kamera.x = (hw * 2 >= DUNIA_W) ? 0 : clamp(kamera.x, -DUNIA_HALF + hw, DUNIA_HALF - hw);
    kamera.y = (hh * 2 >= DUNIA_W) ? 0 : clamp(kamera.y, -DUNIA_HALF + hh, DUNIA_HALF - hh);
}

function fadeSektor() {
    return clamp((kamera.skala - SKALA_FADE_MULAI) / (SKALA_FADE_SELESAI - SKALA_FADE_MULAI), 0, 1);
}

function toSX(xKm) { return (xKm - kamera.x) * kamera.skala + canvas.width / 2; }
function toSY(yKm) { return (yKm - kamera.y) * kamera.skala + canvas.height / 2; }
function dariSX(sx) { return (sx - canvas.width / 2) / kamera.skala + kamera.x; }
function dariSY(sy) { return (sy - canvas.height / 2) / kamera.skala + kamera.y; }

function bersihkanPilihan() {
    const sA = fadeSektor(), fA = 1 - sA;
    if (sA < 0.3) dipilih = -1;
    if (fA < 0.3) dipilihFaksi = -1;
}

function ubahZoom(arah) {
    kamera.skala = clamp(kamera.skala * (arah > 0 ? SKALA_LANGKAH : 1 / SKALA_LANGKAH), SKALA_MIN, SKALA_MAX);
    jepitKamera();
    bersihkanPilihan();
    minta();
}

function tombolKanan() {
    return [
        { id: 'pusat', x: canvas.width - 86, y: 10, w: 76, h: 32, t: 'PUSAT' },
        { id: '+', x: canvas.width - 54, y: canvas.height / 2 - 60, w: 44, h: 44, t: '+' },
        { id: '-', x: canvas.width - 54, y: canvas.height / 2 + 10, w: 44, h: 44, t: '−' }
    ];
}

function didalamPoli(poli, x, y) {
    let dalam = false;
    for (let k = 0, m = poli.length - 1; k < poli.length; m = k++) {
        const a = simpul[poli[k]], b = simpul[poli[m]];
        if ((a.y > y) !== (b.y > y) && x < (b.x - a.x) * (y - a.y) / (b.y - a.y) + a.x) dalam = !dalam;
    }
    return dalam;
}

// [LOGIKA] Pencarian sektor hanya di 3×3 sel sekitar titik, bukan semua sektor
function sektorDiTitik(x, y) {
    const gi = Math.floor((x + DUNIA_HALF) / CELL_KM);
    const gj = Math.floor((y + DUNIA_HALF) / CELL_KM);
    for (let dj = -1; dj <= 1; dj++) {
        for (let di = -1; di <= 1; di++) {
            const ci = gi + di, cj = gj + dj;
            if (ci < 0 || cj < 0 || ci >= GRID_N || cj >= GRID_N) continue;
            const i = seedAt[ci + cj * GRID_N];
            if (didalamPoli(sektor[i].poli, x, y)) return i;
        }
    }
    return -1;
}

function faksiDiTitik(x, y) {
    const i = sektorDiTitik(x, y);
    return i < 0 ? -1 : sektor[i].faksi;
}

function tap(p) {
    const sA = fadeSektor(), fA = 1 - sA;
    let kena = null;
    for (const b of tombolKanan()) if (dalamKotak(p, b)) kena = b.id;

    if (kena === '+') return ubahZoom(1);
    if (kena === '-') return ubahZoom(-1);
    if (kena === 'pusat') {
        kamera.x = 0; kamera.y = 0; kamera.skala = SKALA_MIN;
        dipilih = -1; dipilihFaksi = -1;
        return minta();
    }

    const xKm = dariSX(p.x), yKm = dariSY(p.y);
    if (fA > 0.3) {
        const f = faksiDiTitik(xKm, yKm);
        dipilih = -1;
        dipilihFaksi = (f > 0 && f !== dipilihFaksi) ? f : -1;
    } else if (sA > 0.3) {
        const i = sektorDiTitik(xKm, yKm);
        dipilihFaksi = -1;
        dipilih = (i === dipilih) ? -1 : i;
    }
    minta();
}

canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    const p = posisi(e);
    ptr = { sx: p.x, sy: p.y, lx: p.x, ly: p.y, moved: false };
});

canvas.addEventListener('pointermove', e => {
    if (!ptr) return;
    e.preventDefault();
    const p = posisi(e);
    if (Math.hypot(p.x - ptr.sx, p.y - ptr.sy) > 6) ptr.moved = true;
    if (ptr.moved) {
        const xLama = kamera.x, yLama = kamera.y;
        kamera.x -= (p.x - ptr.lx) / kamera.skala;
        kamera.y -= (p.y - ptr.ly) / kamera.skala;
        jepitKamera();
        // Latar hanya bergeser sejauh kamera benar-benar bergerak (berhenti di tepi peta)
        bOffX += (kamera.x - xLama) * -kamera.skala;
        bOffY += (kamera.y - yLama) * -kamera.skala;
        minta();
    }
    ptr.lx = p.x; ptr.ly = p.y;
});

canvas.addEventListener('pointerup', e => {
    if (!ptr) return;
    const p = posisi(e);
    if (!ptr.moved) tap(p);
    ptr = null;
    minta();
});

canvas.addEventListener('pointercancel', () => { ptr = null; });

// ==========================================
// 7. GAMBAR
// ==========================================
function batasLayar() {
    return { x0: dariSX(0), x1: dariSX(canvas.width), y0: dariSY(0), y1: dariSY(canvas.height) };
}

function bbDalam(bb, v) {
    return bb[2] >= v.x0 && bb[0] <= v.x1 && bb[3] >= v.y0 && bb[1] <= v.y1;
}

function gambarGrid() {
    const langkah = 40;
    ctx.strokeStyle = `rgba(120,130,160,${GRID_ALPHA})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    const ox = ((toSX(0) % langkah) + langkah) % langkah;
    const oy = ((toSY(0) % langkah) + langkah) % langkah;
    for (let x = ox; x < canvas.width; x += langkah) { ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, canvas.height); }
    for (let y = oy; y < canvas.height; y += langkah) { ctx.moveTo(0, y + 0.5); ctx.lineTo(canvas.width, y + 0.5); }
    ctx.stroke();
}

function jalurPoli(poli) {
    let v = simpul[poli[0]];
    ctx.moveTo(toSX(v.x), toSY(v.y));
    for (let k = 1; k < poli.length; k++) {
        v = simpul[poli[k]];
        ctx.lineTo(toSX(v.x), toSY(v.y));
    }
    ctx.closePath();
}

function strokeBatch(list) {
    if (!list.length) return;
    ctx.beginPath();
    for (const e of list) {
        const a = simpul[e.a], b = simpul[e.b];
        ctx.moveTo(toSX(a.x), toSY(a.y));
        ctx.lineTo(toSX(b.x), toSY(b.y));
    }
    ctx.stroke();
}

function sisiSorot(e) {
    if (e.jenis === 'peta') return false;
    if (dipilih >= 0 && e.s.includes(dipilih)) return true;
    if (dipilihFaksi > 0 && e.jenis === 'faksi' && e.s.some(i => sektor[i].faksi === dipilihFaksi)) return true;
    return false;
}

// [RENDER] Isi faksi meredup menuju ruang kosong saat zoom masuk.
// Setiap faksi digambar sebagai satu path, bukan satu fill per sektor.
function gambarWilayah(sA, fA) {
    const v = batasLayar();
    const vis = [];
    for (let i = 0; i < sektor.length; i++) if (bbDalam(sektor[i].bb, v)) vis.push(i);

    if (fA > 0.01) {
        for (let f = 0; f < FAKSI.length; f++) {
            const redup = dipilihFaksi > 0 && f !== dipilihFaksi ? REDUP_LAIN : 1;
            const kualitas = f === 0 ? 0.5 : 1;
            ctx.fillStyle = rgbaStr(FAKSI[f].rgb, 0.14 * fA * kualitas * redup);
            ctx.beginPath();
            for (const i of vis) if (sektor[i].faksi === f) jalurPoli(sektor[i].poli);
            ctx.fill();
        }
    }

    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    const batch = { peta: [], faksi: [], dalam: [] };
    const sorot = [];
    for (const e of tepiList) {
        const a = simpul[e.a], b = simpul[e.b];
        const minX = Math.min(a.x, b.x), maxX = Math.max(a.x, b.x);
        const minY = Math.min(a.y, b.y), maxY = Math.max(a.y, b.y);
        if (maxX < v.x0 || minX > v.x1 || maxY < v.y0 || minY > v.y1) continue;
        if (sisiSorot(e)) sorot.push(e);
        else batch[e.jenis].push(e);
    }

    ctx.strokeStyle = 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 0.8;
    strokeBatch(batch.peta);

    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.lineWidth = 0.8;
    strokeBatch(batch.faksi);

    if (sA > 0.01) {
        ctx.strokeStyle = `rgba(255,255,255,${(0.08 * sA).toFixed(3)})`;
        ctx.lineWidth = 0.5;
        strokeBatch(batch.dalam);
    }

    ctx.strokeStyle = 'rgba(253,224,71,1)';
    ctx.lineWidth = 3;
    strokeBatch(sorot);
}

function gambarTitikSektor(sA) {
    if (sA < 0.01) return;
    const v = batasLayar();
    ctx.globalAlpha = sA;
    for (let i = 0; i < sektor.length; i++) {
        const s = sektor[i];
        if (!bbDalam(s.bb, v)) continue;
        const sx = toSX(s.x), sy = toSY(s.y);
        const warna = FAKSI[s.faksi].rgb;

        if (i === dipilih) {
            ctx.strokeStyle = '#fde68a';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(sx, sy, 10, 0, Math.PI * 2);
            ctx.stroke();
        }
        ctx.beginPath();
        ctx.arc(sx, sy, s.markas ? 5 : 3, 0, Math.PI * 2);
        ctx.fillStyle = s.dijelajahi ? rgbaStr(warna, 1) : 'rgba(90,100,120,0.8)';
        ctx.fill();

        if (s.stasiun && s.dijelajahi) {
            ctx.fillStyle = '#fde68a';
            ctx.fillRect(sx + 6, sy - 10, 6, 6);
        }
        if (kamera.skala > 0.5) {
            ctx.font = '10px monospace';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';
            ctx.fillStyle = s.dijelajahi ? '#fde68a' : 'rgba(180,190,210,0.6)';
            ctx.fillText(s.dijelajahi ? s.id : '?', sx + 8, sy + 3);
        }
    }
    ctx.globalAlpha = 1;
}

function gambarMarkas(fA) {
    if (fA < 0.01) return;
    for (let f = 1; f < FAKSI.length; f++) {
        const m = sektor[FAKSI[f].markas];
        const sx = toSX(m.x), sy = toSY(m.y);
        const warna = FAKSI[f].rgb;
        const r = f === dipilihFaksi ? 13 : 10;
        const redup = dipilihFaksi > 0 && f !== dipilihFaksi ? REDUP_LAIN : 1;

        ctx.globalAlpha = fA * redup;
        ctx.beginPath();
        ctx.arc(sx, sy, r + 6, 0, Math.PI * 2);
        ctx.fillStyle = rgbaStr(warna, 0.25);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(sx, sy, r, 0, Math.PI * 2);
        ctx.fillStyle = rgbaStr(warna, 1);
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.font = '12px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillStyle = '#fde68a';
        ctx.fillText(FAKSI[f].nama, sx, sy + r + 8);
    }
    ctx.globalAlpha = 1;
}

function gambarPanel(sA) {
    const jumlah = FAKSI.map((_, i) => sektor.filter(s => s.faksi === i).length);
    const dijelajahi = sektor.filter(s => s.dijelajahi).length;
    const stasiun = sektor.filter(s => s.stasiun && s.dijelajahi).length;

    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(8, 8, 300, 74);
    ctx.fillStyle = '#fde68a';
    ctx.font = '13px monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText('PETA ANTAR SEKTOR', 16, 14);
    ctx.fillText(`Sektor: ${sektor.length}   Dijelajahi: ${dijelajahi}`, 16, 34);
    ctx.fillText(`Stasiun aktif: ${stasiun}`, 16, 52);
    ctx.fillText(`Zoom: ${kamera.skala.toFixed(2)}`, 16, 68);

    let ly = 90;
    ctx.font = '11px monospace';
    FAKSI.forEach((f, i) => {
        ctx.fillStyle = rgbaStr(f.rgb, 1);
        ctx.fillRect(16, ly + 2, 10, 10);
        ctx.fillStyle = '#fde68a';
        ctx.fillText(`${f.nama} (${jumlah[i]})`, 32, ly);
        ly += 16;
    });

    if (dipilihFaksi > 0) {
        const f = FAKSI[dipilihFaksi];
        const pw = 260, ph = 80;
        const px = 8, py = canvas.height - ph - 110;
        ctx.fillStyle = 'rgba(0,0,0,0.8)';
        ctx.fillRect(px, py, pw, ph);
        ctx.strokeStyle = '#fde68a';
        ctx.strokeRect(px + 0.5, py + 0.5, pw - 1, ph - 1);
        ctx.fillStyle = '#fde68a';
        ctx.font = '13px monospace';
        ctx.fillText(f.nama, px + 10, py + 10);
        ctx.font = '11px monospace';
        ctx.fillStyle = '#e5e7eb';
        ctx.fillText(`Markas: ${sektor[f.markas].id}`, px + 10, py + 30);
        ctx.fillText(`Wilayah: ${jumlah[dipilihFaksi]} sektor`, px + 10, py + 46);
    }

    if (sA > 0.3 && dipilih >= 0) {
        const s = sektor[dipilih];
        const pw = 260, ph = 120;
        const px = 8, py = canvas.height - ph - 110;
        ctx.fillStyle = 'rgba(0,0,0,0.8)';
        ctx.fillRect(px, py, pw, ph);
        ctx.strokeStyle = '#fde68a';
        ctx.strokeRect(px + 0.5, py + 0.5, pw - 1, ph - 1);
        ctx.fillStyle = '#fde68a';
        ctx.font = '13px monospace';
        ctx.fillText(`${s.id}  (${FAKSI[s.faksi].nama})`, px + 10, py + 10);
        ctx.font = '11px monospace';
        ctx.fillStyle = '#e5e7eb';
        ctx.fillText(`Luas: ${s.luas.toFixed(0)} km²`, px + 10, py + 30);
        ctx.fillText(`Status: ${s.dijelajahi ? 'sudah dijelajahi' : 'belum dijelajahi'}`, px + 10, py + 46);
        ctx.fillText(`Stasiun: ${s.stasiun ? (s.dijelajahi ? 'aktif' : 'ada, belum terbaca') : 'tidak ada'}`, px + 10, py + 62);
    }

    for (const b of tombolKanan()) {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.strokeStyle = '#fde68a';
        ctx.lineWidth = 2;
        ctx.strokeRect(b.x, b.y, b.w, b.h);
        ctx.fillStyle = '#fde68a';
        ctx.font = '13px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(b.t, b.x + b.w / 2, b.y + b.h / 2);
    }
}

function gambar() {
    const sA = fadeSektor(), fA = 1 - sA;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    gambarGrid();
    gambarWilayah(sA, fA);
    gambarTitikSektor(sA);
    gambarMarkas(fA);
    gambarPanel(sA);
}

// ==========================================
// 8. LOOP (on-demand)
// ==========================================
function frame() {
    rafAktif = false;
    try {
        gambarBintang();
        gambar();
    } catch (err) { console.error(err); }
}

// ==========================================
// 9. MULAI
// ==========================================
resize();
buatBintang();
bangunSektor();
pilihMarkas();
bangunWilayah();
kamera.skala = SKALA_MIN;
jepitKamera();
minta();
</script>
