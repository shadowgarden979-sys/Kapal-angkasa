<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Peta Antar Sektor</title>
<style>
body,html{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#07080d;font-family:monospace}
canvas{display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<script>
// ==========================================
// 1. KONFIGURASI
// ==========================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Satuan dunia: km. Dunia 400 x 400 km, berpusat di (0, 0)
const SEED = 979;
const JUMLAH_SEKTOR = 50;
const DUNIA_HALF = 200;
const DUNIA_W = DUNIA_HALF * 2;
const JARAK_MIN_SEKTOR = 30;
const SEBARAN_TITIK = 170;
const NOISE_AMPLITUDO = 26;
const NETRAL_JARAK = 115;             // km, sektor lebih jauh dari semua markas = netral
const JUMLAH_FAKSI = 3;               // faksi di luar netral
const SKALA_MIN = 0.2, SKALA_MAX = 12, SKALA_LANGKAH = 1.25;
const SKALA_FADE_MULAI = 0.6;         // di bawah ini hanya lapisan faksi
const SKALA_FADE_SELESAI = 1.0;       // di atas ini hanya lapisan sektor

// Indeks 0 = netral. 1..3 = faksi dengan markas
const FAKSI = [
    { nama: 'Netral',           rgb: [120, 130, 150], markas: -1 },
    { nama: 'Aliansi Biru',     rgb: [60, 140, 255],  markas: -1 },
    { nama: 'Kekaisaran Merah', rgb: [230, 70, 70],   markas: -1 },
    { nama: 'Serikat Hijau',    rgb: [70, 200, 120],  markas: -1 }
];

// ==========================================
// 2. RANDOM TETAP DAN NOISE
// ==========================================
function mulberry32(a) {
    return function () {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
}

function hashKisi(x, y) {
    let h = (x * 374761393 + y * 668265263) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}

function vnoise(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = hashKisi(xi, yi), b = hashKisi(xi + 1, yi);
    const c = hashKisi(xi, yi + 1), d = hashKisi(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}

// Gangguan tepi: satu medan untuk semua sektor, batas bersama selalu sama di kedua sisi
function gangguan(xKm, yKm) {
    const n = vnoise(xKm / 22, yKm / 22) * 0.6 + vnoise(xKm / 9, yKm / 9) * 0.4;
    return (n - 0.5) * 2 * NOISE_AMPLITUDO;
}

// ==========================================
// 3. DATA SEKTOR, MARKAS, DAN KEPEMILIKAN
// ==========================================
const rnd = mulberry32(SEED);
const sektor = [];

let percobaan = 0;
while (sektor.length < JUMLAH_SEKTOR && percobaan < 200000) {
    percobaan++;
    const x = (rnd() * 2 - 1) * SEBARAN_TITIK;
    const y = (rnd() * 2 - 1) * SEBARAN_TITIK;
    let cukup = true;
    for (const s of sektor) {
        if (Math.hypot(s.x - x, s.y - y) < JARAK_MIN_SEKTOR) { cukup = false; break; }
    }
    if (cukup) sektor.push({ x, y });
}

// Markas: sektor dipilih berurutan, selalu yang paling jauh dari markas yang sudah ada
const markasIdx = [0];
while (markasIdx.length < JUMLAH_FAKSI) {
    let best = -1, bestJarak = -1;
    sektor.forEach((s, i) => {
        if (markasIdx.includes(i)) return;
        let minJ = Infinity;
        for (const m of markasIdx) minJ = Math.min(minJ, Math.hypot(s.x - sektor[m].x, s.y - sektor[m].y));
        if (minJ > bestJarak) { bestJarak = minJ; best = i; }
    });
    markasIdx.push(best);
}
markasIdx.forEach((idx, f) => { FAKSI[f + 1].markas = idx; });

// Kepemilikan: markas terdekat. Jauh dari semua markas = netral
sektor.forEach((s, i) => {
    s.id = 'S-' + String(i + 1).padStart(2, '0');
    let bestF = -1, bestD = Infinity;
    markasIdx.forEach((m, f) => {
        const d = Math.hypot(s.x - sektor[m].x, s.y - sektor[m].y);
        if (d < bestD) { bestD = d; bestF = f; }
    });
    s.faksi = bestD > NETRAL_JARAK ? 0 : bestF + 1;
    s.markas = markasIdx.includes(i);
    s.dijelajahi = s.markas || i % 7 === 0;
    s.stasiun = s.markas || i % 9 === 4;
});

// ==========================================
// 4. PETA WILAYAH (dua lapisan, dihitung sekali)
// ==========================================
const sektorCanvas = document.createElement('canvas');
const faksiCanvas = document.createElement('canvas');
sektorCanvas.width = faksiCanvas.width = DUNIA_W;
sektorCanvas.height = faksiCanvas.height = DUNIA_W;

function bangunWilayah() {
    const pemilik = new Int16Array(DUNIA_W * DUNIA_W);
    const faksiPx = new Uint8Array(DUNIA_W * DUNIA_W);

    for (let py = 0; py < DUNIA_W; py++) {
        for (let px = 0; px < DUNIA_W; px++) {
            const xKm = -DUNIA_HALF + px + 0.5;
            const yKm = -DUNIA_HALF + py + 0.5;
            const g = gangguan(xKm, yKm);
            let best = -1, bestSkor = Infinity;
            for (let i = 0; i < sektor.length; i++) {
                const d = Math.hypot(xKm - sektor[i].x, yKm - sektor[i].y) + g;
                if (d < bestSkor) { bestSkor = d; best = i; }
            }
            const p = py * DUNIA_W + px;
            pemilik[p] = best;
            faksiPx[p] = sektor[best].faksi;
        }
    }

    const sImg = sektorCanvas.getContext('2d').createImageData(DUNIA_W, DUNIA_W);
    const fImg = faksiCanvas.getContext('2d').createImageData(DUNIA_W, DUNIA_W);
    const sd = sImg.data, fd = fImg.data;

    for (let py = 0; py < DUNIA_W; py++) {
        for (let px = 0; px < DUNIA_W; px++) {
            const p = py * DUNIA_W + px;
            const o = p * 4;
            const fk = faksiPx[p];
            const rgb = FAKSI[fk].rgb;

            const kananS = px + 1 < DUNIA_W ? pemilik[p + 1] : pemilik[p];
            const bawahS = py + 1 < DUNIA_W ? pemilik[p + DUNIA_W] : pemilik[p];
            const kananF = px + 1 < DUNIA_W ? faksiPx[p + 1] : fk;
            const bawahF = py + 1 < DUNIA_W ? faksiPx[p + DUNIA_W] : fk;
            const batasSektor = kananS !== pemilik[p] || bawahS !== pemilik[p];
            const batasFaksi = kananF !== fk || bawahF !== fk;

            // Lapisan sektor: warna faksi, garis tipis antar sektor
            sd[o] = rgb[0]; sd[o + 1] = rgb[1]; sd[o + 2] = rgb[2];
            sd[o + 3] = fk === 0 ? 40 : 70;
            if (batasSektor) {
                const sameFaksi = !batasFaksi;
                sd[o] = 235; sd[o + 1] = 240; sd[o + 2] = 250;
                sd[o + 3] = sameFaksi ? 60 : 160;
            }

            // Lapisan faksi: warna faksi, garis hanya di batas antar faksi
            fd[o] = rgb[0]; fd[o + 1] = rgb[1]; fd[o + 2] = rgb[2];
            fd[o + 3] = fk === 0 ? 35 : 95;
            if (batasFaksi) {
                fd[o] = 240; fd[o + 1] = 245; fd[o + 2] = 255; fd[o + 3] = 230;
            }
        }
    }
    sektorCanvas.getContext('2d').putImageData(sImg, 0, 0);
    faksiCanvas.getContext('2d').putImageData(fImg, 0, 0);
}

// ==========================================
// 5. KAMERA DAN INTERAKSI
// ==========================================
const kamera = { x: 0, y: 0, skala: 1 };
let dipilih = -1;           // indeks sektor terpilih
let dipilihFaksi = -1;      // indeks faksi terpilih (1..3)
let tampilPesan = '';
let pesanWaktu = 0;
let tombolTeleport = [];
let ptr = null;

function skalaAwal() {
    return Math.min(canvas.width, canvas.height) / (DUNIA_W + 40);
}
kamera.skala = skalaAwal();

function toSX(xKm) { return (xKm - kamera.x) * kamera.skala + canvas.width / 2; }
function toSY(yKm) { return (yKm - kamera.y) * kamera.skala + canvas.height / 2; }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

function posisi(e) {
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
}

function ubahZoom(arah) {
    kamera.skala = clamp(kamera.skala * (arah > 0 ? SKALA_LANGKAH : 1 / SKALA_LANGKAH), SKALA_MIN, SKALA_MAX);
}

function dalamKotak(p, k) {
    return p.x >= k.x && p.x <= k.x + k.w && p.y >= k.y && p.y <= k.y + k.h;
}

function tombolKanan() {
    return [
        { id: 'pusat', x: canvas.width - 86, y: 10, w: 76, h: 32, t: 'PUSAT' },
        { id: '+', x: canvas.width - 54, y: canvas.height / 2 - 60, w: 44, h: 44, t: '+' },
        { id: '-', x: canvas.width - 54, y: canvas.height / 2 + 10, w: 44, h: 44, t: '−' }
    ];
}

function sektorTerdekat(sx, sy, batas) {
    let best = -1, bestJarak = batas;
    sektor.forEach((s, i) => {
        const d = Math.hypot(toSX(s.x) - sx, toSY(s.y) - sy);
        if (d < bestJarak) { bestJarak = d; best = i; }
    });
    return best;
}

function faksiTerdekat(sx, sy, batas) {
    let best = -1, bestJarak = batas;
    for (let f = 1; f <= JUMLAH_FAKSI; f++) {
        const m = sektor[FAKSI[f].markas];
        const d = Math.hypot(toSX(m.x) - sx, toSY(m.y) - sy);
        if (d < bestJarak) { bestJarak = d; best = f; }
    }
    return best;
}

canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    const p = posisi(e);
    ptr = { sx: p.x, sy: p.y, lx: p.x, ly: p.y, moved: false };
});

canvas.addEventListener('pointermove', e => {
    if (!ptr) return;
    e.preventDefault();
    const p = posisi(e);
    if (Math.hypot(p.x - ptr.sx, p.y - ptr.sy) > 6) ptr.moved = true;
    if (ptr.moved) {
        kamera.x -= (p.x - ptr.lx) / kamera.skala;
        kamera.y -= (p.y - ptr.ly) / kamera.skala;
    }
    ptr.lx = p.x; ptr.ly = p.y;
});

canvas.addEventListener('pointerup', e => {
    if (!ptr) return;
    const p = posisi(e);
    if (!ptr.moved) {
        const sA = clamp((kamera.skala - SKALA_FADE_MULAI) / (SKALA_FADE_SELESAI - SKALA_FADE_MULAI), 0, 1);
        const fA = 1 - sA;
        let kena = null;
        for (const b of tombolKanan()) if (dalamKotak(p, b)) kena = b.id;

        if (kena === '+') ubahZoom(1);
        else if (kena === '-') ubahZoom(-1);
        else if (kena === 'pusat') { kamera.x = 0; kamera.y = 0; kamera.skala = skalaAwal(); }
        else {
            let tp = null;
            for (const t of tombolTeleport) if (dalamKotak(p, t)) tp = t;
            if (tp) {
                tampilPesan = `Teleport ke ${sektor[tp.idx].id} (demo, belum terhubung ke kapal)`;
                pesanWaktu = performance.now();
            } else {
                dipilih = -1; dipilihFaksi = -1;
                const f = fA > 0.3 ? faksiTerdekat(p.x, p.y, 22) : -1;
                if (f > 0) dipilihFaksi = f;
                else if (sA > 0.3) dipilih = sektorTerdekat(p.x, p.y, 18);
            }
        }
    }
    ptr = null;
});

canvas.addEventListener('pointercancel', () => { ptr = null; });

// ==========================================
// 6. GAMBAR
// ==========================================
function gambarLatar() {
    ctx.fillStyle = '#07080d';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    const langkah = 40;
    ctx.strokeStyle = 'rgba(120,130,160,0.06)';
    ctx.beginPath();
    const ox = ((toSX(0) % langkah) + langkah) % langkah;
    const oy = ((toSY(0) % langkah) + langkah) % langkah;
    for (let x = ox; x < canvas.width; x += langkah) { ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, canvas.height); }
    for (let y = oy; y < canvas.height; y += langkah) { ctx.moveTo(0, y + 0.5); ctx.lineTo(canvas.width, y + 0.5); }
    ctx.stroke();
}

function gambarWilayah(sA, fA) {
    const x0 = toSX(-DUNIA_HALF), y0 = toSY(-DUNIA_HALF);
    const ukuran = DUNIA_W * kamera.skala;
    if (fA > 0.01) {
        ctx.globalAlpha = fA;
        ctx.drawImage(faksiCanvas, x0, y0, ukuran, ukuran);
    }
    if (sA > 0.01) {
        ctx.globalAlpha = sA;
        ctx.drawImage(sektorCanvas, x0, y0, ukuran, ukuran);
    }
    ctx.globalAlpha = 1;
    ctx.strokeStyle = 'rgba(253,224,71,0.35)';
    ctx.lineWidth = 1;
    ctx.setLineDash([6, 6]);
    ctx.strokeRect(x0, y0, ukuran, ukuran);
    ctx.setLineDash([]);
}

function gambarTeleport() {
    const stasiunAktif = sektor.map((s, i) => i).filter(i => sektor[i].stasiun && sektor[i].dijelajahi);
    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = '#fde68a';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([5, 5]);
    for (let a = 0; a < stasiunAktif.length; a++) {
        for (let b = a + 1; b < stasiunAktif.length; b++) {
            const A = sektor[stasiunAktif[a]], B = sektor[stasiunAktif[b]];
            ctx.beginPath();
            ctx.moveTo(toSX(A.x), toSY(A.y));
            ctx.lineTo(toSX(B.x), toSY(B.y));
            ctx.stroke();
        }
    }
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
}

// Lapisan sektor: titik kecil dan label
function gambarTitikSektor(sA) {
    ctx.globalAlpha = sA;
    sektor.forEach((s, i) => {
        const sx = toSX(s.x), sy = toSY(s.y);
        if (sx < -30 || sy < -30 || sx > canvas.width + 30 || sy > canvas.height + 30) return;
        const warna = FAKSI[s.faksi].rgb;

        if (i === dipilih) {
            ctx.strokeStyle = '#fde68a';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(sx, sy, 12, 0, Math.PI * 2);
            ctx.stroke();
        }

        ctx.beginPath();
        ctx.arc(sx, sy, s.markas ? 6 : 4, 0, Math.PI * 2);
        if (s.dijelajahi) {
            ctx.fillStyle = `rgb(${warna[0]},${warna[1]},${warna[2]})`;
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1;
            ctx.stroke();
        } else {
            ctx.fillStyle = 'rgba(90,100,120,0.8)';
            ctx.fill();
        }

        if (s.stasiun && s.dijelajahi) {
            ctx.fillStyle = '#fde68a';
            ctx.fillRect(sx + 6, sy - 10, 6, 6);
        }

        if (kamera.skala > 0.5) {
            ctx.font = '10px monospace';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';
            ctx.fillStyle = s.dijelajahi ? '#fde68a' : 'rgba(180,190,210,0.6)';
            ctx.fillText(s.dijelajahi ? s.id : '?', sx + 8, sy + 3);
        }
    });
    ctx.globalAlpha = 1;
}

// Lapisan faksi: markas sebagai penanda utama
function gambarMarkas(fA) {
    ctx.globalAlpha = fA;
    for (let f = 1; f <= JUMLAH_FAKSI; f++) {
        const m = sektor[FAKSI[f].markas];
        const sx = toSX(m.x), sy = toSY(m.y);
        const warna = FAKSI[f].rgb;
        const r = f === dipilihFaksi ? 13 : 10;

        ctx.beginPath();
        ctx.arc(sx, sy, r + 6, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${warna[0]},${warna[1]},${warna[2]},0.25)`;
        ctx.fill();

        ctx.beginPath();
        ctx.arc(sx, sy, r, 0, Math.PI * 2);
        ctx.fillStyle = `rgb(${warna[0]},${warna[1]},${warna[2]})`;
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.font = '12px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillStyle = '#fde68a';
        ctx.fillText(FAKSI[f].nama, sx, sy + r + 8);
    }
    ctx.globalAlpha = 1;
}

function hitungFaksi() {
    return FAKSI.map((_, i) => sektor.filter(s => s.faksi === i).length);
}

function gambarPanel(sA) {
    tombolTeleport = [];
    const jumlah = hitungFaksi();
    const dijelajahi = sektor.filter(s => s.dijelajahi).length;
    const stasiun = sektor.filter(s => s.stasiun && s.dijelajahi).length;

    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(8, 8, 300, 74);
    ctx.fillStyle = '#fde68a';
    ctx.font = '13px monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText('PETA ANTAR SEKTOR', 16, 14);
    ctx.fillText(`Sektor: ${sektor.length}   Dijelajahi: ${dijelajahi}`, 16, 34);
    ctx.fillText(`Stasiun aktif: ${stasiun}`, 16, 52);
    ctx.fillText(`Zoom: ${kamera.skala.toFixed(2)}`, 16, 68);

    let ly = 90;
    ctx.font = '11px monospace';
    FAKSI.forEach((f, i) => {
        ctx.fillStyle = `rgb(${f.rgb[0]},${f.rgb[1]},${f.rgb[2]})`;
        ctx.fillRect(16, ly + 2, 10, 10);
        ctx.fillStyle = '#fde68a';
        ctx.fillText(`${f.nama} (${jumlah[i]})`, 32, ly);
        ly += 16;
    });

    if (dipilihFaksi > 0) {
        const f = FAKSI[dipilihFaksi];
        const pw = 260, ph = 80;
        const px = 8, py = canvas.height - ph - 110;
        ctx.fillStyle = 'rgba(0,0,0,0.8)';
        ctx.fillRect(px, py, pw, ph);
        ctx.strokeStyle = '#fde68a';
        ctx.strokeRect(px + 0.5, py + 0.5, pw - 1, ph - 1);
        ctx.fillStyle = '#fde68a';
        ctx.font = '13px monospace';
        ctx.fillText(f.nama, px + 10, py + 10);
        ctx.font = '11px monospace';
        ctx.fillStyle = '#e5e7eb';
        ctx.fillText(`Markas: ${sektor[f.markas].id}`, px + 10, py + 30);
        ctx.fillText(`Wilayah: ${jumlah[dipilihFaksi]} sektor`, px + 10, py + 46);
    }

    if (sA > 0.3 && dipilih >= 0) {
        const pilih = sektor[dipilih];
        const pw = 260, ph = 120;
        const px = 8, py = canvas.height - ph - 110;
        ctx.fillStyle = 'rgba(0,0,0,0.8)';
        ctx.fillRect(px, py, pw, ph);
        ctx.strokeStyle = '#fde68a';
        ctx.strokeRect(px + 0.5, py + 0.5, pw - 1, ph - 1);
        ctx.fillStyle = '#fde68a';
        ctx.font = '13px monospace';
        ctx.fillText(`${pilih.id}  (${FAKSI[pilih.faksi].nama})`, px + 10, py + 10);
        ctx.font = '11px monospace';
        ctx.fillStyle = '#e5e7eb';
        ctx.fillText(`Posisi: ${pilih.x.toFixed(0)}, ${pilih.y.toFixed(0)} km`, px + 10, py + 30);
        ctx.fillText(`Status: ${pilih.dijelajahi ? 'sudah dijelajahi' : 'belum dijelajahi'}`, px + 10, py + 46);
        ctx.fillText(`Stasiun: ${pilih.stasiun ? (pilih.dijelajahi ? 'aktif' : 'ada, belum terbaca') : 'tidak ada'}`, px + 10, py + 62);

        if (pilih.dijelajahi && pilih.stasiun) {
            ctx.fillStyle = '#fde68a';
            ctx.fillText('Teleport ke:', px + 10, py + 82);
            const tujuan = sektor.map((s, i) => ({ s, i }))
                .filter(o => o.i !== dipilih && o.s.dijelajahi && o.s.stasiun);
            let bx = px + 10, by = py + 98;
            for (const o of tujuan) {
                const w = 70, h = 18;
                if (bx + w > px + pw - 10) { bx = px + 10; by += h + 4; }
                ctx.fillStyle = 'rgba(253,224,71,0.15)';
                ctx.fillRect(bx, by, w, h);
                ctx.strokeStyle = '#fde68a';
                ctx.strokeRect(bx + 0.5, by + 0.5, w - 1, h - 1);
                ctx.fillStyle = '#fde68a';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(o.s.id, bx + w / 2, by + h / 2);
                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';
                tombolTeleport.push({ x: bx, y: by, w, h, idx: o.i });
                bx += w + 6;
            }
        }
    }

    for (const b of tombolKanan()) {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.strokeStyle = '#fde68a';
        ctx.lineWidth = 2;
        ctx.strokeRect(b.x, b.y, b.w, b.h);
        ctx.fillStyle = '#fde68a';
        ctx.font = '13px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(b.t, b.x + b.w / 2, b.y + b.h / 2);
    }

    if (tampilPesan && performance.now() - pesanWaktu < 3000) {
        const lebar = Math.min(canvas.width - 20, 420);
        ctx.fillStyle = 'rgba(0,0,0,0.8)';
        ctx.fillRect((canvas.width - lebar) / 2, 96, lebar, 28);
        ctx.fillStyle = '#fde68a';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(tampilPesan, canvas.width / 2, 110);
    }
}

function gambar() {
    const sA = clamp((kamera.skala - SKALA_FADE_MULAI) / (SKALA_FADE_SELESAI - SKALA_FADE_MULAI), 0, 1);
    const fA = 1 - sA;
    gambarLatar();
    gambarWilayah(sA, fA);
    gambarTeleport();
    gambarTitikSektor(sA);
    gambarMarkas(fA);
    gambarPanel(sA);
}

// ==========================================
// 7. LOOP
// ==========================================
function loop() {
    try { gambar(); } catch (err) { console.error(err); }
    requestAnimationFrame(loop);
}

bangunWilayah();
requestAnimationFrame(loop);
</script>
