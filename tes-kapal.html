<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tes Kapal Revisi</title>
<style>
body,html{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#07080d;font-family:monospace}
canvas{display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<script>
// ==========================================
// 1. ASET DAN KONFIGURASI
// ==========================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
resize();

const ASET = {
    rangka: 'kerangkainti-384×528.png',
    intiHidup: 'intireaktorhidup-32×32px.png',
    intiMati: 'intireaktormati-32×32px.png',
    utama: 'pendorong-32×48px.png',
    sel: 'sel-16×16px.png',
    efek: 'efek-pendorong.png'
};
const gbr = {};
for (const k in ASET) { gbr[k] = new Image(); gbr[k].src = ASET[k]; }

const C = 16;
const KW = 384, KH = 528, COLS = KW / C, ROWS = KH / C;
const PX = KW / 2, PY = KH / 2;

// CEK: posisi inti dalam satuan sel (2×2 sel = 32×32 piksel)
const INTI = { i: 11, j: 24, w: 2, h: 2 };

// CEK: kotak tempat pendorong utama (2×3 sel)
const SLOT = [
    { i: 3,  j: 29, w: 2, h: 3 },
    { i: 7,  j: 29, w: 2, h: 3 },
    { i: 11, j: 29, w: 2, h: 3 },
    { i: 15, j: 29, w: 2, h: 3 },
    { i: 19, j: 29, w: 2, h: 3 }
];

// Batas bangun kruiser: 40×40 sel, berpusat di kerangka
const BATAS_I = [-8, 31], BATAS_J = [-4, 35];
const DEF = { utama: { w: 2, h: 3 }, sel: { w: 1, h: 1 } };
const TOMBOL = [['utama', 'Utama'], ['sel', 'Sel'], ['hapus', 'Hapus'], ['ok', 'OK']];
const DIR4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];

const SKALA_BANGUN = 0.6;
const ZOOM_MIN = 0.2, ZOOM_MAX = 3, ZOOM_LANGKAH = 1.25;

// Fisika (1 px = 1 m, 1 sel = 1 ton)
const KG_PER_SEL = 1000;
const F_THR = 6.4e6;            // N per pendorong utama (acuan)
const ACEL_MAKS = 20;           // m/s², batas tubuh awak
const SPOOL = 2;                // detik, daya naik dari 0 ke penuh
const VMAX = 200;               // px/s = m/s
const REM = 40;                 // m/s², perlambatan (dipakai juga untuk berhenti bertahap)

// Zona titik dan toleransi berhenti
const ZONA_TITIK = 160;         // px, zona titik jalur (tak terlihat)
const ARRIVE_POS = 16;          // px, jarak bayangan akhir untuk dianggap sampai
const ARRIVE_TH = 0.17;         // rad (sekitar 10 derajat)
const ARRIVE_V = 2;             // px/s, kecepatan maksimum saat dianggap sampai

// Belok: hanya untuk tikungan nyata
const AMBANG_BELOK = 0.3;       // rad (sekitar 17 derajat), selisih di bawah ini diabaikan
const TIKUNGAN_MAKS = 400;      // px, jarak tikungan yang diperhitungkan
const OMEGA_REF = 0.4;          // rad/s, laju putar acuan kruiser
const PENDORONG_REF = 5;
const SEL_REF = 232;
const BELOK_MIN = 0.3;
const BLEND_JARAK = 160;        // px, arah akhir mulai ikut memengaruhi saat dekat

// Jalur
const LOOK_JARAK = 220;         // px, titik pandang di depan kapal sepanjang jalur
const PANAH_SUDUT = 0.35;       // rad, belokan yang memunculkan panah
const JALUR_STEP = 6;           // px layar, jarak antar titik saat menggambar
const SUSUL_DETIK = 0.5;        // detik, jalur sisa menyusul posisi kapal

// Koreksi bayangan saat dekat
const KOREKSI_JARAK = 200;      // px
const KOREKSI_SUDUT = 0.44;     // rad

// Interaksi
const RADIUS_SENTUH_KAPAL = 80; // px layar
const UJUNG_SENTUH = 90;        // px layar, area sentuh titik akhir jalur

// ==========================================
// 2. STATUS
// ==========================================
const kamera = { x: 0, y: 0, skala: SKALA_BANGUN };
let mode = 'bangun';
let hapusAktif = false;
let seret = null;
let pilihKapal = false;
let draftPts = [];
let ptr = null;
let cells = new Map();
let rangkaSet = new Set();
let thrs = [];
let terakhir = performance.now();
let errorTerakhir = null;

let kapal = {
    x: 0, y: 0, th: 0, v: 0, nyala: 0,
    target: null,               // bayangan akhir: { x, y, th }, sama dengan titik terakhir rute
    rute: [],                   // titik rute: { x, y, panah }, titik terakhir = target
    hidup: false, status: '-', tersambung: 0, gas: false
};

// ==========================================
// 3. PENGAMAN ERROR
// ==========================================
let errorLog = '';
function catatError(lokasi, err) {
    const pesan = err && err.message ? err.message : String(err);
    errorTerakhir = `[${lokasi}] ${pesan}`;
    if (errorTerakhir !== errorLog) {
        errorLog = errorTerakhir;
        console.error(err);
    }
}

window.addEventListener('error', e => catatError('global', e.error || e.message));
window.addEventListener('unhandledrejection', e => catatError('promise', e.reason));

function aman(lokasi, fn) {
    return e => {
        try { fn(e); } catch (err) { catatError(lokasi, err); }
    };
}

function coba(nama, fn) {
    try { fn(); } catch (err) { catatError(nama, err); }
}

function siapGambar(img) {
    return !!img && img.complete && img.naturalWidth > 0;
}

// ==========================================
// 4. UTILITAS
// ==========================================
function kunci(i, j) { return i + ',' + j; }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function sudutSelisih(a, b) {
    let d = a - b;
    while (d > Math.PI) d -= 2 * Math.PI;
    while (d < -Math.PI) d += 2 * Math.PI;
    return d;
}
function toSX(x) { return (x - kamera.x) * kamera.skala + canvas.width / 2; }
function toSY(y) { return (y - kamera.y) * kamera.skala + canvas.height / 2; }
function dariSX(sx) { return (sx - canvas.width / 2) / kamera.skala + kamera.x; }
function dariSY(sy) { return (sy - canvas.height / 2) / kamera.skala + kamera.y; }
function dalam(p, r) { return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h; }
function posisi(e) {
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
}

function layarKeKisi(sx, sy) {
    const wx = dariSX(sx), wy = dariSY(sy);
    return { i: Math.floor((wx + PX) / C), j: Math.floor((wy + PY) / C) };
}

function anchorFor(id, i, j) {
    const d = DEF[id];
    return { i: i - Math.floor(d.w / 2), j: j - Math.floor(d.h / 2) };
}

// Arah dunia dari selisih posisi: maju = (sin th, -cos th)
function arahKe(dx, dy) { return Math.atan2(dx, -dy); }

// ==========================================
// 5. BANGUN KAPAL
// ==========================================
function bacaMask() {
    const c = document.createElement('canvas');
    c.width = KW; c.height = KH;
    const g = c.getContext('2d');
    g.drawImage(gbr.rangka, 0, 0, KW, KH);
    const d = g.getImageData(0, 0, KW, KH).data;
    const hasil = [];
    for (let j = 0; j < ROWS; j++) {
        for (let i = 0; i < COLS; i++) {
            let ada = false;
            for (let y = 0; y < C && !ada; y++) {
                for (let x = 0; x < C; x++) {
                    const p = ((j * C + y) * KW + (i * C + x)) * 4;
                    if (d[p + 3] > 0) { ada = true; break; }
                }
            }
            if (ada) hasil.push([i, j]);
        }
    }
    return hasil;
}

function initKapal() {
    cells.clear();
    rangkaSet.clear();
    thrs = [];
    for (const [i, j] of bacaMask()) {
        rangkaSet.add(kunci(i, j));
        cells.set(kunci(i, j), { i, j, tipe: 'rangka', thr: null });
    }
    for (let j = INTI.j; j < INTI.j + INTI.h; j++) {
        for (let i = INTI.i; i < INTI.i + INTI.w; i++) {
            cells.set(kunci(i, j), { i, j, tipe: 'inti', thr: null });
        }
    }
}

function dalamSlot(i, j, w, h) {
    return SLOT.some(s => i >= s.i && j >= s.j && i + w <= s.i + s.w && j + h <= s.j + s.h);
}

function bolehTaruh(id, i, j) {
    if (id === 'sel') {
        if (i < BATAS_I[0] || i > BATAS_I[1] || j < BATAS_J[0] || j > BATAS_J[1]) return false;
        if (cells.has(kunci(i, j))) return false;
        return DIR4.some(([di, dj]) => cells.has(kunci(i + di, j + dj)));
    }
    const d = DEF[id];
    if (!dalamSlot(i, j, d.w, d.h)) return false;
    for (let x = 0; x < d.w; x++) {
        for (let y = 0; y < d.h; y++) {
            const c = cells.get(kunci(i + x, j + y));
            if (c && c.tipe !== 'rangka') return false;
        }
    }
    return true;
}

function tempatkan(id, ai, aj) {
    if (!bolehTaruh(id, ai, aj)) return false;
    if (id === 'sel') {
        cells.set(kunci(ai, aj), { i: ai, j: aj, tipe: 'sel', thr: null });
        return true;
    }
    const d = DEF[id];
    const t = { i: ai, j: aj, aktif: false, fp: [] };
    for (let x = 0; x < d.w; x++) {
        for (let y = 0; y < d.h; y++) {
            const ci = ai + x, cj = aj + y;
            cells.set(kunci(ci, cj), { i: ci, j: cj, tipe: 'thr', thr: t });
            t.fp.push([ci, cj]);
        }
    }
    thrs.push(t);
    return true;
}

function hapusDi(i, j) {
    const c = cells.get(kunci(i, j));
    if (!c) return;
    if (c.tipe === 'sel') {
        cells.delete(kunci(i, j));
    } else if (c.tipe === 'thr') {
        const t = c.thr;
        for (const [fi, fj] of t.fp) {
            const key = kunci(fi, fj);
            if (rangkaSet.has(key)) cells.set(key, { i: fi, j: fj, tipe: 'rangka', thr: null });
            else cells.delete(key);
        }
        thrs = thrs.filter(x => x !== t);
    }
}

// ==========================================
// 6. KONEKSI DAYA
// ==========================================
function hitungKoneksi() {
    const seen = new Set(), q = [];
    for (const [key, c] of cells) {
        if (c.tipe === 'inti') { seen.add(key); q.push(key); }
    }
    while (q.length) {
        const key = q.pop();
        const c = cells.get(key);
        for (const [di, dj] of DIR4) {
            const nk = kunci(c.i + di, c.j + dj);
            if (!seen.has(nk) && cells.has(nk)) { seen.add(nk); q.push(nk); }
        }
    }
    for (const t of thrs) t.aktif = kapal.hidup && t.fp.some(([i, j]) => seen.has(kunci(i, j)));
    kapal.tersambung = seen.size;
}

// ==========================================
// 7. RUTE (jalur)
// ==========================================
// Rute disimpan sebagai titik dunia. Titik terakhir adalah bayangan akhir dan tidak pernah bergeser.
// Titik lain ikut bergeser ke posisi kapal saat kapal keluar dari garis, sehingga bentuk jalur tetap.

// Proyeksi kapal ke rute: segmen terdekat dan titik terdekatnya
function proyeksiKeRute() {
    const r = kapal.rute;
    if (r.length < 2) return null;
    let best = null;
    for (let i = 0; i < r.length - 1; i++) {
        const a = r[i], b = r[i + 1];
        const dx = b.x - a.x, dy = b.y - a.y;
        const L2 = dx * dx + dy * dy;
        let t = L2 > 0 ? ((kapal.x - a.x) * dx + (kapal.y - a.y) * dy) / L2 : 0;
        t = clamp(t, 0, 1);
        const px = a.x + dx * t, py = a.y + dy * t;
        const d = Math.hypot(kapal.x - px, kapal.y - py);
        if (!best || d < best.d) best = { seg: i, x: px, y: py, d };
    }
    return best;
}

// Jarak sepanjang rute dari titik proyeksi ke setiap titik rute di depannya
function arcDariProyeksi(p) {
    const r = kapal.rute;
    const arcs = new Array(r.length).fill(0);
    let prev = { x: p.x, y: p.y }, acc = 0;
    for (let i = p.seg + 1; i < r.length; i++) {
        acc += dist(prev, r[i]);
        arcs[i] = acc;
        prev = r[i];
    }
    return { arcs, total: acc };
}

// Titik rute yang sudah dilewati dibuang dari depan
function trimRute() {
    const k = kapal;
    while (k.rute.length > 2) {
        const p = proyeksiKeRute();
        if (!p) break;
        const r0 = k.rute[0];
        const d = dist(k, r0);
        const fx = Math.sin(k.th), fy = -Math.cos(k.th);
        const depan = (r0.x - k.x) * fx + (r0.y - k.y) * fy;
        // Dilewati kalau proyeksi sudah lewat segmen pertama, atau titik itu sudah di belakang kapal dalam zona
        if (p.seg >= 1 || (depan < 0 && d < ZONA_TITIK)) k.rute.shift();
        else break;
    }
}

// Rute sisa menyusul kapal: titik-titik rute digeser ke arah kapal secara bertahap.
// Bentuk rute tetap. Titik akhir (bayangan) tidak ikut bergeser.
function koreksiRute(dt) {
    const k = kapal;
    const r = k.rute;
    if (r.length < 2) return;
    const p = proyeksiKeRute();
    if (!p) return;
    const ex = k.x - p.x, ey = k.y - p.y;
    if (Math.hypot(ex, ey) < 1) return;
    const { arcs, total } = arcDariProyeksi(p);
    if (total < 1) return;
    const frac = Math.min(1, dt / SUSUL_DETIK);
    for (let i = p.seg + 1; i < r.length - 1; i++) {
        const w = clamp(1 - arcs[i] / total, 0, 1);
        r[i].x += ex * frac * w;
        r[i].y += ey * frac * w;
    }
}

// Rute dari posisi kapal sekarang: kapal -> titik rute di depannya
function jalurDepan() {
    return [{ x: kapal.x, y: kapal.y }, ...kapal.rute];
}

function sisaJalur() {
    const pts = jalurDepan();
    let s = 0;
    for (let i = 1; i < pts.length; i++) s += dist(pts[i - 1], pts[i]);
    return s;
}

// Titik pandang: LOOK_JARAK di depan kapal sepanjang rute
function titikPandang() {
    const pts = jalurDepan();
    let acc = 0;
    for (let i = 1; i < pts.length; i++) {
        const seg = dist(pts[i - 1], pts[i]);
        if (seg > 0 && acc + seg >= LOOK_JARAK) {
            const t = (LOOK_JARAK - acc) / seg;
            return { x: pts[i - 1].x + (pts[i].x - pts[i - 1].x) * t, y: pts[i - 1].y + (pts[i].y - pts[i - 1].y) * t };
        }
        acc += seg;
    }
    return pts[pts.length - 1];
}

// Tikungan nyata di depan: hanya dihitung dari segmen rute (bukan sambungan kapal), dan hanya di atas ambang
function cariTikungan(p) {
    if (!p) return null;
    const r = kapal.rute;
    const { arcs } = arcDariProyeksi(p);
    const dariKapal = dist(kapal, p);
    for (let i = p.seg + 1; i <= r.length - 2; i++) {
        const arc = dariKapal + arcs[i];
        if (arc > TIKUNGAN_MAKS) break;
        if (dist(r[i], r[i - 1]) < 1 || dist(r[i + 1], r[i]) < 1) continue;
        const masuk = arahKe(r[i].x - r[i - 1].x, r[i].y - r[i - 1].y);
        const keluar = arahKe(r[i + 1].x - r[i].x, r[i + 1].y - r[i].y);
        const beda = sudutSelisih(keluar, masuk);
        if (Math.abs(beda) > AMBANG_BELOK) return { arc, sudut: beda, out: keluar };
    }
    return null;
}

function hitungPanah(list, origin) {
    for (let i = 0; i < list.length; i++) {
        const prev = i === 0 ? origin : list[i - 1];
        const p = list[i];
        const next = list[i + 1];
        p.panah = false;
        if (prev && next) {
            const a = arahKe(p.x - prev.x, p.y - prev.y);
            const b = arahKe(next.x - p.x, next.y - p.y);
            if (Math.abs(sudutSelisih(b, a)) > PANAH_SUDUT) p.panah = true;
        }
    }
}

function previewList() {
    if (ptr && ptr.aksi === 'sambung') return [...kapal.rute, ...draftPts.slice(1)];
    return draftPts;
}

function sedangGambar() {
    return ptr && ptr.moved && (ptr.aksi === 'kapal' || ptr.aksi === 'sambung') && draftPts.length > 0;
}

// Rute baru dikunci saat jari dilepas. Titik terakhir menjadi bayangan akhir.
function kunciJalur() {
    const list = previewList();
    if (list.length < 2) return;
    hitungPanah(list, { x: kapal.x, y: kapal.y });
    const last = list[list.length - 1];
    const prev = list[list.length - 2];
    last.th = arahKe(last.x - prev.x, last.y - prev.y);
    kapal.rute = list;
    kapal.target = last;
}

function resetGerak() {
    kapal.target = null;
    kapal.rute = [];
    kapal.v = 0;
    kapal.nyala = 0;
    kapal.status = 'diam';
}

// ==========================================
// 8. GERAK
// ==========================================
function massaKapal() {
    return Math.max(1, cells.size) * KG_PER_SEL;
}

function accelMaks(aktif) {
    return Math.min(aktif * F_THR / massaKapal(), ACEL_MAKS);
}

function omegaMaks(aktif) {
    return OMEGA_REF * (aktif / PENDORONG_REF) * Math.sqrt(SEL_REF / Math.max(1, cells.size));
}

function kendali(dt) {
    const k = kapal;
    k.gas = false;

    const aktif = thrs.filter(t => t.aktif).length;
    if (aktif === 0) {
        resetGerak();
        return;
    }
    if (!k.target) {
        k.v = 0; k.nyala = 0; k.status = 'diam';
        return;
    }

    trimRute();

    const end = k.target;
    const dEnd = dist(k, end);
    const sisa = sisaJalur();
    const ikutiJalur = k.rute.length >= 2 && sisa > LOOK_JARAK;
    const om = omegaMaks(aktif);

    // Koreksi arah bayangan saat dekat, lalu cek sampai (berhenti hanya setelah benar-benar pelan)
    if (!ikutiJalur) {
        if (dEnd < KOREKSI_JARAK && Math.abs(sudutSelisih(end.th, k.th)) < KOREKSI_SUDUT) {
            end.th -= sudutSelisih(end.th, k.th) * Math.min(1, dt * 2);
        }
        if (dEnd <= ARRIVE_POS && k.v < ARRIVE_V && Math.abs(sudutSelisih(end.th, k.th)) <= ARRIVE_TH) {
            resetGerak();
            return;
        }
    }

    // Arah yang dikejar
    const proj = ikutiJalur ? proyeksiKeRute() : null;
    const tk = ikutiJalur ? cariTikungan(proj) : null;
    let hd;
    if (!ikutiJalur) {
        const hdPos = arahKe(end.x - k.x, end.y - k.y);
        const w = clamp(1 - dEnd / BLEND_JARAK, 0, 1);
        hd = hdPos + sudutSelisih(end.th, hdPos) * w;
    } else if (tk && tk.arc <= LOOK_JARAK) {
        // Tikungan sudah dekat: kapal mulai mengarah ke arah keluar tikungan
        hd = tk.out;
    } else {
        const tp = titikPandang();
        hd = arahKe(tp.x - k.x, tp.y - k.y);
    }

    // Selisih kecil diabaikan di jalur lurus. Belok hanya kalau tikungan nyata atau selisih besar.
    const err = sudutSelisih(hd, k.th);
    const wajibBelok = !ikutiJalur || (tk && tk.arc <= LOOK_JARAK) || Math.abs(err) > AMBANG_BELOK;
    if (wajibBelok) {
        const f = clamp(Math.abs(err) / AMBANG_BELOK, 0.3, 1);
        const maks = om * f * dt;
        k.th += clamp(err, -maks, maks);
    }

    // Daya naik halus
    k.nyala += dt;
    const s = clamp(k.nyala / SPOOL, 0, 1);
    const daya = s * s * (3 - 2 * s);

    // Batas kecepatan: pengereman ke titik akhir, tikungan nyata, dan sudut hadap
    const jarakRem = ikutiJalur ? sisa : dEnd;
    let vTarget = Math.min(VMAX, Math.sqrt(2 * REM * Math.max(0, jarakRem)));
    if (tk) {
        vTarget = Math.min(vTarget,
            om * Math.max(tk.arc, 1) * 0.5,
            Math.sqrt(2 * REM * Math.max(0, tk.arc)));
    }
    vTarget = Math.min(vTarget, VMAX * clamp(Math.cos(err), BELOK_MIN, 1));

    // Kecepatan naik dengan percepatan terbatas, turun dengan perlambatan REM
    if (k.v < vTarget) {
        k.v = Math.min(vTarget, k.v + accelMaks(aktif) * daya * dt);
    } else {
        k.v = Math.max(vTarget, k.v - REM * dt);
    }
    k.v = Math.max(0, k.v);

    k.gas = k.v > 0.5;
    k.status = (ikutiJalur && Math.abs(err) > AMBANG_BELOK) ? 'belok' : 'maju';

    k.x += Math.sin(k.th) * k.v * dt;
    k.y += -Math.cos(k.th) * k.v * dt;

    // Rute menyusul kapal, bayangan akhir tetap
    koreksiRute(dt);
}

// ==========================================
// 9. BILAH, TOMBOL, ZOOM, DAN MODE
// ==========================================
function tombolBilah() {
    const w = 70, g = 6, n = TOMBOL.length;
    const total = n * w + (n - 1) * g;
    const x0 = (canvas.width - total) / 2, y = canvas.height - 100;
    return TOMBOL.map(([id, label], k) => ({ id, label, x: x0 + k * (w + g), y, w, h: 44 }));
}

function tombolBuild() {
    return { id: 'build', label: 'BUILD', x: canvas.width - 86, y: 10, w: 76, h: 32 };
}

function tombolZoomIn() {
    return { id: 'zoomIn', label: '+', x: canvas.width - 54, y: canvas.height / 2 - 60, w: 44, h: 44 };
}
function tombolZoomOut() {
    return { id: 'zoomOut', label: '−', x: canvas.width - 54, y: canvas.height / 2 + 10, w: 44, h: 44 };
}

function ubahZoom(arah) {
    kamera.skala = clamp(
        kamera.skala * (arah > 0 ? ZOOM_LANGKAH : 1 / ZOOM_LANGKAH),
        ZOOM_MIN, ZOOM_MAX
    );
}

function masukBangun() {
    mode = 'bangun';
    kapal.hidup = false;
    resetGerak();
    kapal.x = 0; kapal.y = 0;
    kapal.th = 0;
    kamera.x = 0; kamera.y = 0;
    kamera.skala = SKALA_BANGUN;
    hapusAktif = false;
    seret = null;
    pilihKapal = false;
    draftPts = [];
}

function konfirm() {
    mode = 'uji';
    kapal.hidup = true;
    kamera.skala = 1;
    kamera.x = kapal.x;
    kamera.y = kapal.y;
    hapusAktif = false;
    seret = null;
    pilihKapal = false;
    draftPts = [];
}

// ==========================================
// 10. INPUT
// ==========================================
canvas.addEventListener('pointerdown', aman('pointerdown', e => {
    e.preventDefault();
    const p = posisi(e);
    ptr = { sx: p.x, sy: p.y, lx: p.x, ly: p.y, moved: false, aksi: '', id: null };

    if (dalam(p, tombolZoomIn())) { ubahZoom(1); ptr.aksi = 'abaikan'; return; }
    if (dalam(p, tombolZoomOut())) { ubahZoom(-1); ptr.aksi = 'abaikan'; return; }

    if (mode === 'bangun') {
        const b = tombolBilah().find(t => dalam(p, t));
        if (b) {
            ptr.id = b.id;
            if (b.id === 'utama' || b.id === 'sel') {
                ptr.aksi = 'tarik';
                seret = { id: b.id, x: p.x, y: p.y };
            } else {
                ptr.aksi = 'bilah';
            }
            return;
        }
        ptr.aksi = 'grid';
        return;
    }

    if (dalam(p, tombolBuild())) { ptr.aksi = 'build'; return; }

    // Titik akhir rute: seret untuk meneruskan jalur
    if (kapal.target && Math.hypot(p.x - toSX(kapal.target.x), p.y - toSY(kapal.target.y)) < UJUNG_SENTUH) {
        ptr.aksi = 'sambung';
        draftPts = [{ x: kapal.target.x, y: kapal.target.y, panah: false }];
        return;
    }

    // Ketuk atau tahan kapal: mulai gambar rute baru
    if (Math.hypot(p.x - toSX(kapal.x), p.y - toSY(kapal.y)) < RADIUS_SENTUH_KAPAL) {
        ptr.aksi = 'kapal';
        draftPts = [];
        return;
    }

    ptr.aksi = 'pan';
}));

canvas.addEventListener('pointermove', aman('pointermove', e => {
    if (!ptr) return;
    e.preventDefault();
    const p = posisi(e);
    const dx = p.x - ptr.lx, dy = p.y - ptr.ly;
    if (Math.hypot(p.x - ptr.sx, p.y - ptr.sy) > 6) ptr.moved = true;

    if (ptr.aksi === 'tarik' && seret) {
        seret.x = p.x; seret.y = p.y;
    } else if ((ptr.aksi === 'kapal' || ptr.aksi === 'sambung') && ptr.moved) {
        const w = { x: dariSX(p.x), y: dariSY(p.y) };
        if (ptr.aksi === 'kapal' && draftPts.length === 0) {
            draftPts.push({ x: kapal.x, y: kapal.y, panah: false });
        }
        const last = draftPts[draftPts.length - 1];
        if (!last || Math.hypot(w.x - last.x, w.y - last.y) >= JALUR_STEP / kamera.skala) {
            draftPts.push({ x: w.x, y: w.y, panah: false });
        }
        pilihKapal = false;
    } else if (ptr.aksi === 'pan' || ptr.aksi === 'grid') {
        kamera.x -= dx / kamera.skala;
        kamera.y -= dy / kamera.skala;
    }
    ptr.lx = p.x; ptr.ly = p.y;
}));

canvas.addEventListener('pointerup', aman('pointerup', e => {
    if (!ptr) return;
    const p = posisi(e);
    const bilahTop = canvas.height - 100;

    switch (ptr.aksi) {
        case 'tarik':
            if (seret && p.y < bilahTop) {
                const q = layarKeKisi(p.x, p.y);
                const a = anchorFor(seret.id, q.i, q.j);
                tempatkan(seret.id, a.i, a.j);
            }
            seret = null;
            break;

        case 'bilah':
            if (!ptr.moved) {
                if (ptr.id === 'hapus') hapusAktif = !hapusAktif;
                else if (ptr.id === 'ok') konfirm();
            }
            break;

        case 'grid':
            if (!ptr.moved && hapusAktif) {
                const q = layarKeKisi(p.x, p.y);
                hapusDi(q.i, q.j);
            }
            break;

        case 'kapal':
            if (ptr.moved && draftPts.length >= 2) kunciJalur();
            else if (!ptr.moved && !kapal.target) pilihKapal = true;
            draftPts = [];
            break;

        case 'sambung':
            if (ptr.moved && draftPts.length >= 2) kunciJalur();
            draftPts = [];
            break;

        case 'pan':
            if (!ptr.moved) pilihKapal = false;
            break;

        case 'build':
            if (!ptr.moved) masukBangun();
            break;
    }
    ptr = null;
}));

canvas.addEventListener('pointercancel', () => {
    ptr = null;
    seret = null;
    draftPts = [];
});

// ==========================================
// 11. GAMBAR
// ==========================================
function gambarKisi() {
    const s = C * kamera.skala;
    if (s < 4) return;
    const ox = ((toSX(0) % s) + s) % s;
    const oy = ((toSY(0) % s) + s) % s;
    ctx.strokeStyle = 'rgba(120,130,160,0.08)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = ox; x < canvas.width; x += s) { ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, canvas.height); }
    for (let y = oy; y < canvas.height; y += s) { ctx.moveTo(0, y + 0.5); ctx.lineTo(canvas.width, y + 0.5); }
    ctx.stroke();
}

function gambarKapalPada(x, y, th, alpha, overlay) {
    ctx.save();
    try {
        ctx.globalAlpha = alpha;
        ctx.translate(toSX(x), toSY(y));
        ctx.scale(kamera.skala, kamera.skala);
        ctx.rotate(th);

        if (siapGambar(gbr.rangka)) ctx.drawImage(gbr.rangka, -PX, -PY, KW, KH);

        const im = kapal.hidup ? gbr.intiHidup : gbr.intiMati;
        if (siapGambar(im)) ctx.drawImage(im, INTI.i * C - PX, INTI.j * C - PY, INTI.w * C, INTI.h * C);

        if (siapGambar(gbr.sel)) {
            for (const c of cells.values()) {
                if (c.tipe === 'sel') ctx.drawImage(gbr.sel, c.i * C - PX, c.j * C - PY, C, C);
            }
        }

        if (siapGambar(gbr.utama)) {
            for (const t of thrs) ctx.drawImage(gbr.utama, t.i * C - PX, t.j * C - PY, 32, 48);
        }

        if (alpha === 1 && kapal.gas && siapGambar(gbr.efek)) {
            const w = gbr.efek.naturalWidth * 0.25, h = gbr.efek.naturalHeight * 0.25;
            ctx.globalAlpha = 0.9;
            for (const t of thrs) {
                if (!t.aktif) continue;
                ctx.drawImage(gbr.efek, t.i * C - PX + 16 - w / 2, t.j * C - PY + 48, w, h);
            }
        }

        if (overlay) {
            ctx.lineWidth = 1 / kamera.skala;
            ctx.setLineDash([4, 3]);
            ctx.strokeStyle = 'rgba(253,224,71,0.5)';
            for (const s of SLOT) {
                ctx.strokeRect(s.i * C - PX, s.j * C - PY, s.w * C, s.h * C);
            }
            ctx.strokeRect(BATAS_I[0] * C - PX, BATAS_J[0] * C - PY,
                (BATAS_I[1] + 1 - BATAS_I[0]) * C, (BATAS_J[1] + 1 - BATAS_J[0]) * C);
            ctx.setLineDash([]);
        }
    } finally {
        ctx.restore();
    }
}

function gambarKapal() {
    gambarKapalPada(kapal.x, kapal.y, kapal.th, 1, mode === 'bangun');
}

// Garis rute tanpa titik tambahan. Panah hanya di tikungan nyata.
function gambarGaris(list, warna) {
    if (!list.length) return;
    ctx.save();
    ctx.setLineDash([8, 6]);
    ctx.strokeStyle = warna;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(toSX(kapal.x), toSY(kapal.y));
    for (const p of list) ctx.lineTo(toSX(p.x), toSY(p.y));
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = warna;
    for (let i = 0; i < list.length; i++) {
        const p = list[i];
        const next = list[i + 1];
        if (p.panah && next) {
            const th = arahKe(next.x - p.x, next.y - p.y);
            ctx.save();
            ctx.translate(toSX(p.x), toSY(p.y));
            ctx.rotate(th);
            ctx.beginPath();
            ctx.moveTo(0, -8);
            ctx.lineTo(-5, 4);
            ctx.lineTo(5, 4);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }
    }
    ctx.restore();
}

function gambarJalur() {
    if (mode !== 'uji') return;

    if (sedangGambar()) {
        const list = previewList();
        hitungPanah(list, { x: kapal.x, y: kapal.y });
        gambarGaris(list, 'rgba(147,197,253,0.9)');
        return;
    }

    if (kapal.target && kapal.rute.length) {
        hitungPanah(kapal.rute, { x: kapal.x, y: kapal.y });
        gambarGaris(kapal.rute, 'rgba(253,224,71,0.9)');
    }
}

function gambarBayangan() {
    if (mode !== 'uji') return;

    if (sedangGambar()) {
        const list = previewList();
        const last = list[list.length - 1];
        const prev = list.length >= 2 ? list[list.length - 2] : { x: kapal.x, y: kapal.y };
        const th = (last.x === prev.x && last.y === prev.y) ? kapal.th : arahKe(last.x - prev.x, last.y - prev.y);
        gambarKapalPada(last.x, last.y, th, 0.35, false);
    }

    if (kapal.target) {
        gambarKapalPada(kapal.target.x, kapal.target.y, kapal.target.th, 0.35, false);
    } else if (pilihKapal && !sedangGambar()) {
        gambarKapalPada(kapal.x, kapal.y, kapal.th, 0.35, false);
    }
}

function gambarSeret() {
    if (!seret) return;
    const bilahTop = canvas.height - 100;
    const img = seret.id === 'utama' ? gbr.utama : gbr.sel;

    if (seret.y < bilahTop) {
        const q = layarKeKisi(seret.x, seret.y);
        const a = anchorFor(seret.id, q.i, q.j);
        const d = DEF[seret.id];
        const ok = bolehTaruh(seret.id, a.i, a.j);
        const s = kamera.skala;
        const x0 = toSX(a.i * C - PX), y0 = toSY(a.j * C - PY);
        const w = d.w * C * s, h = d.h * C * s;

        ctx.fillStyle = ok ? 'rgba(74,222,128,0.35)' : 'rgba(248,113,113,0.35)';
        ctx.fillRect(x0, y0, w, h);
        ctx.strokeStyle = ok ? '#4ade80' : '#f87171';
        ctx.lineWidth = 2;
        ctx.strokeRect(x0, y0, w, h);
        if (siapGambar(img)) {
            ctx.globalAlpha = 0.6;
            ctx.drawImage(img, x0, y0, w, h);
            ctx.globalAlpha = 1;
        }
    }

    if (siapGambar(img)) {
        const iw = img.naturalWidth * 1.5, ih = img.naturalHeight * 1.5;
        ctx.globalAlpha = 0.9;
        ctx.drawImage(img, seret.x - iw / 2, seret.y - 70 - ih / 2, iw, ih);
        ctx.globalAlpha = 1;
    }
}

function gambarTombolKotak(b, label, aktif) {
    ctx.fillStyle = aktif ? 'rgba(253,224,71,0.35)' : 'rgba(0,0,0,0.7)';
    ctx.strokeStyle = '#fde68a';
    ctx.lineWidth = 2;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = '#fde68a';
    ctx.font = '14px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, b.x + b.w / 2, b.y + b.h / 2);
}

function gambarUI() {
    const aktif = thrs.filter(t => t.aktif).length;
    const baris = [
        `Mode: ${mode === 'bangun' ? 'BANGUN' : 'UJI'}`,
        `Sambung: ${kapal.tersambung}/${cells.size}`,
        `Massa: ${cells.size} ton`,
        `Utama aktif: ${aktif}/${thrs.length}`,
        `Akselerasi maks: ${accelMaks(aktif).toFixed(1)} m/s²`,
        `Status: ${kapal.status}`,
        `Kecepatan: ${kapal.v.toFixed(0)} px/s`,
        `Heading: ${((kapal.th * 180 / Math.PI + 360) % 360).toFixed(0)}°`,
        `Rute: ${kapal.rute.length} titik`,
        `Hapus: ${hapusAktif ? 'AKTIF' : 'mati'}`,
        `Zoom: ${kamera.skala.toFixed(2)}`
    ];
    ctx.save();
    ctx.fillStyle = '#fde68a';
    ctx.font = '13px monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    baris.forEach((t, i) => ctx.fillText(t, 10, 10 + i * 17));
    ctx.restore();
}

function gambarError() {
    if (!errorTerakhir) return;
    ctx.save();
    ctx.fillStyle = 'rgba(80,0,0,0.92)';
    ctx.fillRect(0, 0, canvas.width, 60);
    ctx.fillStyle = '#fca5a5';
    ctx.font = '12px monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText('ERROR:', 10, 6);
    ctx.fillText(errorTerakhir.slice(0, 120), 10, 22);
    ctx.fillText(errorTerakhir.slice(120, 240), 10, 38);
    ctx.restore();
}

function gambar() {
    ctx.fillStyle = '#07080d';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    coba('kisi', gambarKisi);
    coba('kapal', gambarKapal);
    coba('jalur', gambarJalur);
    coba('bayangan', gambarBayangan);

    if (mode === 'bangun') {
        coba('seret', gambarSeret);
        for (const b of tombolBilah()) {
            const aktif = (seret && seret.id === b.id) || (b.id === 'hapus' && hapusAktif);
            gambarTombolKotak(b, b.label, aktif);
        }
    } else {
        gambarTombolKotak(tombolBuild(), 'BUILD', false);
    }

    gambarTombolKotak(tombolZoomIn(), '+', false);
    gambarTombolKotak(tombolZoomOut(), '−', false);
    coba('ui', gambarUI);
}

// ==========================================
// 12. LOOP
// ==========================================
function loop(now) {
    requestAnimationFrame(loop);

    let dt = (now - terakhir) / 1000;
    terakhir = now;
    if (!(dt >= 0)) dt = 0;
    if (dt > 0.05) dt = 0.05;

    coba('logika', () => {
        hitungKoneksi();
        if (mode === 'uji') kendali(dt);
        else {
            resetGerak();
            kapal.gas = false;
            kapal.status = '-';
        }
    });

    coba('gambar', gambar);
    try { gambarError(); } catch (_) {}
}

function mulai() {
    if (!gbr.rangka.complete || gbr.rangka.naturalWidth === 0) {
        setTimeout(mulai, 100);
        return;
    }
    coba('initKapal', initKapal);
    requestAnimationFrame(loop);
}
mulai();
</script>
