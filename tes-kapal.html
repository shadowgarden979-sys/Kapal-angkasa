<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tes Kapal Revisi</title>
<style>
body,html{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#07080d;font-family:monospace}
canvas{display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<script>
// ==========================================
// 1. ASET DAN KONFIGURASI
// ==========================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
resize();

const ASET = {
    rangka: 'kerangkainti-384×528.png',
    intiHidup: 'intireaktorhidup-32×32px.png',
    intiMati: 'intireaktormati-32×32px.png',
    utama: 'pendorong-32×48px.png',
    sel: 'sel-16×16px.png',
    efek: 'efek-pendorong.png'
};
const gbr = {};
for (const k in ASET) { gbr[k] = new Image(); gbr[k].src = ASET[k]; }

const C = 16;
const KW = 384, KH = 528, COLS = KW / C, ROWS = KH / C;   // 24 x 33 sel
const PX = KW / 2, PY = KH / 2;                           // pusat kapal = pusat kerangka

// CEK: posisi inti dalam satuan sel (ukuran 2×2 sel = 32×32 piksel)
const INTI = { i: 11, j: 24, w: 2, h: 2 };

// CEK: kotak tempat pendorong utama (ukuran 2×3 sel), sesuaikan dengan deretan kotak di kerangka
const SLOT = [
    { i: 3,  j: 29, w: 2, h: 3 },
    { i: 7,  j: 29, w: 2, h: 3 },
    { i: 11, j: 29, w: 2, h: 3 },
    { i: 15, j: 29, w: 2, h: 3 },
    { i: 19, j: 29, w: 2, h: 3 }
];

const BATAS_I = [-2, COLS + 1], BATAS_J = [-2, ROWS + 1];   // area boleh taruh sel
const DEF = { utama: { w: 2, h: 3 }, sel: { w: 1, h: 1 } };
const TOMBOL = [['utama', 'Utama'], ['sel', 'Sel'], ['hapus', 'Hapus'], ['ok', 'OK']];
const DIR4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];

// Gerak tanpa inersia
const SKALA_BANGUN = 1.5;
const VMAX = 200;        // px/s, kecepatan maju saat pendorong utama aktif
const REM = 40;          // px/s², perlambatan saat mengerem
const PUTAR = 2;         // rad/s, kecepatan belok langsung
const ARRIVE = 4;        // px, jarak dianggap sampai
const SEJAJAR = 0.2;     // rad, kapal mulai maju kalau sudah cukup menghadap tujuan

// ==========================================
// 2. STATUS
// ==========================================
const kamera = { x: 0, y: 0, skala: SKALA_BANGUN };
let mode = 'bangun';           // 'bangun' atau 'uji'
let hapusAktif = false;        // mode hapus (ketuk Hapus untuk nyala/mati)
let seret = null;              // opsi yang sedang diangkat: { id, x, y }
let rutaDraw = null;           // titik tujuan sementara saat seret di mode uji
let ptr = null;
let cells = new Map();         // key -> { i, j, tipe: 'rangka'|'inti'|'sel'|'thr', thr }
let rangkaSet = new Set();     // sel kerangka asli (untuk memulihkan saat pendorong dihapus)
let thrs = [];                 // daftar pendorong utama: { i, j, aktif, fp: [[i,j], ...] }
let terakhir = performance.now();

let kapal = {
    x: 0, y: 0, th: 0, v: 0,
    target: null, rem: false, gas: false,
    hidup: false, status: '-', tersambung: 0
};

// ==========================================
// 3. UTILITAS
// ==========================================
function kunci(i, j) { return i + ',' + j; }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function sudutSelisih(a, b) {
    let d = a - b;
    while (d > Math.PI) d -= 2 * Math.PI;
    while (d < -Math.PI) d += 2 * Math.PI;
    return d;
}
function toSX(x) { return (x - kamera.x) * kamera.skala + canvas.width / 2; }
function toSY(y) { return (y - kamera.y) * kamera.skala + canvas.height / 2; }
function dariSX(sx) { return (sx - canvas.width / 2) / kamera.skala + kamera.x; }
function dariSY(sy) { return (sy - canvas.height / 2) / kamera.skala + kamera.y; }
function dalam(p, r) { return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h; }
function posisi(e) {
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
}

// Layar -> sel kapal (kapal berada di titik 0,0 saat mode bangun)
function layarKeKisi(sx, sy) {
    const wx = dariSX(sx), wy = dariSY(sy);
    return { i: Math.floor((wx + PX) / C), j: Math.floor((wy + PY) / C) };
}

// Pendorong 2×3 dijangkarkan di sel kiri atas, dihitung dari sel di bawah jari
function anchorFor(id, i, j) {
    const d = DEF[id];
    return { i: i - Math.floor(d.w / 2), j: j - Math.floor(d.h / 2) };
}

// ==========================================
// 4. BANGUN KAPAL
// ==========================================
function bacaMask() {
    const c = document.createElement('canvas');
    c.width = KW; c.height = KH;
    const g = c.getContext('2d');
    g.drawImage(gbr.rangka, 0, 0, KW, KH);
    const d = g.getImageData(0, 0, KW, KH).data;
    const hasil = [];
    for (let j = 0; j < ROWS; j++) {
        for (let i = 0; i < COLS; i++) {
            let ada = false;
            for (let y = 0; y < C && !ada; y++) {
                for (let x = 0; x < C; x++) {
                    const p = ((j * C + y) * KW + (i * C + x)) * 4;
                    if (d[p + 3] > 0) { ada = true; break; }
                }
            }
            if (ada) hasil.push([i, j]);
        }
    }
    return hasil;
}

function initKapal() {
    cells.clear();
    rangkaSet.clear();
    thrs = [];
    for (const [i, j] of bacaMask()) {
        rangkaSet.add(kunci(i, j));
        cells.set(kunci(i, j), { i, j, tipe: 'rangka', thr: null });
    }
    for (let j = INTI.j; j < INTI.j + INTI.h; j++) {
        for (let i = INTI.i; i < INTI.i + INTI.w; i++) {
            cells.set(kunci(i, j), { i, j, tipe: 'inti', thr: null });
        }
    }
}

function dalamSlot(i, j, w, h) {
    return SLOT.some(s => i >= s.i && j >= s.j && i + w <= s.i + s.w && j + h <= s.j + s.h);
}

// Sel: sel kosong di area boleh, bersisian dengan sel yang sudah ada
// Pendorong: semua sel footprint masuk kotak SLOT dan tidak tertimpa sel/inti/pendorong lain
function bolehTaruh(id, i, j) {
    if (id === 'sel') {
        if (i < BATAS_I[0] || i > BATAS_I[1] || j < BATAS_J[0] || j > BATAS_J[1]) return false;
        if (cells.has(kunci(i, j))) return false;
        return DIR4.some(([di, dj]) => cells.has(kunci(i + di, j + dj)));
    }
    const d = DEF[id];
    if (!dalamSlot(i, j, d.w, d.h)) return false;
    for (let x = 0; x < d.w; x++) {
        for (let y = 0; y < d.h; y++) {
            const c = cells.get(kunci(i + x, j + y));
            if (c && c.tipe !== 'rangka') return false;
        }
    }
    return true;
}

function tempatkan(id, ai, aj) {
    if (!bolehTaruh(id, ai, aj)) return false;
    if (id === 'sel') {
        cells.set(kunci(ai, aj), { i: ai, j: aj, tipe: 'sel', thr: null });
        return true;
    }
    const d = DEF[id];
    const t = { i: ai, j: aj, aktif: false, fp: [] };
    for (let x = 0; x < d.w; x++) {
        for (let y = 0; y < d.h; y++) {
            const ci = ai + x, cj = aj + y;
            cells.set(kunci(ci, cj), { i: ci, j: cj, tipe: 'thr', thr: t });
            t.fp.push([ci, cj]);
        }
    }
    thrs.push(t);
    return true;
}

// Hapus sel atau pendorong. Sel kerangka dan inti tidak bisa dihapus.
function hapusDi(i, j) {
    const c = cells.get(kunci(i, j));
    if (!c) return;
    if (c.tipe === 'sel') {
        cells.delete(kunci(i, j));
    } else if (c.tipe === 'thr') {
        const t = c.thr;
        for (const [fi, fj] of t.fp) {
            const key = kunci(fi, fj);
            if (rangkaSet.has(key)) cells.set(key, { i: fi, j: fj, tipe: 'rangka', thr: null });
            else cells.delete(key);
        }
        thrs = thrs.filter(x => x !== t);
    }
}

// ==========================================
// 5. KONEKSI DAYA
// ==========================================
// Dari inti, sel yang bersisian ikut tersambung. Pendorong aktif kalau salah satu selnya tersambung.
function hitungKoneksi() {
    const seen = new Set(), q = [];
    for (const [key, c] of cells) {
        if (c.tipe === 'inti') { seen.add(key); q.push(key); }
    }
    while (q.length) {
        const key = q.pop();
        const c = cells.get(key);
        for (const [di, dj] of DIR4) {
            const nk = kunci(c.i + di, c.j + dj);
            if (!seen.has(nk) && cells.has(nk)) { seen.add(nk); q.push(nk); }
        }
    }
    for (const t of thrs) t.aktif = kapal.hidup && t.fp.some(([i, j]) => seen.has(kunci(i, j)));
    kapal.tersambung = seen.size;
}

// ==========================================
// 6. GERAK (tanpa inersia)
// ==========================================
// Kapal menghadap tujuan dulu, lalu maju dengan kecepatan penuh,
// lalu mengerem dengan perlambatan konstan dan berhenti di tujuan.
function kendali(dt) {
    const k = kapal;
    k.gas = false;

    if (!k.target || !thrs.some(t => t.aktif)) {
        k.v = 0; k.target = null; k.rem = false; k.status = 'diam';
        return;
    }

    const dx = k.target.x - k.x, dy = k.target.y - k.y;
    const jarak = Math.hypot(dx, dy);
    if (jarak <= ARRIVE) {
        k.x = k.target.x; k.y = k.target.y;
        k.target = null; k.v = 0; k.rem = false; k.status = 'diam';
        return;
    }

    // Arah ke tujuan. Konvensi: maju = (sin th, -cos th)
    const hd = Math.atan2(dx, -dy);
    const err = sudutSelisih(hd, k.th);
    k.th += clamp(err, -PUTAR * dt, PUTAR * dt);

    // Mulai mengerem saat jarak sisa sama dengan jarak henti
    if (!k.rem && k.v > 0 && jarak <= (k.v * k.v) / (2 * REM)) k.rem = true;

    if (k.rem) {
        k.v = Math.max(0, k.v - REM * dt);
        k.status = 'rem';
        if (k.v === 0) {
            k.target = null; k.rem = false; k.status = 'diam';
            return;
        }
    } else if (Math.abs(err) < SEJAJAR) {
        k.v = VMAX; k.gas = true; k.status = 'maju';
    } else {
        k.v = 0; k.status = 'menghadap';
    }

    k.x += Math.sin(k.th) * k.v * dt;
    k.y += -Math.cos(k.th) * k.v * dt;
}

// ==========================================
// 7. BILAH DAN TOMBOL
// ==========================================
function tombolBilah() {
    const w = 70, g = 6, n = TOMBOL.length;
    const total = n * w + (n - 1) * g;
    const x0 = (canvas.width - total) / 2, y = canvas.height - 100;
    return TOMBOL.map(([id, label], k) => ({ id, label, x: x0 + k * (w + g), y, w, h: 44 }));
}

function tombolBuild() {
    return { id: 'build', label: 'BUILD', x: canvas.width - 86, y: 10, w: 76, h: 32 };
}

function masukBangun() {
    mode = 'bangun';
    kapal.hidup = false;
    kapal.target = null;
    kapal.v = 0;
    kapal.x = 0; kapal.y = 0;
    kapal.th = 0;
    kamera.x = 0; kamera.y = 0;
    kamera.skala = SKALA_BANGUN;
    hapusAktif = false;
    seret = null;
    rutaDraw = null;
}

function konfirm() {
    mode = 'uji';
    kapal.hidup = true;
    kamera.skala = 1;
    kamera.x = kapal.x;
    kamera.y = kapal.y;
    hapusAktif = false;
    seret = null;
}

// ==========================================
// 8. INPUT
// ==========================================
canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    const p = posisi(e);
    ptr = { sx: p.x, sy: p.y, lx: p.x, ly: p.y, moved: false, aksi: '', id: null };

    if (mode === 'bangun') {
        const b = tombolBilah().find(t => dalam(p, t));
        if (b) {
            ptr.id = b.id;
            if (b.id === 'utama' || b.id === 'sel') {
                // Sentuh langsung mengangkat opsi, siap diseret
                ptr.aksi = 'tarik';
                seret = { id: b.id, x: p.x, y: p.y };
            } else {
                ptr.aksi = 'bilah';
            }
            return;
        }
        ptr.aksi = 'grid';
    } else {
        if (dalam(p, tombolBuild())) { ptr.aksi = 'build'; return; }
        const wx = dariSX(p.x), wy = dariSY(p.y);
        if (Math.hypot(wx - kapal.x, wy - kapal.y) < 200) {
            ptr.aksi = 'rute';
            rutaDraw = { x: wx, y: wy };
        } else {
            ptr.aksi = 'pan';
        }
    }
});

canvas.addEventListener('pointermove', e => {
    if (!ptr) return;
    e.preventDefault();
    const p = posisi(e);
    const dx = p.x - ptr.lx, dy = p.y - ptr.ly;
    if (Math.hypot(p.x - ptr.sx, p.y - ptr.sy) > 6) ptr.moved = true;

    if (ptr.aksi === 'tarik' && seret) {
        seret.x = p.x; seret.y = p.y;
    } else if (ptr.aksi === 'rute' && rutaDraw) {
        rutaDraw.x = dariSX(p.x); rutaDraw.y = dariSY(p.y);
    } else if (ptr.aksi === 'pan' || ptr.aksi === 'grid') {
        kamera.x -= dx / kamera.skala;
        kamera.y -= dy / kamera.skala;
    }
    ptr.lx = p.x; ptr.ly = p.y;
});

canvas.addEventListener('pointerup', e => {
    if (!ptr) return;
    const p = posisi(e);
    const bilahTop = canvas.height - 100;

    switch (ptr.aksi) {
        case 'tarik':
            // Lepas di grid untuk menaruh satu objek. Lepas di bilah atau tidak valid = batal.
            if (seret && p.y < bilahTop) {
                const q = layarKeKisi(p.x, p.y);
                const a = anchorFor(seret.id, q.i, q.j);
                tempatkan(seret.id, a.i, a.j);
            }
            seret = null;   // opsi mati setelah dilepas
            break;

        case 'bilah':
            if (!ptr.moved) {
                if (ptr.id === 'hapus') hapusAktif = !hapusAktif;
                else if (ptr.id === 'ok') konfirm();
            }
            break;

        case 'grid':
            if (!ptr.moved && hapusAktif) {
                const q = layarKeKisi(p.x, p.y);
                hapusDi(q.i, q.j);
            }
            break;

        case 'build':
            if (!ptr.moved) masukBangun();
            break;

        case 'rute':
            if (ptr.moved && rutaDraw) {
                kapal.target = { x: rutaDraw.x, y: rutaDraw.y };
                kapal.rem = false;
            } else {
                kapal.target = null;   // ketuk tanpa seret: hentikan
            }
            rutaDraw = null;
            break;
    }
    ptr = null;
});

canvas.addEventListener('pointercancel', () => {
    ptr = null;
    seret = null;
    rutaDraw = null;
});

// ==========================================
// 9. GAMBAR
// ==========================================
function gambarKisi() {
    const s = C * kamera.skala;
    if (s < 4) return;
    const ox = ((toSX(0) % s) + s) % s;
    const oy = ((toSY(0) % s) + s) % s;
    ctx.strokeStyle = 'rgba(120,130,160,0.08)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = ox; x < canvas.width; x += s) { ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, canvas.height); }
    for (let y = oy; y < canvas.height; y += s) { ctx.moveTo(0, y + 0.5); ctx.lineTo(canvas.width, y + 0.5); }
    ctx.stroke();
}

function gambarKapal() {
    ctx.save();
    ctx.translate(toSX(kapal.x), toSY(kapal.y));
    ctx.scale(kamera.skala, kamera.skala);
    ctx.rotate(kapal.th);

    if (gbr.rangka.complete) ctx.drawImage(gbr.rangka, -PX, -PY, KW, KH);

    const im = kapal.hidup ? gbr.intiHidup : gbr.intiMati;
    if (im.complete) ctx.drawImage(im, INTI.i * C - PX, INTI.j * C - PY, INTI.w * C, INTI.h * C);

    if (gbr.sel.complete) {
        for (const c of cells.values()) {
            if (c.tipe === 'sel') ctx.drawImage(gbr.sel, c.i * C - PX, c.j * C - PY, C, C);
        }
    }

    if (gbr.utama.complete) {
        for (const t of thrs) ctx.drawImage(gbr.utama, t.i * C - PX, t.j * C - PY, 32, 48);
    }

    // Api hanya saat maju, dari pendorong yang tersambung
    if (gbr.efek.complete && kapal.gas) {
        const w = gbr.efek.naturalWidth * 0.25, h = gbr.efek.naturalHeight * 0.25;
        for (const t of thrs) {
            if (!t.aktif) continue;
            ctx.globalAlpha = 0.9;
            ctx.drawImage(gbr.efek, t.i * C - PX + 16 - w / 2, t.j * C - PY + 48, w, h);
            ctx.globalAlpha = 1;
        }
    }

    // Overlay bantu saat bangun
    if (mode === 'bangun') {
        ctx.lineWidth = 1 / kamera.skala;
        ctx.setLineDash([4, 3]);
        ctx.strokeStyle = 'rgba(253,224,71,0.5)';
        for (const s of SLOT) {
            ctx.strokeRect(s.i * C - PX, s.j * C - PY, s.w * C, s.h * C);
        }
        ctx.strokeRect(BATAS_I[0] * C - PX, BATAS_J[0] * C - PY,
            (BATAS_I[1] + 1 - BATAS_I[0]) * C, (BATAS_J[1] + 1 - BATAS_J[0]) * C);
        ctx.setLineDash([]);
    }
    ctx.restore();
}

// Bayangan saat opsi diseret: grid hijau/merah sebesar objek, mengikuti jari
function gambarSeret() {
    if (!seret) return;
    const bilahTop = canvas.height - 100;
    const img = seret.id === 'utama' ? gbr.utama : gbr.sel;

    if (seret.y < bilahTop) {
        const q = layarKeKisi(seret.x, seret.y);
        const a = anchorFor(seret.id, q.i, q.j);
        const d = DEF[seret.id];
        const ok = bolehTaruh(seret.id, a.i, a.j);
        const s = kamera.skala;
        const x0 = toSX(a.i * C - PX), y0 = toSY(a.j * C - PY);
        const w = d.w * C * s, h = d.h * C * s;

        ctx.fillStyle = ok ? 'rgba(74,222,128,0.35)' : 'rgba(248,113,113,0.35)';
        ctx.fillRect(x0, y0, w, h);
        ctx.strokeStyle = ok ? '#4ade80' : '#f87171';
        ctx.lineWidth = 2;
        ctx.strokeRect(x0, y0, w, h);
        if (img.complete) {
            ctx.globalAlpha = 0.6;
            ctx.drawImage(img, x0, y0, w, h);
            ctx.globalAlpha = 1;
        }
    }

    // Opsi yang terangkat tepat di atas jari
    if (img.complete) {
        const iw = img.naturalWidth * 1.5, ih = img.naturalHeight * 1.5;
        ctx.globalAlpha = 0.9;
        ctx.drawImage(img, seret.x - iw / 2, seret.y - 70 - ih / 2, iw, ih);
        ctx.globalAlpha = 1;
    }
}

// Garis putus-putus dari kapal ke tujuan akhir
function gambarRute() {
    let tx, ty;
    if (rutaDraw) { tx = toSX(rutaDraw.x); ty = toSY(rutaDraw.y); }
    else if (kapal.target) { tx = toSX(kapal.target.x); ty = toSY(kapal.target.y); }
    else return;

    ctx.save();
    ctx.setLineDash([8, 6]);
    ctx.strokeStyle = 'rgba(253,224,71,0.9)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(toSX(kapal.x), toSY(kapal.y));
    ctx.lineTo(tx, ty);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.arc(tx, ty, 6, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(253,224,71,0.9)';
    ctx.fill();
    ctx.restore();
}

function gambarTombolKotak(b, label, aktif) {
    ctx.fillStyle = aktif ? 'rgba(253,224,71,0.35)' : 'rgba(0,0,0,0.7)';
    ctx.strokeStyle = '#fde68a';
    ctx.lineWidth = 2;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = '#fde68a';
    ctx.font = '11px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, b.x + b.w / 2, b.y + b.h / 2);
}

function gambarUI() {
    const baris = [
        `Mode: ${mode === 'bangun' ? 'BANGUN' : 'UJI'}`,
        `Sambung: ${kapal.tersambung}/${cells.size}`,
        `Utama aktif: ${thrs.filter(t => t.aktif).length}/${thrs.length}`,
        `Status: ${kapal.status}`,
        `Kecepatan: ${kapal.v.toFixed(0)} px/s`,
        `Heading: ${((kapal.th * 180 / Math.PI + 360) % 360).toFixed(0)}°`,
        `Hapus: ${hapusAktif ? 'AKTIF' : 'mati'}`
    ];
    ctx.save();
    ctx.fillStyle = '#fde68a';
    ctx.font = '12px monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    baris.forEach((t, i) => ctx.fillText(t, 10, 10 + i * 16));
    ctx.restore();
}

function gambar() {
    ctx.fillStyle = '#07080d';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    gambarKisi();
    gambarKapal();
    gambarRute();

    if (mode === 'bangun') {
        gambarSeret();
        for (const b of tombolBilah()) {
            const aktif = (seret && seret.id === b.id) || (b.id === 'hapus' && hapusAktif);
            gambarTombolKotak(b, b.label, aktif);
        }
    } else {
        gambarTombolKotak(tombolBuild(), 'BUILD', false);
    }
    gambarUI();
}

// ==========================================
// 10. LOOP
// ==========================================
function loop(now) {
    let dt = (now - terakhir) / 1000;
    terakhir = now;
    if (dt > 0.05) dt = 0.05;

    hitungKoneksi();
    if (mode === 'uji') {
        kendali(dt);
    } else {
        kapal.v = 0; kapal.target = null; kapal.gas = false; kapal.status = '-';
    }
    gambar();
    requestAnimationFrame(loop);
}

function mulai() {
    if (!gbr.rangka.complete || gbr.rangka.naturalWidth === 0) {
        setTimeout(mulai, 100);
        return;
    }
    initKapal();
    requestAnimationFrame(loop);
}
mulai();
</script>
