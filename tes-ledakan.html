<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Uji Gelombang Kejut Transparan Beriak</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #07090f;
      overflow: hidden;
      font-family: monospace;
      color: #cbd5e1;
      touch-action: none;
    }
    canvas { display: block; }
    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid #334155;
      padding: 8px 12px;
      border-radius: 6px;
      pointer-events: none;
      font-size: 13px;
      line-height: 1.5;
    }
    .highlight { color: #38bdf8; font-weight: bold; }
  </style>
</head>
<body>
  <div id="hud">
    <div><span class="highlight">TAP / KLIK LAYAR</span> : Picu Gelombang Transparan</div>
    <div>FPS: <span id="fps" class="highlight">60</span> | Objek Sel: <span id="count">0</span></div>
  </div>
  <canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const fpsEl = document.getElementById('fps');
const countEl = document.getElementById('count');

let W = canvas.width = window.innerWidth;
let H = canvas.height = window.innerHeight;
window.addEventListener('resize', () => {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
});

const CELL_SIZE = 16;

// --- 1. KAMERA MATI + SCREEN SHAKE ---
const camera = {
  trauma: 0,
  maxOffset: 26,
  time: 0,
  addTrauma(amount) {
    this.trauma = Math.min(1, this.trauma + amount);
  },
  update(dt) {
    this.time += dt;
    this.trauma = Math.max(0, this.trauma - dt * 1.6);
  },
  apply(ctx) {
    if (this.trauma <= 0.001) return;
    const shake = this.trauma * this.trauma;
    const ox = Math.sin(this.time * 65) * this.maxOffset * shake;
    const oy = Math.cos(this.time * 53) * this.maxOffset * shake;
    ctx.translate(ox, oy);
  }
};

// --- 2. KELOMPOK SEL UJI ---
const cellClusters = [];

function spawnTestClusters() {
  cellClusters.length = 0;
  const cx = W / 2;
  const cy = H / 2;

  const presets = [
    { cols: 3, rows: 3, x: cx - 140, y: cy - 90,  color: '#38bdf8' },
    { cols: 4, rows: 2, x: cx + 130, y: cy - 110, color: '#4ade80' },
    { cols: 6, rows: 6, x: cx - 180, y: cy + 120, color: '#facc15' },
    { cols: 8, rows: 5, x: cx + 170, y: cy + 100, color: '#fb923c' },
    { cols: 2, rows: 2, x: cx,       y: cy - 180, color: '#f472b6' }
  ];

  for (const p of presets) {
    const totalCells = p.cols * p.rows;
    cellClusters.push({
      x: p.x, y: p.y,
      vx: 0, vy: 0,
      angle: 0, angVel: 0,
      cols: p.cols, rows: p.rows,
      mass: totalCells,
      color: p.color
    });
  }
  countEl.textContent = cellClusters.reduce((sum, c) => sum + c.mass, 0);
}

// --- 3. GELOMBANG KEJUT TRANSPARAN BERIAK ---
const shockwaves = [];
const sparks = [];

function triggerExplosion(x, y) {
  const maxRadius = 500;
  const baseForce = 1800;

  camera.addTrauma(0.95);

  // Gelombang utama (riak besar transparan)
  shockwaves.push({
    x, y,
    radius: 12,
    maxRadius,
    speed: 1050,
    life: 1.0,
    freq: 14,          // Jumlah gelombang riak di sekeliling lingkaran
    amp: 9,            // Tinggi gelombang riak (piksel)
    phase: Math.random() * 6.28,
    tint: '186, 230, 253' // Biru sangat muda bening
  });

  // Gelombang susulan (riak kedua yang lebih rapat & hangat)
  shockwaves.push({
    x, y,
    radius: 6,
    maxRadius: maxRadius * 0.72,
    speed: 820,
    life: 1.0,
    freq: 20,
    amp: 6,
    phase: Math.random() * 6.28,
    tint: '254, 215, 170' // Putih-oranye hangat transparan
  });

  // Percikan tipis
  for (let i = 0; i < 20; i++) {
    const a = (Math.PI * 2 * i) / 20 + (Math.random() - 0.5) * 0.2;
    const spd = 120 + Math.random() * 360;
    sparks.push({
      x, y,
      vx: Math.cos(a) * spd,
      vy: Math.sin(a) * spd,
      life: 0.35 + Math.random() * 0.3,
      maxLife: 0.65
    });
  }

  // Dorongan fisik ke kelompok sel
  for (const c of cellClusters) {
    const dx = c.x - x;
    const dy = c.y - y;
    const dist = Math.hypot(dx, dy);

    if (dist < maxRadius && dist > 1) {
      const falloff = 1 - (dist / maxRadius);
      const impulse = (baseForce * falloff * falloff) / Math.sqrt(c.mass);

      c.vx += (dx / dist) * impulse;
      c.vy += (dy / dist) * impulse;
      c.angVel += ((Math.random() - 0.5) * 6 * falloff) / Math.sqrt(c.mass);
    }
  }
}

// Fungsi menggambar path lingkaran bergelombang (Wavy Circle)
function traceWavyCircle(ctx, cx, cy, baseRadius, freq, amp, phase) {
  const segments = 64; // Cukup halus tapi sangat ringan di CPU mobile
  ctx.beginPath();
  for (let i = 0; i <= segments; i++) {
    const theta = (i / segments) * Math.PI * 2;
    // Kombinasi 2 frekuensi sinus agar gelombang terlihat alami tidak simetris kaku
    const wave = Math.sin(theta * freq + phase) * amp
               + Math.cos(theta * (freq * 0.5) - phase * 1.3) * (amp * 0.45);
    const r = Math.max(1, baseRadius + wave);
    const px = cx + Math.cos(theta) * r;
    const py = cy + Math.sin(theta) * r;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
}

// --- 4. UPDATE & RENDER ---
function update(dt) {
  camera.update(dt);

  for (const c of cellClusters) {
    c.x += c.vx * dt;
    c.y += c.vy * dt;
    c.angle += c.angVel * dt;

    c.vx *= 0.992;
    c.vy *= 0.992;
    c.angVel *= 0.99;

    const pad = 40;
    if (c.x < pad) { c.x = pad; c.vx *= -0.6; }
    if (c.x > W - pad) { c.x = W - pad; c.vx *= -0.6; }
    if (c.y < pad) { c.y = pad; c.vy *= -0.6; }
    if (c.y > H - pad) { c.y = H - pad; c.vy *= -0.6; }
  }

  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const sw = shockwaves[i];
    sw.radius += sw.speed * dt;
    sw.phase += dt * 28; // Kecepatan getaran riak pinggiran
    sw.life = 1 - (sw.radius / sw.maxRadius);
    if (sw.life <= 0) shockwaves.splice(i, 1);
  }

  for (let i = sparks.length - 1; i >= 0; i--) {
    const sp = sparks[i];
    sp.x += sp.vx * dt;
    sp.y += sp.vy * dt;
    sp.vx *= 0.95;
    sp.vy *= 0.95;
    sp.life -= dt;
    if (sp.life <= 0) sparks.splice(i, 1);
  }
}

function draw() {
  ctx.fillStyle = '#07090f';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  camera.apply(ctx);

  // Grid latar belakang (agar efek transparan gelombang terlihat jelas saat melewatinya)
  ctx.strokeStyle = '#141d2e';
  ctx.lineWidth = 1;
  const gridStep = 48; // 3 sel
  for (let gx = 0; gx < W; gx += gridStep) {
    ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke();
  }
  for (let gy = 0; gy < H; gy += gridStep) {
    ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
  }

  // Gambar kelompok sel
  for (const c of cellClusters) {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.angle);

    const wPx = c.cols * CELL_SIZE;
    const hPx = c.rows * CELL_SIZE;
    const startX = -wPx / 2;
    const startY = -hPx / 2;

    ctx.fillStyle = c.color;
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 1.5;

    for (let r = 0; r < c.rows; r++) {
      for (let col = 0; col < c.cols; col++) {
        const px = startX + col * CELL_SIZE;
        const py = startY + r * CELL_SIZE;
        ctx.fillRect(px, py, CELL_SIZE, CELL_SIZE);
        ctx.strokeRect(px, py, CELL_SIZE, CELL_SIZE);
      }
    }
    ctx.restore();
  }

  // Gambar percikan
  for (const sp of sparks) {
    const alpha = Math.max(0, sp.life / sp.maxLife);
    ctx.fillStyle = `rgba(253, 224, 71, ${alpha * 0.85})`;
    ctx.fillRect(sp.x - 2, sp.y - 2, 4, 4);
  }

  // Gambar gelombang kejut transparan beriak
  for (const sw of shockwaves) {
    ctx.save();
    // Mode 'lighter' membuat gelombang terlihat seperti cahaya/energi bening tanpa menutup objek di bawahnya
    ctx.globalCompositeOperation = 'lighter';

    const currentAmp = sw.amp * sw.life;
    const outerR = sw.radius + currentAmp + 6;
    const innerR = Math.max(0, sw.radius * 0.72);

    // 1. Isi gradien radial transparan (bening di tengah, sedikit berkilau di tepi gelombang)
    const grad = ctx.createRadialGradient(sw.x, sw.y, innerR, sw.x, sw.y, outerR);
    grad.addColorStop(0.0, `rgba(${sw.tint}, 0)`);
    grad.addColorStop(0.65, `rgba(${sw.tint}, ${sw.life * 0.05})`);
    grad.addColorStop(0.88, `rgba(${sw.tint}, ${sw.life * 0.16})`);
    grad.addColorStop(1.0, `rgba(${sw.tint}, 0)`);

    traceWavyCircle(ctx, sw.x, sw.y, sw.radius, sw.freq, currentAmp, sw.phase);
    ctx.fillStyle = grad;
    ctx.fill();

    // 2. Garis riak tepi tipis yang sangat transparan
    ctx.lineWidth = Math.max(1, 5 * sw.life);
    ctx.strokeStyle = `rgba(${sw.tint}, ${sw.life * 0.28})`;
    ctx.stroke();

    // 3. Bayangan riak dalam (memberi kesan gelombang tekanan berlapis)
    if (sw.radius > 25) {
      traceWavyCircle(ctx, sw.x, sw.y, sw.radius - 14, sw.freq, currentAmp * 0.7, -sw.phase);
      ctx.lineWidth = Math.max(1, 2.5 * sw.life);
      ctx.strokeStyle = `rgba(${sw.tint}, ${sw.life * 0.15})`;
      ctx.stroke();
    }

    ctx.restore();
  }

  ctx.restore();
}

canvas.addEventListener('pointerdown', (e) => {
  triggerExplosion(e.clientX, e.clientY);
});

spawnTestClusters();
setTimeout(() => triggerExplosion(W / 2, H / 2), 400);

let lastTime = performance.now();
let frames = 0;
let fpsTimer = 0;

function loop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;

  frames++;
  fpsTimer += dt;
  if (fpsTimer >= 0.5) {
    fpsEl.textContent = Math.round(frames / fpsTimer);
    frames = 0;
    fpsTimer = 0;
  }

  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
