<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmoteer Explosion Test</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050510; overflow: hidden; font-family: sans-serif; color: white; }
  canvas { display: block; }
  #ui {
    position: fixed; top: 15px; left: 50%; transform: translateX(-50%);
    text-align: center; z-index: 10; pointer-events: none;
  }
  #ui h1 { font-size: 18px; letter-spacing: 2px; }
  #ui p { font-size: 12px; opacity: 0.7; margin-top: 4px; }
  #controls {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; z-index: 10;
  }
  button {
    padding: 12px 20px; border: none; border-radius: 20px;
    background: #ff6b00; color: white; font-weight: bold; cursor: pointer;
  }
  button:nth-child(2) { background: #00aaff; }
  button:nth-child(3) { background: #ff0055; }
  button:active { transform: scale(0.95); }
</style>
</head>
<body>

<div id="ui">
  <h1>💥 COSMOTEER EXPLOSION TEST</h1>
  <p>Klik di mana aja untuk meledak • Atau pencet tombol bawah</p>
</div>

<div id="controls">
  <button onclick="spawnExplosion(innerWidth/2, innerHeight/2, 1)">Ledakan Kecil</button>
  <button onclick="spawnExplosion(innerWidth/2, innerHeight/2, 2.5)">Ledakan Sedang</button>
  <button onclick="spawnExplosion(innerWidth/2, innerHeight/2, 5)">LEDAKAN REAKTOR!</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = innerWidth;
canvas.height = innerHeight;

let particles = [];
let shockwaves = [];
let flashes = [];
let shake = 0;
let stars = [];

// Bintang background biar kayak luar angkasa
for(let i=0;i<150;i++){
  stars.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height, r: Math.random()*1.5+0.3});
}

// === 1. FUNGSI UTAMA LEDAKAN - ALA COSMOTEER ===
function spawnExplosion(x, y, size = 1){
  shake = 8 * size;

  // A. FLASH - Kilatan putih langsung
  flashes.push({x, y, r: 10, maxR: 90*size, alpha: 1, size});

  // B. SHOCKWAVE - Ring yang ngembang
  shockwaves.push({x, y, r: 5, maxR: 220*size, alpha: 0.9});

  // C. FIREBALL - Bola api utama
  for(let i=0;i<25*size;i++){
    let angle = Math.random()*Math.PI*2;
    let speed = Math.random()*2+0.5;
    particles.push({
      type: 'fire', x, y,
      vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
      r: Math.random()*22*size+10, life: 1, decay: 0.02+Math.random()*0.02,
      color: ['#fff700','#ffaa00','#ff5500','#ff2200'][Math.floor(Math.random()*4)]
    });
  }

  // D. DEBRIS - Potongan metal mental
  for(let i=0;i<20*size;i++){
    let angle = Math.random()*Math.PI*2;
    let speed = Math.random()*7+2;
    particles.push({
      type: 'debris', x, y,
      vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
      r: Math.random()*4+2, life: 1, decay: 0.015,
      rot: Math.random()*Math.PI, vr: (Math.random()-0.5)*0.4,
      color: '#8a8a9a'
    });
  }

  // E. SPARKS - Percikan api kecil cepet
  for(let i=0;i<40*size;i++){
    let angle = Math.random()*Math.PI*2;
    let speed = Math.random()*10+4;
    particles.push({
      type: 'spark', x, y,
      vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
      r: Math.random()*2+1, life: 1, decay: 0.03,
      color: '#ffff99'
    });
  }

  // F. SMOKE - Asap yang naik pelan & awet
  for(let i=0;i<18*size;i++){
    let angle = Math.random()*Math.PI*2;
    particles.push({
      type: 'smoke', x: x+(Math.random()-0.5)*20, y: y+(Math.random()-0.5)*20,
      vx: Math.cos(angle)*0.5, vy: Math.sin(angle)*0.5 - 0.3,
      r: Math.random()*15*size+8, life: 1, decay: 0.008,
      color: '100,100,110'
    });
  }
}

// === 2. LOOP GAME ===
function update(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Shake kamera
  ctx.save();
  if(shake > 0){
    ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
    shake *= 0.9;
  }

  // Gambar bintang
  ctx.fillStyle = 'white';
  stars.forEach(s => { ctx.globalAlpha = 0.6; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill(); });
  ctx.globalAlpha = 1;

  // Flash
  flashes = flashes.filter(f => f.alpha > 0);
  flashes.forEach(f => {
    f.r += 12 * f.size; f.alpha -= 0.08;
    let grad = ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r);
    grad.addColorStop(0, `rgba(255,255,255,${f.alpha})`);
    grad.addColorStop(0.5, `rgba(255,220,0,${f.alpha*0.8})`);
    grad.addColorStop(1, 'rgba(255,100,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,Math.PI*2); ctx.fill();
  });

  // Shockwave
  shockwaves = shockwaves.filter(s => s.alpha > 0);
  shockwaves.forEach(s => {
    s.r += 12; s.alpha -= 0.03;
    ctx.strokeStyle = `rgba(255,255,255,${s.alpha})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.stroke();
  });

  // Particles
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.98; p.vy *= 0.98; // gesekan udara
    p.life -= p.decay;

    if(p.type === 'fire'){
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r*p.life+2,0,Math.PI*2); ctx.fill();
    }
    if(p.type === 'debris'){
      p.rot += p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
      ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);
      ctx.restore();
    }
    if(p.type === 'spark'){
      ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
    }
    if(p.type === 'smoke'){
      ctx.globalAlpha = p.life * 0.4; ctx.fillStyle = `rgba(${p.color},1)`;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r + (1-p.life)*20,0,Math.PI*2); ctx.fill();
    }
  });
  ctx.globalAlpha = 1;
  ctx.restore();
  requestAnimationFrame(update);
}
update();

// Klik = Ledakan
canvas.addEventListener('pointerdown', e => {
  spawnExplosion(e.clientX, e.clientY, 1.5);
});

// Auto ledakan pas awal biar langsung kelihatan
setTimeout(()=> spawnExplosion(innerWidth/2, innerHeight/2, 2), 500);
</script>
</body>
</html>
