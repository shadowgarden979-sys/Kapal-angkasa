<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Uji Gelombang Kejut Pembiasan + Kilatan + Panas Sel</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #07090f;
      overflow: hidden;
      font-family: monospace;
      color: #cbd5e1;
      touch-action: none;
    }

    canvas { display: block; }

    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 10;
      padding: 8px 12px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid #334155;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.5;
      pointer-events: none;
    }

    .highlight { color: #38bdf8; font-weight: bold; }
  </style>
</head>
<body>
  <div id="hud">
    <div><span class="highlight">TAP / KLIK LAYAR</span> : Picu Ledakan Pembiasan</div>
    <div>FPS: <span id="fps" class="highlight">60</span> | Objek Sel: <span id="count">0</span></div>
  </div>
  <canvas id="c"></canvas>

  <script>
    // ===== SETUP =====
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const fpsEl = document.getElementById('fps');
    const countEl = document.getElementById('count');

    let W = 0;
    let H = 0;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // ===== KONSTANTA =====
    const CELL_SIZE = 16;
    const GRID_STEP = 48;
    const CLUSTER_PAD = 40;
    const WAVE_SEGMENTS = 64;
    const EXPLOSION_MAX_RADIUS = 460;
    const EXPLOSION_FORCE = 1850;

    // ===== 1. KAMERA + SCREEN SHAKE =====
    const camera = {
      trauma: 0,
      maxOffset: 24,
      time: 0,
      ox: 0,
      oy: 0,

      addTrauma(amount) {
        this.trauma = Math.min(1, this.trauma + amount);
      },

      update(dt) {
        this.time += dt;
        this.trauma = Math.max(0, this.trauma - dt * 1.8);

        if (this.trauma > 0.001) {
          const shake = this.trauma * this.trauma;
          this.ox = Math.sin(this.time * 68) * this.maxOffset * shake;
          this.oy = Math.cos(this.time * 55) * this.maxOffset * shake;
        } else {
          this.ox = 0;
          this.oy = 0;
        }
      },

      apply(ctx) {
        if (this.ox !== 0 || this.oy !== 0) {
          ctx.translate(this.ox, this.oy);
        }
      }
    };

    // ===== 2. KELOMPOK SEL UJI + SUHU TERMAL =====
    const cellClusters = [];

    function spawnTestClusters() {
      cellClusters.length = 0;
      const cx = W / 2;
      const cy = H / 2;

      const presets = [
        { cols: 3, rows: 3, x: cx - 130, y: cy - 85,  color: '#38bdf8' },
        { cols: 4, rows: 2, x: cx + 125, y: cy - 105, color: '#4ade80' },
        { cols: 6, rows: 6, x: cx - 170, y: cy + 115, color: '#94a3b8' },
        { cols: 8, rows: 5, x: cx + 165, y: cy + 95,  color: '#64748b' },
        { cols: 2, rows: 2, x: cx,       y: cy - 165, color: '#f472b6' }
      ];

      for (const p of presets) {
        cellClusters.push({
          x: p.x,
          y: p.y,
          vx: 0,
          vy: 0,
          angle: 0,
          angVel: 0,
          cols: p.cols,
          rows: p.rows,
          mass: p.cols * p.rows,
          color: p.color,
          heat: 0
        });
      }

      countEl.textContent = cellClusters.reduce((sum, c) => sum + c.mass, 0);
    }

    // ===== 3. SISTEM LEDAKAN: KILATAN + PEMBIASAN + PERCIKAN =====
    const flashes = [];
    const shockwaves = [];
    const sparks = [];

    function triggerExplosion(x, y) {
      camera.addTrauma(0.95);

      // Kilatan cahaya inti
      flashes.push({
        x, y,
        radius: 75,
        flareLen: 150,
        life: 1.0,
        decay: 7.5
      });

      // Gelombang kejut utama (pembiasan cermin tipis)
      shockwaves.push({
        x, y,
        radius: 18,
        maxRadius: EXPLOSION_MAX_RADIUS,
        speed: 1120,
        life: 1.0,
        freq: 14,
        amp: 8,
        bandWidth: 38,
        refractZoom: 1.07,
        phase: Math.random() * Math.PI * 2,
        tint: '186, 230, 253'
      });

      // Gelombang panas susulan
      shockwaves.push({
        x, y,
        radius: 8,
        maxRadius: EXPLOSION_MAX_RADIUS * 0.65,
        speed: 850,
        life: 1.0,
        freq: 22,
        amp: 5,
        bandWidth: 22,
        refractZoom: 1.04,
        phase: Math.random() * Math.PI * 2,
        tint: '254, 215, 170'
      });

      // Percikan piksel
      for (let i = 0; i < 22; i++) {
        const a = (Math.PI * 2 * i) / 22 + (Math.random() - 0.5) * 0.25;
        const spd = 140 + Math.random() * 380;
        sparks.push({
          x, y,
          vx: Math.cos(a) * spd,
          vy: Math.sin(a) * spd,
          size: Math.random() > 0.4 ? 3 : 2,
          life: 0.3 + Math.random() * 0.3,
          maxLife: 0.6
        });
      }

      // Dorongan fisik + transfer panas ke sel
      for (const c of cellClusters) {
        const dx = c.x - x;
        const dy = c.y - y;
        const dist = Math.hypot(dx, dy);

        if (dist < EXPLOSION_MAX_RADIUS && dist > 1) {
          const falloff = 1 - (dist / EXPLOSION_MAX_RADIUS);
          const impulse = (EXPLOSION_FORCE * falloff * falloff) / Math.sqrt(c.mass);

          c.vx += (dx / dist) * impulse;
          c.vy += (dy / dist) * impulse;
          c.angVel += ((Math.random() - 0.5) * 6 * falloff) / Math.sqrt(c.mass);
          c.heat = Math.min(1.0, c.heat + falloff * falloff * 1.15);
        }
      }
    }

    // ===== HELPER GELOMBANG =====
    // Radius gelombang sebagai fungsi sudut theta
    function waveRadius(theta, base, freq, amp, phase) {
      return base
        + Math.sin(theta * freq + phase) * amp
        + Math.cos(theta * (freq * 0.5) - phase * 1.3) * (amp * 0.45);
    }

    // Membuat jalur tertutup bergelombang. Tidak memanggil beginPath.
    function wavyPath(cx, cy, radiusAt, reverse = false) {
      for (let s = 0; s <= WAVE_SEGMENTS; s++) {
        const i = reverse ? WAVE_SEGMENTS - s : s;
        const theta = (i / WAVE_SEGMENTS) * Math.PI * 2;
        const r = Math.max(1, radiusAt(theta));
        const px = cx + Math.cos(theta) * r;
        const py = cy + Math.sin(theta) * r;
        if (s === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
    }

    // ===== 4. UPDATE =====
    function updateClusters(dt) {
      for (const c of cellClusters) {
        c.x += c.vx * dt;
        c.y += c.vy * dt;
        c.angle += c.angVel * dt;

        c.vx *= 0.992;
        c.vy *= 0.992;
        c.angVel *= 0.99;

        if (c.heat > 0) {
          c.heat = Math.max(0, c.heat - dt * 0.28);
        }

        // Pantulan di tepi layar
        if (c.x < CLUSTER_PAD)     { c.x = CLUSTER_PAD;     c.vx *= -0.6; }
        if (c.x > W - CLUSTER_PAD) { c.x = W - CLUSTER_PAD; c.vx *= -0.6; }
        if (c.y < CLUSTER_PAD)     { c.y = CLUSTER_PAD;     c.vy *= -0.6; }
        if (c.y > H - CLUSTER_PAD) { c.y = H - CLUSTER_PAD; c.vy *= -0.6; }
      }
    }

    function updateEffects(dt) {
      for (let i = flashes.length - 1; i >= 0; i--) {
        flashes[i].life -= flashes[i].decay * dt;
        if (flashes[i].life <= 0) flashes.splice(i, 1);
      }

      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        sw.radius += sw.speed * dt;
        sw.phase += dt * 28;
        sw.life = 1 - (sw.radius / sw.maxRadius);
        if (sw.life <= 0) shockwaves.splice(i, 1);
      }

      for (let i = sparks.length - 1; i >= 0; i--) {
        const sp = sparks[i];
        sp.x += sp.vx * dt;
        sp.y += sp.vy * dt;
        sp.vx *= 0.94;
        sp.vy *= 0.94;
        sp.life -= dt;
        if (sp.life <= 0) sparks.splice(i, 1);
      }
    }

    function update(dt) {
      camera.update(dt);
      updateClusters(dt);
      updateEffects(dt);
    }

    // ===== 5. RENDER =====
    function drawGrid() {
      ctx.strokeStyle = '#141d2e';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let gx = 0; gx < W; gx += GRID_STEP) {
        ctx.moveTo(gx, 0);
        ctx.lineTo(gx, H);
      }
      for (let gy = 0; gy < H; gy += GRID_STEP) {
        ctx.moveTo(0, gy);
        ctx.lineTo(W, gy);
      }
      ctx.stroke();
    }

    function drawCluster(c) {
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.rotate(c.angle);

      const startX = -(c.cols * CELL_SIZE) / 2;
      const startY = -(c.rows * CELL_SIZE) / 2;

      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 1.5;

      for (let r = 0; r < c.rows; r++) {
        for (let col = 0; col < c.cols; col++) {
          const px = startX + col * CELL_SIZE;
          const py = startY + r * CELL_SIZE;

          ctx.fillStyle = c.color;
          ctx.fillRect(px, py, CELL_SIZE, CELL_SIZE);

          if (c.heat > 0.01) {
            ctx.fillStyle = c.heat > 0.65
              ? `rgba(255, 140, 20, ${c.heat * 0.85})`
              : `rgba(239, 35, 35, ${c.heat * 0.85})`;
            ctx.fillRect(px, py, CELL_SIZE, CELL_SIZE);
          }

          ctx.strokeRect(px, py, CELL_SIZE, CELL_SIZE);
        }
      }

      ctx.restore();
    }

    function drawSparks() {
      for (const sp of sparks) {
        const alpha = Math.max(0, sp.life / sp.maxLife);
        ctx.fillStyle = `rgba(254, 240, 138, ${alpha})`;
        ctx.fillRect(
          Math.round(sp.x - sp.size / 2),
          Math.round(sp.y - sp.size / 2),
          sp.size,
          sp.size
        );
      }
    }

    function drawShockwave(sw) {
      const currentAmp = sw.amp * sw.life;
      const outerR = sw.radius;
      const innerR = Math.max(0, sw.radius - sw.bandWidth * sw.life);

      // Efek refraksi: salin area canvas di dalam cincin lalu perbesar sedikit
      if (outerR > 12 && outerR - innerR > 2) {
        ctx.save();
        ctx.beginPath();
        wavyPath(sw.x, sw.y, th => waveRadius(th, outerR, sw.freq, currentAmp, sw.phase));
        wavyPath(sw.x, sw.y, th => innerR + Math.sin(th * sw.freq - sw.phase) * (currentAmp * 0.6), true);
        ctx.clip();

        const zoom = 1 + (sw.refractZoom - 1) * sw.life;
        const boxSize = (outerR + currentAmp + 16) * 2;
        const sx = sw.x + camera.ox - boxSize / 2;
        const sy = sw.y + camera.oy - boxSize / 2;

        ctx.translate(sw.x, sw.y);
        ctx.scale(zoom, zoom);
        ctx.translate(-sw.x, -sw.y);

        ctx.drawImage(
          canvas,
          sx, sy, boxSize, boxSize,
          sw.x - boxSize / 2, sw.y - boxSize / 2, boxSize, boxSize
        );
        ctx.restore();
      }

      // Garis kilau cermin tipis
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';

      ctx.beginPath();
      wavyPath(sw.x, sw.y, th => waveRadius(th, outerR, sw.freq, currentAmp, sw.phase));
      ctx.lineWidth = Math.max(1, 3.5 * sw.life);
      ctx.strokeStyle = `rgba(${sw.tint}, ${sw.life * 0.35})`;
      ctx.stroke();

      if (innerR > 10) {
        ctx.beginPath();
        wavyPath(sw.x, sw.y, th => waveRadius(th, innerR, sw.freq, currentAmp * 0.6, -sw.phase));
        ctx.lineWidth = Math.max(1, 1.5 * sw.life);
        ctx.strokeStyle = `rgba(255, 255, 255, ${sw.life * 0.18})`;
        ctx.stroke();
      }

      ctx.restore();
    }

    function drawFlash(fl) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';

      const r = fl.radius * (1.2 - fl.life * 0.4);
      const grad = ctx.createRadialGradient(fl.x, fl.y, 0, fl.x, fl.y, r);
      grad.addColorStop(0.0,  `rgba(255, 255, 255, ${fl.life})`);
      grad.addColorStop(0.35, `rgba(254, 240, 138, ${fl.life * 0.85})`);
      grad.addColorStop(0.7,  `rgba(251, 146, 60, ${fl.life * 0.35})`);
      grad.addColorStop(1.0,  'rgba(251, 146, 60, 0)');

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(fl.x, fl.y, r, 0, Math.PI * 2);
      ctx.fill();

      // Cross flare
      const len = fl.flareLen * fl.life;
      ctx.fillStyle = `rgba(255, 255, 255, ${fl.life * 0.9})`;
      ctx.fillRect(fl.x - len, fl.y - 1.5, len * 2, 3);
      ctx.fillRect(fl.x - 1.5, fl.y - len, 3, len * 2);

      ctx.restore();
    }

    function draw() {
      ctx.fillStyle = '#07090f';
      ctx.fillRect(0, 0, W, H);

      ctx.save();
      camera.apply(ctx);

      drawGrid();
      for (const c of cellClusters) drawCluster(c);
      drawSparks();
      for (const sw of shockwaves) drawShockwave(sw);
      for (const fl of flashes) drawFlash(fl);

      ctx.restore();
    }

    // ===== INPUT + LOOP =====
    canvas.addEventListener('pointerdown', (e) => {
      triggerExplosion(e.clientX, e.clientY);
    });

    spawnTestClusters();
    setTimeout(() => triggerExplosion(W / 2, H / 2), 400);

    let lastTime = performance.now();
    let frames = 0;
    let fpsTimer = 0;

    function loop(now) {
      const dt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;

      frames++;
      fpsTimer += dt;
      if (fpsTimer >= 0.5) {
        fpsEl.textContent = Math.round(frames / fpsTimer);
        frames = 0;
        fpsTimer = 0;
      }

      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
