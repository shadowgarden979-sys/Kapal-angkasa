<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tes Meriam</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #07080d; }
        canvas { display: block; touch-action: none; }
        #instruksi {
            position: absolute; top: 10px; width: 100%; text-align: center;
            color: #0f0; font-family: monospace; font-size: 14px; pointer-events: none;
            background: rgba(0, 0, 0, 0.6); padding: 4px 0;
        }
    </style>
</head>
<body>
    <div id="instruksi">Satu jari = putar | Dua jari = geser layar | Kanan bawah = tembak | Kiri bawah = sel | +/− = zoom</div>
    <canvas id="gameCanvas"></canvas>

    <audio id="sfxTembak" src="tembakan.mp3" preload="auto"></audio>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const sfxTembak = document.getElementById('sfxTembak');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ctx.imageSmoothingEnabled = false;
        }
        window.addEventListener('resize', resize);
        resize();

        // ==========================================
        // FILE GAMBAR
        // ==========================================
        const imgAlas = new Image(); imgAlas.src = "alas.png";
        const imgRumah = new Image(); imgRumah.src = "rumah-laras.png";
        const imgLaras = new Image(); imgLaras.src = "laras.png";
        const imgPeluru = new Image(); imgPeluru.src = "peluru.png";
        const imgSel = new Image(); imgSel.src = "sel1.png";
        const imgKilatan1 = new Image(); imgKilatan1.src = "kilatan1.png";
        const imgKilatan2 = new Image(); imgKilatan2.src = "kilatan2.png";

        // ==========================================
        // SKALA
        // ==========================================
        const METER_PER_SEL = 16;
        const PIX = 16;
        const N = PIX * PIX;
        const ZOOM = 2;
        const SEL = PIX * ZOOM;

        // ==========================================
        // CHUNK (kelompok sel 8×8 dengan satu kanvas)
        // ==========================================
        const CHUNK_SEL = 8;
        const CHUNK_W = CHUNK_SEL * SEL;
        const CHUNK_PX = CHUNK_SEL * PIX;
        const INTERVAL_RENDER_CHUNK = 100;

        const JARAK_SPAWN_SEL = 5;
        const MAKS_TUMPUK = 4;

        const TARGET_X = 4 * SEL;
        const TARGET_Y = -6 * SEL;

        const RADAR_MARGIN = SEL;
        const RADAR_DURASI = 0.3;
        const RADAR_TAMPIL = true;

        // ==========================================
        // KAPAL RAKSASA (bertahap)
        // ==========================================
        const KAPAL_W = 150;
        const KAPAL_H = 110;
        const SPAWN_PER_FRAME = 96;          // dinaikkan dari 256 agar HP lemah tidak macet
        const KAPAL_JARAK_X = 1500;

        // ==========================================
        // ZOOM & TINGKAT DETAIL (LOD)
        // ==========================================
        const ZOOM_MIN = 0.03;
        const ZOOM_MAX = 2.5;
        const ZOOM_LANGKAH = 1.25;

        const LOD_DEKAT_PX = 12;
        const LOD_SEDANG_PX = 4.5;
        const LOD_JAUH_PX = 1.5;

        // ==========================================
        // FISIKA PELURU & TEKANAN
        // ==========================================
        const KETAHANAN_YAMATO = 40;
        const PENGURANGAN_TINGKAT = 0.8;
        const MAX_TINGKAT = 5;
        const KECEPATAN_MIN = 10;
        const GEPENG_MULAI = 100;
        const PANAS_CHANCE = 0.3;
        const JARAK_EFEKTIF_PX = 52000;

        const TINGKAT_WARNA = [null, '#7f1d1d', '#dc2626', '#fb923c', '#facc15', '#ffffff'];
        const TINGKAT_BERIKUT = [0, 0, 1, 2, 2, 4];
        const TINGKAT_DURASI = [0, 3, 2, 1, 1, 1];

        // ==========================================
        // PENGATURAN KALIBRASI (SILAKAN OTAK-ATIK)
        // ==========================================
        const JARAK_LARAS = 21;
        const LARAS_OFFSET_Y = -115;
        const PIVOT_Y_OFFSET = 22;
        const RUMAH_W = 98, RUMAH_H = 109;

        const RECOIL_MAX = 50;
        const RECOIL_DURASI = 0.35;

        const FIRE_INTERVAL = 0.15;

        const KECEPATAN_PELURU = 800;
        const PELURU_W = 7;
        const PELURU_H = 24;

        const KILATAN_SKALA = 0.25;
        const KILATAN_DURASI = 0.06;
        const KILATAN_MAJU = 0.5;

        const TOMBOL_R = 48;
        const TOMBOL_ZOOM_R = 22;

        // ==========================================
        // STATUS
        // ==========================================
        let camX = 0, camY = 0;
        let skala = 1;
        let currentAngle = -Math.PI / 2;
        let targetAngle = -Math.PI / 2;

        let recoilKiri = 0, recoilTengah = 0, recoilKanan = 0;
        let giliranTembak = 0;
        let fireCooldown = 0;

        let bullets = [];
        let effects = [];
        let sels = [];
        let chunks = new Map();
        let lastShot = null;

        // Daftar aktif (diperbarui saat status berubah, bukan dicari tiap frame)
        const activeCells = new Set();   // sel dengan radar atau efek kena
        const hotCells = new Set();      // sel dengan piksel panas
        const dirtyChunks = new Set();   // chunk yang perlu digambar ulang
        let habisSel = [];               // sel yang pikselnya habis, dibuang di frame berikutnya
        let totalPikselCount = 0;        // penghitung incremental

        let klusterDirty = true;
        let klusterList = [];

        let RGB_DASAR = null;
        let RGB_GOSONG = null;
        let RGB_TINGKAT = null;
        let warnaSiap = false;
        let sudahInit = false;

        let gridTile = null;
        let gridTileSize = 0;
        let gridPattern = null;

        let siluetAlas = null;
        let siluetTurret = null;
        let siluetSiap = false;

        let antreanSpawn = [];
        let antreanPos = 0;

        let levelSekarang = 'dekat';
        let selTampak = 0;

        let debugTampil = false;

        const pointers = new Map();
        let lastMid = null;

        const profil = {
            fps: 0, frames: 0, lastFps: performance.now(),
            update: 0, draw: 0, dingin: 0, sel: 0, panel: 0,
            aktif: 0, tidur: 0, chunkAktif: 0,
            radar: 0, panas: 0
        };

        function haluskan(lama, baru) {
            return lama * 0.9 + baru * 0.1;
        }

        function modPositif(a, m) {
            return ((a % m) + m) % m;
        }

        function hexKeRgb(hex) {
            if (!hex) return null;
            const n = parseInt(hex.slice(1), 16);
            return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
        }

        // ==========================================
        // TINGKAT DETAIL
        // ==========================================
        function hitungLevel() {
            const selPx = SEL * skala;
            selTampak = Math.min(canvas.width, canvas.height) / selPx;
            if (selPx >= LOD_DEKAT_PX) return 'dekat';
            if (selPx >= LOD_SEDANG_PX) return 'sedang';
            if (selPx >= LOD_JAUH_PX) return 'jauh';
            return 'strategis';
        }

        function labelLevel(level) {
            if (level === 'dekat') return 'dekat (piksel)';
            if (level === 'sedang') return 'sedang (chunk)';
            if (level === 'jauh') return 'jauh (siluet)';
            return 'strategis (ikon)';
        }

        // ==========================================
        // LATAR GRID
        // ==========================================
        function siapkanGrid() {
            const size = Math.max(4, Math.round(SEL * skala));
            if (gridTile && gridTileSize === size) return;

            gridTileSize = size;
            gridTile = document.createElement('canvas');
            gridTile.width = size;
            gridTile.height = size;
            const g = gridTile.getContext('2d');
            g.fillStyle = 'rgba(120, 130, 160, 0.08)';
            g.fillRect(0, 0, 1, size);
            g.fillRect(0, 0, size, 1);
            gridPattern = ctx.createPattern(gridTile, 'repeat');
        }

        // ==========================================
        // SILUET MERIAM (dibuat sekali)
        // ==========================================
        function pastikanSiluet() {
            if (siluetSiap) return;
            if (!imgAlas.complete || !imgRumah.complete || !imgLaras.complete) return;
            if (imgAlas.naturalWidth === 0 || imgLaras.naturalWidth === 0) return;

            const aw = imgAlas.naturalWidth, ah = imgAlas.naturalHeight;
            const sa = Math.max(aw, ah) + 8;
            siluetAlas = document.createElement('canvas');
            siluetAlas.width = sa;
            siluetAlas.height = sa;
            const ga = siluetAlas.getContext('2d');
            ga.drawImage(imgAlas, sa / 2 - aw / 2, sa / 2 - ah / 2);
            ga.globalCompositeOperation = 'source-in';
            ga.fillStyle = '#cbd5e1';
            ga.fillRect(0, 0, sa, sa);

            const st = 320;
            siluetTurret = document.createElement('canvas');
            siluetTurret.width = st;
            siluetTurret.height = st;
            const gt = siluetTurret.getContext('2d');
            gt.translate(st / 2, st / 2);
            const lw = imgLaras.naturalWidth;
            gt.drawImage(imgLaras, -lw / 2 - JARAK_LARAS, LARAS_OFFSET_Y);
            gt.drawImage(imgLaras, -lw / 2, LARAS_OFFSET_Y);
            gt.drawImage(imgLaras, -lw / 2 + JARAK_LARAS, LARAS_OFFSET_Y);
            gt.drawImage(imgRumah, 0, 76, RUMAH_W, RUMAH_H,
                         -RUMAH_W / 2, -RUMAH_H / 2, RUMAH_W, RUMAH_H);
            gt.setTransform(1, 0, 0, 1, 0, 0);
            gt.globalCompositeOperation = 'source-in';
            gt.fillStyle = '#cbd5e1';
            gt.fillRect(0, 0, st, st);

            siluetSiap = true;
        }

        // ==========================================
        // WARNA
        // ==========================================
        function siapkanWarna() {
            RGB_TINGKAT = TINGKAT_WARNA.map(hexKeRgb);
            RGB_DASAR = [];
            RGB_GOSONG = [];

            if (imgSel.naturalWidth === 0) {
                for (let i = 0; i < N; i++) {
                    RGB_DASAR.push([136, 136, 136]);
                    RGB_GOSONG.push([68, 68, 68]);
                }
                warnaSiap = true;
                return;
            }

            const oc = document.createElement('canvas');
            oc.width = PIX; oc.height = PIX;
            const octx = oc.getContext('2d');
            octx.drawImage(imgSel, 0, 0, PIX, PIX);
            const d = octx.getImageData(0, 0, PIX, PIX).data;

            for (let i = 0; i < N; i++) {
                const r = d[i * 4], g = d[i * 4 + 1], b = d[i * 4 + 2];
                RGB_DASAR.push([r, g, b]);
                RGB_GOSONG.push([(r * 0.55) | 0, (g * 0.55) | 0, (b * 0.55) | 0]);
            }
            warnaSiap = true;
        }

        // ==========================================
        // CHUNK
        // ==========================================
        function kunciChunk(cx, cy) {
            return cx + ',' + cy;
        }

        function ambilChunk(x, y) {
            const cx = Math.floor(x / CHUNK_W);
            const cy = Math.floor(y / CHUNK_W);
            const key = kunciChunk(cx, cy);
            let ch = chunks.get(key);
            if (!ch) {
                const kanvas = document.createElement('canvas');
                kanvas.width = CHUNK_PX;
                kanvas.height = CHUNK_PX;
                const cctx = kanvas.getContext('2d');

                const siluet = document.createElement('canvas');
                siluet.width = CHUNK_SEL;
                siluet.height = CHUNK_SEL;
                const sctx = siluet.getContext('2d');

                ch = {
                    key,
                    gx: cx,
                    gy: cy,
                    x: cx * CHUNK_W,
                    y: cy * CHUNK_W,
                    cells: [],
                    canvas: kanvas,
                    cctx,
                    img: cctx.createImageData(CHUNK_PX, CHUNK_PX),
                    siluetCanvas: siluet,
                    siluetCtx: sctx,
                    siluetImg: sctx.createImageData(CHUNK_SEL, CHUNK_SEL),
                    dirty: true,
                    terakhirGambar: -Infinity,
                    kluster: null
                };
                chunks.set(key, ch);
                dirtyChunks.add(ch);
                klusterDirty = true;
            }
            return ch;
        }

        // Gambar ulang isi chunk: detail sel dan siluetnya sekaligus
        function renderChunk(ch) {
            const d = ch.img.data;
            d.fill(0);
            const s = ch.siluetImg.data;
            s.fill(0);

            for (const c of ch.cells) {
                let ada = false, panas = false;

                for (let i = 0; i < N; i++) {
                    if (c.pix[i] === 0) continue;
                    ada = true;

                    const lx = i % PIX;
                    const ly = (i - lx) / PIX;
                    const px = c.ox * PIX + lx;
                    const py = c.oy * PIX + ly;
                    const o = (py * CHUNK_PX + px) * 4;

                    const h = c.heat[i];
                    if (h > 0) panas = true;
                    let rgb;
                    if (h > 0) rgb = RGB_TINGKAT[h];
                    else rgb = c.gosong[i] ? RGB_GOSONG[i] : RGB_DASAR[i];

                    d[o] = rgb[0];
                    d[o + 1] = rgb[1];
                    d[o + 2] = rgb[2];
                    d[o + 3] = 255;
                }

                if (ada) {
                    const so = (c.oy * CHUNK_SEL + c.ox) * 4;
                    if (panas) {
                        s[so] = 251; s[so + 1] = 146; s[so + 2] = 60;
                    } else {
                        s[so] = 148; s[so + 1] = 163; s[so + 2] = 184;
                    }
                    s[so + 3] = 255;
                }
            }

            ch.cctx.putImageData(ch.img, 0, 0);
            ch.siluetCtx.putImageData(ch.siluetImg, 0, 0);
            ch.dirty = false;
            if (ch.kluster) ch.kluster.dirty = true;
        }

        // Chunk kotor hanya digambar ulang paling sering setiap INTERVAL_RENDER_CHUNK
        function renderChunkKotor(sekarang) {
            for (const ch of dirtyChunks) {
                if (sekarang - ch.terakhirGambar >= INTERVAL_RENDER_CHUNK) {
                    renderChunk(ch);
                    ch.terakhirGambar = sekarang;
                    dirtyChunks.delete(ch);
                }
            }
        }

        function tandai(c) {
            c.chunk.dirty = true;
            dirtyChunks.add(c.chunk);
        }

        // ==========================================
        // SEL
        // ==========================================
        function buatSel(x, y) {
            const ch = ambilChunk(x, y);
            const sel = {
                x, y,
                chunk: ch,
                ox: Math.round((x - ch.x) / SEL),
                oy: Math.round((y - ch.y) / SEL),
                pix: new Uint8Array(N).fill(1),
                heat: new Uint8Array(N),
                timer: new Float32Array(N),
                gosong: new Uint8Array(N),
                inList: new Uint8Array(N),
                panas: [],
                sisa: N,
                hot: 0,
                radar: 0,
                kena: 0
            };
            ch.cells.push(sel);
            totalPikselCount += N;
            tandai(sel);
            return sel;
        }

        function lepasSel(c) {
            const ch = c.chunk;
            const i = ch.cells.indexOf(c);
            if (i >= 0) ch.cells.splice(i, 1);
            activeCells.delete(c);
            hotCells.delete(c);

            if (ch.cells.length === 0) {
                chunks.delete(ch.key);
                dirtyChunks.delete(ch);
                klusterDirty = true;
            } else {
                ch.dirty = true;
                dirtyChunks.add(ch);
            }
        }

        function initSiap() {
            if (!imgSel.complete) return false;
            if (!warnaSiap) siapkanWarna();
            if (!sudahInit) {
                sudahInit = true;
                for (let j = 0; j < 2; j++) {
                    for (let i = 0; i < 2; i++) {
                        sels.push(buatSel(TARGET_X + i * SEL, TARGET_Y + j * SEL));
                    }
                }
            }
            return true;
        }

        function hapusPiksel(c, idx) {
            if (c.pix[idx] === 0) return;
            c.pix[idx] = 0;
            c.heat[idx] = 0;
            c.sisa--;
            totalPikselCount--;
            if (c.sisa === 0) habisSel.push(c);
            tandai(c);
        }

        function setHeat(c, idx, tingkat) {
            if (c.pix[idx] === 0) return;
            if (tingkat > c.heat[idx]) {
                if (c.heat[idx] === 0 && !c.inList[idx]) {
                    c.inList[idx] = 1;
                    c.panas.push(idx);
                }
                c.heat[idx] = tingkat;
                c.timer[idx] = TINGKAT_DURASI[tingkat];
                c.hot = c.panas.length;
                hotCells.add(c);
                tandai(c);
            }
            if (tingkat === MAX_TINGKAT && !c.gosong[idx]) {
                c.gosong[idx] = 1;
                tandai(c);
            }
        }

        // Pendinginan hanya untuk sel yang ada di hotCells
        function updateDingin(c, dt) {
            const list = c.panas;
            for (let k = list.length - 1; k >= 0; k--) {
                const idx = list[k];
                const h = c.heat[idx];

                if (h === 0 || c.pix[idx] === 0) {
                    c.inList[idx] = 0;
                    list[k] = list[list.length - 1];
                    list.pop();
                    continue;
                }

                c.timer[idx] -= dt;
                if (c.timer[idx] <= 0) {
                    const berikut = TINGKAT_BERIKUT[h];
                    c.heat[idx] = berikut;
                    tandai(c);
                    if (berikut > 0) {
                        c.timer[idx] = TINGKAT_DURASI[berikut];
                    } else {
                        c.inList[idx] = 0;
                        list[k] = list[list.length - 1];
                        list.pop();
                    }
                }
            }
            c.hot = list.length;
        }

        function cariSel(x, y) {
            const ch = chunks.get(kunciChunk(Math.floor(x / CHUNK_W), Math.floor(y / CHUNK_W)));
            if (!ch) return null;
            for (const c of ch.cells) {
                if (x >= c.x && x < c.x + SEL && y >= c.y && y < c.y + SEL) return c;
            }
            return null;
        }

        // ==========================================
        // KAPAL RAKSASA (bertahap)
        // ==========================================
        function antreKapalRaksasa() {
            if (antreanSpawn.length > 0 && antreanPos < antreanSpawn.length) return;

            antreanSpawn = [];
            antreanPos = 0;

            const x0 = Math.floor((camX + KAPAL_JARAK_X) / SEL) * SEL - Math.floor(KAPAL_W / 2) * SEL;
            const y0 = Math.floor(camY / SEL) * SEL - Math.floor(KAPAL_H / 2) * SEL;
            const cx = KAPAL_W / 2, cy = KAPAL_H / 2;
            const rx = KAPAL_W / 2, ry = KAPAL_H / 2;

            for (let j = 0; j < KAPAL_H; j++) {
                for (let i = 0; i < KAPAL_W; i++) {
                    const dx = (i + 0.5 - cx) / rx;
                    const dy = (j + 0.5 - cy) / ry;
                    if (dx * dx + dy * dy <= 1) {
                        antreanSpawn.push({ x: x0 + i * SEL, y: y0 + j * SEL });
                    }
                }
            }
        }

        function prosesAntreKapal() {
            if (antreanPos >= antreanSpawn.length) {
                if (antreanSpawn.length > 0) {
                    antreanSpawn = [];
                    antreanPos = 0;
                }
                return;
            }
            const batas = Math.min(antreanSpawn.length, antreanPos + SPAWN_PER_FRAME);
            for (; antreanPos < batas; antreanPos++) {
                const p = antreanSpawn[antreanPos];
                sels.push(buatSel(p.x, p.y));
            }
        }

        // ==========================================
        // KLUSTER CHUNK (dihitung ulang hanya saat struktur chunk berubah)
        // ==========================================
        function hitungKluster() {
            const sudah = new Set();
            const hasil = [];
            for (const ch of chunks.values()) {
                if (sudah.has(ch.key)) continue;

                const antrean = [ch];
                sudah.add(ch.key);
                const anggota = [];
                let sumX = 0, sumY = 0, jumlahSel = 0;
                let minGx = Infinity, minGy = Infinity, maxGx = -Infinity, maxGy = -Infinity;

                while (antrean.length) {
                    const c = antrean.pop();
                    anggota.push(c);
                    sumX += c.x + CHUNK_W / 2;
                    sumY += c.y + CHUNK_W / 2;
                    jumlahSel += c.cells.length;
                    if (c.gx < minGx) minGx = c.gx;
                    if (c.gy < minGy) minGy = c.gy;
                    if (c.gx > maxGx) maxGx = c.gx;
                    if (c.gy > maxGy) maxGy = c.gy;

                    const tetangga = [[1, 0], [-1, 0], [0, 1], [0, -1]];
                    for (const [dx, dy] of tetangga) {
                        const nb = chunks.get(kunciChunk(c.gx + dx, c.gy + dy));
                        if (nb && !sudah.has(nb.key)) {
                            sudah.add(nb.key);
                            antrean.push(nb);
                        }
                    }
                }

                const k = {
                    x: sumX / anggota.length,
                    y: sumY / anggota.length,
                    sel: jumlahSel,
                    anggota,
                    minGx, minGy,
                    gw: maxGx - minGx + 1,
                    gh: maxGy - minGy + 1,
                    canvas: null,
                    dirty: true
                };
                for (const c of anggota) c.kluster = k;
                hasil.push(k);
            }
            klusterList = hasil;
        }

        // Satu kanvas siluet per kelompok: 1 piksel per sel
        function buatCanvasKluster(k) {
            const c = document.createElement('canvas');
            c.width = k.gw * CHUNK_SEL;
            c.height = k.gh * CHUNK_SEL;
            const g = c.getContext('2d');
            for (const ch of k.anggota) {
                g.drawImage(ch.siluetCanvas, (ch.gx - k.minGx) * CHUNK_SEL, (ch.gy - k.minGy) * CHUNK_SEL);
            }
            k.canvas = c;
            k.dirty = false;
        }

        // ==========================================
        // KOORDINAT
        // ==========================================
        function pivotWorld() {
            return { x: camX, y: camY + PIVOT_Y_OFFSET };
        }

        function muzzleWorld(ox, oy) {
            const p = pivotWorld();
            const c = Math.cos(currentAngle + Math.PI / 2);
            const s = Math.sin(currentAngle + Math.PI / 2);
            return { x: p.x + (ox * c - oy * s), y: p.y + (ox * s + oy * c) };
        }

        function toScreenX(x) { return (x - camX) * skala + canvas.width / 2; }
        function toScreenY(y) { return (y - camY) * skala + canvas.height / 2; }

        // ==========================================
        // TOMBOL
        // ==========================================
        function tombolFire() { return { x: canvas.width - 80, y: canvas.height - 110, r: TOMBOL_R }; }
        function tombolSpawn() { return { x: 80, y: canvas.height - 110, r: TOMBOL_R }; }
        function tombolZoomIn() { return { x: canvas.width - 40, y: canvas.height / 2 - 40, r: TOMBOL_ZOOM_R }; }
        function tombolZoomOut() { return { x: canvas.width - 40, y: canvas.height / 2 + 40, r: TOMBOL_ZOOM_R }; }
        function tombolDebug() { return { x: canvas.width / 2, y: canvas.height - 24, w: 110, h: 28 }; }
        function tombolRaksasa() { return { x: canvas.width / 2 - 130, y: canvas.height - 24, w: 110, h: 28 }; }

        function dalamTombol(p, t) {
            return (p.x - t.x) ** 2 + (p.y - t.y) ** 2 <= t.r * t.r;
        }

        function dalamKotak(p, k) {
            return p.x >= k.x - k.w / 2 && p.x <= k.x + k.w / 2 &&
                   p.y >= k.y - k.h / 2 && p.y <= k.y + k.h / 2;
        }

        function ubahZoom(arah) {
            skala = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, skala * (arah > 0 ? ZOOM_LANGKAH : 1 / ZOOM_LANGKAH)));
        }

        // ==========================================
        // AKSI
        // ==========================================
        function tembak() {
            sfxTembak.currentTime = 0;
            sfxTembak.play().catch(() => {});

            let offsetX = 0;
            if (giliranTembak === 0) { offsetX = -JARAK_LARAS; recoilKiri = RECOIL_MAX; }
            if (giliranTembak === 1) { offsetX = 0; recoilTengah = RECOIL_MAX; }
            if (giliranTembak === 2) { offsetX = JARAK_LARAS; recoilKanan = RECOIL_MAX; }

            const m = muzzleWorld(offsetX, LARAS_OFFSET_Y);

            bullets.push({
                x: m.x, y: m.y,
                angle: currentAngle,
                kecepatan: KECEPATAN_PELURU,
                awal: KECEPATAN_PELURU,
                ketahanan: KETAHANAN_YAMATO,
                tingkat: 0,
                tembus: 0,
                panas: 0,
                jarak: 0,
                mati: false
            });

            effects.push({
                x: m.x, y: m.y,
                angle: currentAngle,
                img: (giliranTembak === 2) ? imgKilatan2 : imgKilatan1,
                life: KILATAN_DURASI,
                total: KILATAN_DURASI
            });

            giliranTembak = (giliranTembak + 1) % 3;
            fireCooldown = FIRE_INTERVAL;
        }

        function spawnSel() {
            if (!warnaSiap) return;
            const m = muzzleWorld(0, LARAS_OFFSET_Y);
            const cs = Math.cos(currentAngle), sn = Math.sin(currentAngle);

            for (let k = 0; k < MAKS_TUMPUK; k++) {
                const jarak = (JARAK_SPAWN_SEL + k) * SEL;
                const tx = m.x + cs * jarak;
                const ty = m.y + sn * jarak;
                const sx = Math.floor(tx / SEL) * SEL;
                const sy = Math.floor(ty / SEL) * SEL;
                if (!sels.some(c => c.x === sx && c.y === sy)) {
                    sels.push(buatSel(sx, sy));
                    return;
                }
            }
        }

        // ==========================================
        // RADAR: per chunk, lalu per sel
        // ==========================================
        function cekRadar(x, y) {
            const cx = Math.floor(x / CHUNK_W), cy = Math.floor(y / CHUNK_W);
            const m = RADAR_MARGIN;

            for (let dy = -1; dy <= 1; dy++) {
                for (let dx = -1; dx <= 1; dx++) {
                    const ch = chunks.get(kunciChunk(cx + dx, cy + dy));
                    if (!ch) continue;

                    if (x < ch.x - m || x > ch.x + CHUNK_W + m ||
                        y < ch.y - m || y > ch.y + CHUNK_W + m) continue;

                    for (const c of ch.cells) {
                        if (x >= c.x - m && x <= c.x + SEL + m &&
                            y >= c.y - m && y <= c.y + SEL + m) {
                            c.radar = RADAR_DURASI;
                            activeCells.add(c);
                        }
                    }
                }
            }
        }

        function buatJamur(c, lx, ly, tingkat, sudut) {
            const cs = Math.cos(sudut), sn = Math.sin(sudut);
            for (let dy = -4; dy <= 4; dy++) {
                for (let dx = -4; dx <= 4; dx++) {
                    const x = lx + dx, y = ly + dy;
                    if (x < 0 || y < 0 || x >= PIX || y >= PIX) continue;
                    const along = dx * cs + dy * sn;
                    const perp = -dx * sn + dy * cs;
                    const d = Math.hypot(along, perp * 0.6);
                    if (d > 4) continue;
                    const idx = y * PIX + x;
                    if (c.pix[idx] === 0) continue;
                    const t = Math.max(1, tingkat - Math.floor(d * 1.5));
                    setHeat(c, idx, t);
                }
            }
        }

        function sentuh(b) {
            const c = cariSel(b.x, b.y);
            if (!c) return;

            const lx = Math.min(PIX - 1, Math.max(0, Math.floor((b.x - c.x) / ZOOM)));
            const ly = Math.min(PIX - 1, Math.max(0, Math.floor((b.y - c.y) / ZOOM)));
            const idx = ly * PIX + lx;
            if (c.pix[idx] === 0) return;

            hapusPiksel(c, idx);
            b.tembus++;
            b.ketahanan--;

            if (b.tingkat < MAX_TINGKAT) {
                b.tingkat++;
                b.kecepatan = Math.floor(b.kecepatan * PENGURANGAN_TINGKAT);
            }
            c.kena = 0.15;
            activeCells.add(c);

            for (let dy = -1; dy <= 1; dy++) {
                for (let dx = -1; dx <= 1; dx++) {
                    if (dx === 0 && dy === 0) continue;
                    const nx = lx + dx, ny = ly + dy;
                    if (nx < 0 || ny < 0 || nx >= PIX || ny >= PIX) continue;
                    const nidx = ny * PIX + nx;
                    if (c.pix[nidx] === 0) continue;
                    if (Math.random() < PANAS_CHANCE) {
                        hapusPiksel(c, nidx);
                    } else {
                        setHeat(c, nidx, Math.min(2, b.tingkat));
                        b.panas++;
                    }
                }
            }

            if (b.ketahanan <= 0 || b.kecepatan < KECEPATAN_MIN) {
                b.mati = true;
                buatJamur(c, lx, ly, b.tingkat, b.angle);
            }
        }

        function majuPeluru(b, dt) {
            const jarak = b.kecepatan * dt;
            const langkah = Math.max(1, Math.ceil(jarak));
            const sub = jarak / langkah;
            const cs = Math.cos(b.angle), sn = Math.sin(b.angle);
            for (let i = 0; i < langkah; i++) {
                b.x += cs * sub;
                b.y += sn * sub;
                b.jarak += sub;
                cekRadar(b.x, b.y);
                sentuh(b);
                if (b.mati) return;
            }
        }

        function catatSelesai(b) {
            lastShot = {
                awal: b.awal,
                sisa: b.kecepatan,
                tembus: b.tembus,
                panas: b.panas,
                tingkat: b.tingkat,
                ketahanan: Math.max(0, b.ketahanan)
            };
        }

        // ==========================================
        // DIAGNOSA PENDINGINAN (hanya saat DEBUG tampil)
        // ==========================================
        function hitungStatus() {
            const tingkat = new Array(MAX_TINGKAT + 1).fill(0);
            let gosong = 0, pakaiTimer = 0, total = 0;
            for (const c of sels) {
                for (let i = 0; i < N; i++) {
                    if (c.pix[i] === 0) continue;
                    total++;
                    tingkat[c.heat[i]]++;
                    if (c.heat[i] > 0) pakaiTimer++;
                    if (c.gosong[i]) gosong++;
                }
            }
            return { tingkat, gosong, pakaiTimer, total, jumlahSel: sels.length };
        }

        function gambarDiagnosa() {
            const s = hitungStatus();
            const baris = [
                'DIAGNOSA PANAS',
                `Sel aktif   : ${s.jumlahSel}`,
                `Piksel total: ${s.total}`,
                `Sedang panas: ${s.pakaiTimer}`,
                `Gosong      : ${s.gosong}`,
                '--- per tingkat ---',
                `Dingin (0)  : ${s.tingkat[0]}`
            ];
            for (let t = 1; t <= MAX_TINGKAT; t++) {
                baris.push(`Tingkat ${t}    : ${s.tingkat[t]}`);
            }

            const pad = 8, lh = 15, w = 200, h = pad * 2 + lh * baris.length;
            const x = canvas.width - w - 10, y = 60;
            ctx.save();
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(x, y, w, h);
            ctx.fillStyle = '#a7f3d0';
            ctx.font = '11px monospace';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            baris.forEach((t, i) => ctx.fillText(t, x + pad, y + pad + i * lh));
            ctx.restore();
        }

        // ==========================================
        // PANEL PROFIL (selalu tampil)
        // ==========================================
        function gambarProfil() {
            const sisaAntre = Math.max(0, antreanSpawn.length - antreanPos);
            const baris = [
                'PROFIL',
                `Skala        : 1 sel = ${METER_PER_SEL} m`,
                `Zoom         : ${skala.toFixed(3)}`,
                `Level        : ${labelLevel(levelSekarang)}`,
                `Sel tampak   : ${selTampak.toFixed(0)}`,
                `FPS          : ${profil.fps}`,
                `Sel          : ${sels.length}`,
                `Antre spawn  : ${sisaAntre}`,
                `Chunk        : ${chunks.size}`,
                `Chunk aktif  : ${profil.chunkAktif}`,
                `Sel radar    : ${profil.radar}`,
                `Sel panas    : ${profil.panas}`,
                `Sel tidur    : ${profil.tidur}`,
                `Peluru       : ${bullets.length}`,
                `Piksel       : ${totalPikselCount}`,
                `Update (ms)  : ${profil.update.toFixed(2)}`,
                `Gambar (ms)  : ${profil.draw.toFixed(2)}`,
                `  - dingin   : ${profil.dingin.toFixed(2)}`,
                `  - sel      : ${profil.sel.toFixed(2)}`,
                `  - panel    : ${profil.panel.toFixed(2)}`
            ];
            const pad = 8, lh = 15, w = 230, h = pad * 2 + lh * baris.length;
            const x = 10, y = 60;
            ctx.save();
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(x, y, w, h);
            ctx.fillStyle = '#fde68a';
            ctx.font = '11px monospace';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            baris.forEach((t, i) => ctx.fillText(t, x + pad, y + pad + i * lh));
            ctx.restore();
        }

        function gambarTombolKotak(t, label, aktif) {
            ctx.save();
            ctx.globalAlpha = aktif ? 0.9 : 0.5;
            ctx.fillStyle = '#000';
            ctx.strokeStyle = '#fde68a';
            ctx.lineWidth = 2;
            ctx.fillRect(t.x - t.w / 2, t.y - t.h / 2, t.w, t.h);
            ctx.strokeRect(t.x - t.w / 2, t.y - t.h / 2, t.w, t.h);
            ctx.fillStyle = '#fde68a';
            ctx.font = 'bold 12px monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(label, t.x, t.y);
            ctx.restore();
        }

        function gambarTombolDebug() {
            gambarTombolKotak(tombolDebug(), debugTampil ? 'DEBUG: ON' : 'DEBUG', debugTampil);
            gambarTombolKotak(tombolRaksasa(), 'RAKSASA', antreanPos < antreanSpawn.length);
        }

        // ==========================================
        // INPUT (multi-sentuh)
        // ==========================================
        function posisi(e) {
            const r = canvas.getBoundingClientRect();
            return { x: e.clientX - r.left, y: e.clientY - r.top };
        }

        function jumlahAim() {
            let n = 0;
            for (const v of pointers.values()) if (v.role === 'aim') n++;
            return n;
        }

        canvas.addEventListener('pointerdown', e => {
            e.preventDefault();
            const p = posisi(e);
            const info = { x: p.x, y: p.y, role: 'aim' };

            if (dalamKotak(p, tombolDebug())) {
                debugTampil = !debugTampil;
                info.role = 'debug';
            } else if (dalamKotak(p, tombolRaksasa())) {
                antreKapalRaksasa();
                info.role = 'raksasa';
            } else if (dalamTombol(p, tombolZoomIn())) {
                ubahZoom(1);
                info.role = 'zoom';
            } else if (dalamTombol(p, tombolZoomOut())) {
                ubahZoom(-1);
                info.role = 'zoom';
            } else if (dalamTombol(p, tombolFire())) {
                info.role = 'fire';
                tembak();
            } else if (dalamTombol(p, tombolSpawn())) {
                info.role = 'spawn';
                spawnSel();
            } else if (jumlahAim() === 0) {
                targetAngle = Math.atan2(p.y - canvas.height / 2, p.x - canvas.width / 2);
            }

            pointers.set(e.pointerId, info);
            lastMid = null;
        });

        canvas.addEventListener('pointermove', e => {
            const info = pointers.get(e.pointerId);
            if (!info) return;
            e.preventDefault();

            const p = posisi(e);
            info.x = p.x;
            info.y = p.y;
            if (info.role !== 'aim') return;

            const aims = [...pointers.values()].filter(v => v.role === 'aim');

            if (aims.length === 1) {
                targetAngle = Math.atan2(info.y - canvas.height / 2, info.x - canvas.width / 2);
                lastMid = null;
            } else {
                const mx = aims.reduce((s, v) => s + v.x, 0) / aims.length;
                const my = aims.reduce((s, v) => s + v.y, 0) / aims.length;
                if (lastMid) {
                    camX -= (mx - lastMid.x) / skala;
                    camY -= (my - lastMid.y) / skala;
                }
                lastMid = { x: mx, y: my };
            }
        });

        const lepasPointer = e => {
            pointers.delete(e.pointerId);
            lastMid = null;
        };
        canvas.addEventListener('pointerup', lepasPointer);
        canvas.addEventListener('pointercancel', lepasPointer);

        // ==========================================
        // GAMBAR
        // ==========================================
        function gambarLatar(level) {
            ctx.fillStyle = '#07080d';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (level !== 'dekat' && level !== 'sedang') return;

            siapkanGrid();
            if (!gridPattern) return;

            const ox = modPositif(toScreenX(0), gridTileSize);
            const oy = modPositif(toScreenY(0), gridTileSize);

            ctx.save();
            ctx.translate(ox, oy);
            ctx.fillStyle = gridPattern;
            ctx.fillRect(-ox, -oy, canvas.width, canvas.height);
            ctx.restore();
        }

        // Dekat dan sedang: canvas per chunk. Jauh: satu siluet per kelompok. Strategis: tidak ada.
        function gambarChunks(level) {
            if (level === 'strategis') return;

            if (level === 'jauh') {
                for (const k of klusterList) {
                    const wx = k.minGx * CHUNK_W, wy = k.minGy * CHUNK_W;
                    const sx = toScreenX(wx), sy = toScreenY(wy);
                    const lw = k.gw * CHUNK_W * skala, lh = k.gh * CHUNK_W * skala;
                    if (sx + lw < 0 || sy + lh < 0 || sx > canvas.width || sy > canvas.height) continue;

                    if (k.dirty || !k.canvas) buatCanvasKluster(k);
                    ctx.drawImage(k.canvas, sx, sy, lw, lh);
                }
                return;
            }

            const ukuranLayar = CHUNK_W * skala;
            for (const ch of chunks.values()) {
                const sx = toScreenX(ch.x), sy = toScreenY(ch.y);
                if (sx + ukuranLayar < 0 || sy + ukuranLayar < 0 ||
                    sx > canvas.width || sy > canvas.height) continue;
                ctx.drawImage(ch.canvas, sx, sy, ukuranLayar, ukuranLayar);
            }
        }

        function gambarEfekSel(c) {
            const sx = toScreenX(c.x), sy = toScreenY(c.y);
            const size = SEL * skala;
            if (sx + size < 0 || sy + size < 0 || sx > canvas.width || sy > canvas.height) return;

            if (c.kena > 0) {
                ctx.fillStyle = 'rgba(248, 113, 113, 0.25)';
                ctx.fillRect(sx, sy, size, size);
            }

            if (RADAR_TAMPIL && c.radar > 0) {
                const m = RADAR_MARGIN * skala;
                ctx.save();
                ctx.setLineDash([4, 3]);
                ctx.strokeStyle = 'rgba(96, 165, 250, 0.7)';
                ctx.lineWidth = 1;
                ctx.strokeRect(sx - m + 0.5, sy - m + 0.5, size + 2 * m - 1, size + 2 * m - 1);
                ctx.restore();
            }
        }

        // Tingkat strategis: satu ikon per kelompok chunk
        function gambarKluster() {
            for (const k of klusterList) {
                const sx = toScreenX(k.x), sy = toScreenY(k.y);
                if (sx < -20 || sy < -20 || sx > canvas.width + 20 || sy > canvas.height + 20) continue;

                const r = Math.min(14, 3 + Math.sqrt(k.sel) * 0.25);
                ctx.beginPath();
                ctx.arc(sx, sy, r, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(147, 197, 253, 0.35)';
                ctx.fill();
                ctx.strokeStyle = 'rgba(147, 197, 253, 0.95)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        function gambarLingkaran(t, warna, aktif, label) {
            ctx.globalAlpha = aktif ? 0.85 : 0.45;
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = warna;
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.fillStyle = warna;
            ctx.font = 'bold 12px monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(label, t.x, t.y);
            ctx.globalAlpha = 1;
        }

        function gambarTombol() {
            const aktifFire = [...pointers.values()].some(v => v.role === 'fire');
            const aktifSpawn = [...pointers.values()].some(v => v.role === 'spawn');
            gambarLingkaran(tombolFire(), '#f87171', aktifFire, 'TEMBAK');
            gambarLingkaran(tombolSpawn(), '#4ade80', aktifSpawn, 'SEL');
            gambarLingkaran(tombolZoomIn(), '#93c5fd', false, '+');
            gambarLingkaran(tombolZoomOut(), '#93c5fd', false, '−');
        }

        function gambarPanelTembakan() {
            const baris = lastShot ? [
                'Tembakan terakhir',
                `Kecepatan awal   : ${lastShot.awal} px/s`,
                `Piksel tembus    : ${lastShot.tembus}`,
                `Tingkat tertinggi: ${lastShot.tingkat}/${MAX_TINGKAT}`,
                `Piksel panas     : ${lastShot.panas}`,
                `Ketahanan sisa   : ${lastShot.ketahanan}`,
                `Kecepatan sisa   : ${lastShot.sisa} px/s`
            ] : ['Belum ada tembakan'];

            const pad = 8, lh = 16, w = 230, h = pad * 2 + lh * baris.length;
            const x = 10, y = 60 + 250;
            ctx.save();
            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            ctx.fillRect(x, y, w, h);
            ctx.fillStyle = '#e5e7eb';
            ctx.font = '12px monospace';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            baris.forEach((t, i) => ctx.fillText(t, x + pad, y + pad + i * lh));
            ctx.restore();
        }

        // ==========================================
        // LOOP UTAMA
        // ==========================================
        let lastTime = performance.now();

        function loop(now) {
            let dt = (now - lastTime) / 1000;
            lastTime = now;
            if (dt > 0.05) dt = 0.05;

            profil.frames++;
            if (now - profil.lastFps >= 1000) {
                profil.fps = profil.frames;
                profil.frames = 0;
                profil.lastFps = now;
            }

            const tUpdate0 = performance.now();
            const siap = initSiap();
            pastikanSiluet();

            levelSekarang = hitungLevel();
            if (klusterDirty) {
                hitungKluster();
                klusterDirty = false;
            }

            let diff = targetAngle - currentAngle;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            currentAngle += diff * (1 - Math.pow(0.9, dt * 60));

            const laju = RECOIL_MAX / RECOIL_DURASI * dt;
            recoilKiri = Math.max(0, recoilKiri - laju);
            recoilTengah = Math.max(0, recoilTengah - laju);
            recoilKanan = Math.max(0, recoilKanan - laju);

            fireCooldown -= dt;
            if (fireCooldown <= 0 && [...pointers.values()].some(v => v.role === 'fire')) {
                tembak();
            }

            if (siap) {
                prosesAntreKapal();

                // Pendinginan: hanya sel yang punya piksel panas
                const tDingin0 = performance.now();
                for (const c of hotCells) {
                    updateDingin(c, dt);
                    if (c.hot === 0) hotCells.delete(c);
                }
                profil.dingin = haluskan(profil.dingin, performance.now() - tDingin0);

                // Radar dan efek kena: hanya sel yang ada di activeCells
                for (const c of activeCells) {
                    if (c.radar > 0) c.radar = Math.max(0, c.radar - dt);
                    if (c.kena > 0) c.kena = Math.max(0, c.kena - dt);
                    if (c.radar === 0 && c.kena === 0) activeCells.delete(c);
                }

                for (let i = bullets.length - 1; i >= 0; i--) {
                    const b = bullets[i];
                    majuPeluru(b, dt);
                    if (b.mati || b.jarak >= JARAK_EFEKTIF_PX) {
                        catatSelesai(b);
                        bullets.splice(i, 1);
                    }
                }

                // Sel yang pikselnya habis dibuang di sini, bukan dengan filter tiap frame
                if (habisSel.length > 0) {
                    for (const c of habisSel) lepasSel(c);
                    habisSel = [];
                    sels = sels.filter(c => c.sisa > 0);
                }

                // Hitung aktif dan tidur dari himpunan yang sudah dijaga
                let overlap = 0;
                for (const c of hotCells) if (activeCells.has(c)) overlap++;
                const aktifN = activeCells.size + hotCells.size - overlap;

                const chunkAktifSet = new Set();
                for (const c of activeCells) chunkAktifSet.add(c.chunk);
                for (const c of hotCells) chunkAktifSet.add(c.chunk);

                profil.radar = activeCells.size;
                profil.panas = hotCells.size;
                profil.aktif = aktifN;
                profil.tidur = sels.length - aktifN;
                profil.chunkAktif = chunkAktifSet.size;
            }

            for (let i = effects.length - 1; i >= 0; i--) {
                effects[i].life -= dt;
                if (effects[i].life <= 0) effects.splice(i, 1);
            }

            profil.update = haluskan(profil.update, performance.now() - tUpdate0);

            // ----- GAMBAR -----
            const tDraw0 = performance.now();
            const detail = (levelSekarang === 'dekat' || levelSekarang === 'sedang');

            gambarLatar(levelSekarang);

            if (siap) {
                renderChunkKotor(now);

                const tSel0 = performance.now();
                gambarChunks(levelSekarang);
                if (detail) {
                    for (const c of activeCells) gambarEfekSel(c);
                } else if (levelSekarang === 'strategis') {
                    gambarKluster();
                }
                profil.sel = haluskan(profil.sel, performance.now() - tSel0);
            }

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            if (detail || !siluetSiap) {
                ctx.save();
                ctx.translate(cx, cy);
                ctx.scale(skala, skala);

                if (imgAlas.complete && imgAlas.naturalWidth > 0) {
                    ctx.drawImage(imgAlas, -imgAlas.width / 2, -imgAlas.height / 2);
                }

                ctx.translate(0, PIVOT_Y_OFFSET);
                ctx.rotate(currentAngle + Math.PI / 2);

                if (imgLaras.complete && imgLaras.naturalWidth > 0) {
                    ctx.drawImage(imgLaras, -imgLaras.width / 2 - JARAK_LARAS, LARAS_OFFSET_Y + recoilKiri);
                    ctx.drawImage(imgLaras, -imgLaras.width / 2, LARAS_OFFSET_Y + recoilTengah);
                    ctx.drawImage(imgLaras, -imgLaras.width / 2 + JARAK_LARAS, LARAS_OFFSET_Y + recoilKanan);
                }

                if (imgRumah.complete && imgRumah.naturalWidth > 0) {
                    ctx.drawImage(imgRumah, 0, 76, RUMAH_W, RUMAH_H,
                                  -RUMAH_W / 2, -RUMAH_H / 2, RUMAH_W, RUMAH_H);
                }
                ctx.restore();
            } else {
                ctx.save();
                ctx.translate(cx, cy);
                ctx.scale(skala, skala);

                ctx.drawImage(siluetAlas, -siluetAlas.width / 2, -siluetAlas.height / 2);

                ctx.translate(0, PIVOT_Y_OFFSET);
                ctx.rotate(currentAngle + Math.PI / 2);
                ctx.drawImage(siluetTurret, -siluetTurret.width / 2, -siluetTurret.height / 2);
                ctx.restore();
            }

            for (const f of effects) {
                if (!f.img.complete || f.img.naturalWidth === 0) continue;
                const sx = toScreenX(f.x), sy = toScreenY(f.y);
                const maju = f.img.naturalHeight * KILATAN_SKALA * KILATAN_MAJU * skala;
                ctx.save();
                ctx.translate(sx + Math.cos(f.angle) * maju, sy + Math.sin(f.angle) * maju);
                ctx.rotate(f.angle + Math.PI / 2);
                ctx.globalAlpha = Math.max(0, f.life / f.total);
                const w = Math.max(f.img.naturalWidth * KILATAN_SKALA * skala, 3);
                const h = Math.max(f.img.naturalHeight * KILATAN_SKALA * skala, 4);
                ctx.drawImage(f.img, -w / 2, -h / 2, w, h);
                ctx.restore();
            }

            if (imgPeluru.complete && imgPeluru.naturalWidth > 0) {
                for (const b of bullets) {
                    const bx = toScreenX(b.x), by = toScreenY(b.y);
                    if (bx < -50 || by < -50 || bx > canvas.width + 50 || by > canvas.height + 50) continue;

                    const gep = Math.max(0, Math.min(1,
                        (GEPENG_MULAI - b.kecepatan) / (GEPENG_MULAI - KECEPATAN_MIN)));
                    const w = Math.max(PELURU_W * skala, 3) * (1 + 3 * gep);
                    const h = Math.max(PELURU_H * skala, 7) * (1 - 0.5 * gep);
                    const ekor = Math.max(30 * skala, 8);

                    ctx.save();
                    ctx.translate(bx, by);
                    ctx.rotate(b.angle + Math.PI / 2);
                    ctx.drawImage(imgPeluru, -w / 2, -h / 2, w, h);

                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(0, ekor);
                    ctx.strokeStyle = 'rgba(253, 224, 71, 0.6)';
                    ctx.lineWidth = Math.max(3 * skala, 2);
                    ctx.stroke();
                    ctx.restore();
                }
            }

            gambarTombol();
            gambarTombolDebug();

            const tPanel0 = performance.now();
            gambarProfil();
            if (debugTampil) {
                gambarPanelTembakan();
                gambarDiagnosa();
            }
            profil.panel = haluskan(profil.panel, performance.now() - tPanel0);

            profil.draw = haluskan(profil.draw, performance.now() - tDraw0);

            requestAnimationFrame(loop);
        }

        requestAnimationFrame(loop);
    </script>
</body>
</html>
